name: ci

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs are wasted runners and wasted attention. Pushing a fix
# while the previous run is still going used to leave two full Rust builds
# compiling side by side; only the newest commit matters, so cancel the older.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide once whether the tree changed in a way that could affect behaviour.
  # `dorny/paths-filter` would do the same with an extra dependency; a plain
  # git diff against the previous SHA needs nothing and states exactly which
  # paths matter.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          # `before` is all-zeros on a first push or a manual dispatch; in that
          # case we cannot diff, so assume code changed and run everything.
          before='${{ github.event.before }}'
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$before" HEAD -- \
               ':!**.md' ':!docs/**' ':!LICENSE' ':!.handoff/**' \
               ':!design/**' ':!.vscode/**' ':!.github/ISSUE_TEMPLATE/**'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only docs/assets changed — skipping the build and test jobs."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # No `with: version` here on purpose. The action reads
      # `packageManager` from package.json (pnpm@11.21.0) and errors out with
      # "Multiple versions of pnpm specified" if this also names one. Pinning
      # it in one place means CI and a local shell can never disagree.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Cheap, and it catches the failure where a release tag says 0.1.2 while
      # the shipped binary still claims 0.1.1 — which the updater then treats
      # as "already current" and refuses to install.
      - name: Version consistency
        run: pnpm version:check

      - name: Architecture boundaries
        run: pnpm deps:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web bundle
        run: pnpm --filter @todolist/desktop build

  # The desktop binary needs a Rust toolchain and a cold build costs minutes,
  # so this job only runs where it can actually catch something the web job
  # cannot: a Rust compile error. PRs get the fast web gate; `main` gets the
  # binary check as well, and only when Rust or its inputs moved.
  desktop:
    # Runs alongside `verify`, not after it. The two share no artifacts and
    # neither reads the other's state — `desktop` does its own install and its
    # own diff. Serialising them added the web gate's ~1 minute to the Rust
    # build's wall-clock for no benefit, since they sit on separate runners.
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A commit that only touched TypeScript cannot break the Rust build, and
      # recompiling it costs more than the rest of CI combined.
      - name: Did anything the binary depends on change?
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$before" HEAD -- apps/desktop/src-tauri packages apps/desktop/src apps/desktop/package.json pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Rust or shared-input changes — skipping the desktop build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.rust.outputs.changed == 'true'
      - uses: actions/setup-node@v7
        if: steps.rust.outputs.changed == 'true'
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.rust.outputs.changed == 'true'

      # Without this the job recompiles ~400 crates from scratch every run.
      # That was the single largest cost in CI: 5m30s of a 6m40s job, against
      # 57s for the entire web gate. release.yml already had this; ci.yml did
      # not, so every push paid full price for a build that had not changed.
      #
      # It must come *after* the toolchain step so the cache key includes the
      # resolved compiler version — caching a stable toolchain's artifacts
      # under a version-agnostic key is how you get stale-object link errors
      # that only appear the week a new Rust ships.
      - uses: swatinem/rust-cache@v2
        if: steps.rust.outputs.changed == 'true'
        with:
          workspaces: apps/desktop/src-tauri -> target
          # Tauri pulls in several hundred transitive crates; caching only the
          # workspace's own artifacts would leave most of the cold compile in
          # place.
          cache-all-crates: true
          # A failed build still warms the cache for the fix that follows.
          cache-on-failure: true
          # Default is true, which mixes the job id into the cache key — so a
          # cache written by ci.yml's desktop job could never be read by
          # release.yml's publish job, and both paid full compile price. The
          # key already includes the lockfile hash, toolchain and workspace
          # path, which is what actually determines whether the objects are
          # reusable.
          add-job-id-key: false

      - name: Install
        if: steps.rust.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build desktop app
        if: steps.rust.outputs.changed == 'true'
        # `--no-bundle` on purpose. `tauri.conf.json` has
        # `createUpdaterArtifacts: true`, so bundling signs the installer and
        # fails outright when TAURI_SIGNING_PRIVATE_KEY is absent — and it must
        # stay absent here, because CI on a fork PR never sees the secret. This
        # job only proves the Rust side compiles and links; the signed bundle
        # is release.yml's job, where the key does exist.
        run: pnpm --filter @todolist/desktop tauri build --no-bundle
