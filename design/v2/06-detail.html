<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairos v2 · 详情面板</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="demo.css">
<script src="data.js" defer></script>
<script src="radio.js" defer></script>
<script src="base.js" defer></script>
<style>
  body {
    margin: 0;
    background: var(--bg-app);
    color: var(--ink-1);
    font: var(--text-md)/1.5 var(--font-sans);
  }

  /* ---------- 左栏：视图与清单 ---------- */
  .srow {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    block-size: var(--control-h);
    padding: 0 var(--sp-2);
    border-radius: var(--radius-sm);
    color: var(--ink-1);
    font-size: var(--text-body);
  }
  .srow--current {
    background: var(--accent-tint);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .srow__dot {
    inline-size: 6px;
    block-size: 6px;
    border-radius: 50%;
    flex: none;
  }
  .srow .sidebar__count { margin-inline-start: auto; color: var(--ink-quiet); }
  /* shared.css 的 .sidebar__count / .topbar__sub / .when--none 用 --ink-3，
     在 refined/light 的 --bg-app 上只有 4.22–4.33，低于 4.5 的文字下限。
     --ink-quiet 六个组合都在 5.4 以上，所以在这一页覆盖。 */
  .sidebar__count,
  .topbar__sub,
  .when--none { color: var(--ink-quiet); }
  .sidebar__sep {
    block-size: 1px;
    margin: var(--sp-2) var(--sp-2);
    background: var(--hairline);
  }
  .sidebar__hint {
    margin: auto 0 var(--sp-1);
    padding: var(--sp-3) var(--sp-2) 0;
    border-block-start: 1px solid var(--hairline);
    color: var(--ink-quiet);
    font-size: var(--text-xs);
    line-height: 1.5;
  }

  /* ---------- 顶栏 ---------- */
  .kbd-hint {
    margin-inline-start: auto;
    padding-inline-end: 13rem; /* clear the fixed demo bar */
    color: var(--ink-quiet);
    font-size: var(--text-xs);
    white-space: nowrap;
  }
  .kbd-hint kbd {
    display: inline-block;
    padding: 1px 5px;
    border: 1px solid var(--hairline-strong);
    border-block-end-width: 2px;
    border-radius: var(--radius-xs);
    background: var(--bg-subtle);
    color: var(--ink-2);
    font: inherit;
    font-size: 10px;
    line-height: 1.4;
  }

  /* ---------- 工作区 ---------- */
  .workarea {
    flex: 1;
    min-block-size: 0;
    display: flex;
    overflow: hidden;
    background: var(--bg-app);
  }
  .listpane {
    flex: 1;
    min-inline-size: 0;
    overflow-y: auto;
    padding: var(--sp-4) var(--sp-5) var(--sp-8);
  }
  .listpane__hint {
    margin: 0 0 var(--sp-3);
    padding: 0 var(--sp-2);
    color: var(--ink-quiet);
    font-size: var(--text-xs);
  }
  .rows { display: flex; flex-direction: column; gap: 2px; }

  .lrow {
    appearance: none;
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    inline-size: 100%;
    block-size: 40px;
    padding: 0 var(--sp-2) 0 var(--sp-3);
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--ink-1);
    font: inherit;
    text-align: start;
    cursor: pointer;
  }
  .lrow:hover { background: var(--bg-hover); }
  .lrow:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: -2px;
  }
  .lrow--sel,
  .lrow--sel:hover {
    background: var(--bg-surface);
    box-shadow: inset 2px 0 0 var(--accent), inset 0 0 0 1px var(--hairline-strong);
  }
  .lrow__title {
    flex: 1;
    min-inline-size: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: var(--text-md);
  }
  .lrow--sel .lrow__title { font-weight: 600; }
  .lrow .when { flex: none; }

  /* ---------- 右侧 inspector ---------- */
  .inspector {
    inline-size: 380px;
    flex: none;
    display: flex;
    flex-direction: column;
    min-block-size: 0;
    background: var(--bg-surface);
    border-inline-start: 1px solid var(--hairline);
    box-shadow: var(--shadow-sm);
  }
  .inspector[hidden] { display: none; }

  .insp__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    padding: var(--sp-3) var(--sp-5);
    border-block-end: 1px solid var(--hairline);
  }
  .insp__eyebrow {
    font-size: var(--text-xs);
    font-weight: 600;
    color: var(--ink-2);
  }
  .saved {
    margin-inline-start: auto;
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    color: var(--success-ink);
    font-size: var(--text-xs);
    font-weight: 500;
    opacity: 0;
    translate: 0 2px;
    transition: opacity var(--dur-fast) var(--ease), translate var(--dur-fast) var(--ease);
  }
  .saved[data-on] { opacity: 1; translate: 0 0; }
  .saved svg { flex: none; }

  .insp__body {
    flex: 1;
    min-block-size: 0;
    overflow-y: auto;
    padding: 0 var(--sp-5);
  }
  .dsec {
    padding-block: var(--sp-4);
    border-block-end: 1px solid var(--hairline);
  }
  .dsec:last-child { border-block-end: 0; }
  .dsec--title { padding-block-start: var(--sp-4); }
  .dsec__head {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    min-block-size: var(--sp-5);
    margin-block-end: var(--sp-2);
  }
  .dsec__head h3 {
    margin: 0;
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--ink-2);
  }
  .dsec__foot {
    margin: var(--sp-2) 0 0;
    color: var(--ink-quiet);
    font-size: var(--text-xs);
    line-height: 1.5;
  }
  .dsec__foot b { color: var(--ink-2); font-weight: 600; }
  .dsec__foot b.is-danger { color: var(--danger-ink); }
  .dsec__foot b.is-warning { color: var(--warning-ink); }

  .due {
    margin-inline-start: auto;
    font-size: var(--text-sm);
    font-weight: 600;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .due--danger { color: var(--danger-ink); }
  .due--warning { color: var(--warning-ink); }
  .due--normal { color: var(--ink-2); }
  .due--muted { color: var(--ink-quiet); font-weight: 500; }

  .insp__title {
    appearance: none;
    display: block;
    inline-size: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-1);
    font: inherit;
    font-size: var(--text-xl);
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.01em;
  }
  .insp__title::placeholder { color: var(--ink-quiet); font-weight: 500; }
  .insp__title:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 4px;
    border-radius: var(--radius-xs);
  }
  .insp__meta {
    margin: var(--sp-2) 0 0;
    color: var(--ink-quiet);
    font-size: var(--text-xs);
  }

  /* ---------- 时间阶梯：一条轴，六个停靠点 ---------- */
  .ladder {
    display: flex;
    flex-direction: column;
    gap: 2px;
    position: relative;
  }
  /* 精度轴：竖线从第一颗点到最后一颗点。行底色盖住行内那一段，
     只在行与行之间露出，读成一架梯子而不是六个按钮。 */
  .ladder::before {
    content: "";
    position: absolute;
    inset-block: 15px;
    inset-inline-start: 14px;
    inline-size: 1px;
    background: var(--hairline-strong);
  }
  .rung {
    appearance: none;
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    inline-size: 100%;
    block-size: 30px;
    padding: 0 var(--sp-2);
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--ink-2);
    font: inherit;
    font-size: var(--text-body);
    text-align: start;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .rung:hover { background: var(--bg-hover); color: var(--ink-1); }
  .rung:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .rung__mark {
    inline-size: 14px;
    block-size: 14px;
    flex: none;
    margin-inline-start: 2px;
    /* 每一档的标记就是它在行上的形状；六档不能是六个一样的圆点。 */
    border: 1px dashed var(--ink-3);
    border-radius: 999px;
    box-sizing: border-box;
    background: var(--bg-surface);
  }
  .rung__name { font-weight: 500; }
  .rung__ex {
    margin-inline-start: auto;
    color: var(--ink-quiet);
    font-size: var(--text-xs);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .rung[aria-checked="true"] {
    background: var(--accent-tint);
    color: var(--accent-ink);
    box-shadow: inset 0 0 0 1px var(--accent-ink);
  }
  .rung[aria-checked="true"] .rung__name { font-weight: 600; }
  .rung[data-rung="week"] .rung__mark {
    border: 0; border-inline: 2px solid var(--ink-3); border-radius: 0;
  }
  .rung[data-rung="day"] .rung__mark {
    border: 1px solid var(--ink-3); border-radius: 3px; background: var(--bg-subtle);
  }
  .rung[data-rung="period"] .rung__mark {
    border: 1px solid var(--ink-3); border-radius: 999px; background: var(--bg-subtle);
  }
  .rung[data-rung="time"] .rung__mark {
    border: 1px solid var(--ink-1); border-radius: 3px; background: var(--ink-1);
  }
  .rung[data-rung="none"] .rung__mark {
    border: 0; border-block-start: 1px solid var(--ink-quiet); border-radius: 0;
  }
  /* 选中 = 换色 + 加深边界，形状不变。
     填满实心会把「某一天」变成和「具体时刻」一样的方块。 */
  .rung[aria-checked="true"] .rung__mark {
    border-color: var(--accent-ink);
    box-shadow: inset 0 0 0 1px var(--accent-ink);
  }
  .rung[data-rung="time"][aria-checked="true"] .rung__mark { background: var(--accent-ink); }
  .rung[data-rung="day"][aria-checked="true"] .rung__mark { background: var(--accent-tint); }
  .rung[data-rung="week"][aria-checked="true"] .rung__mark {
    border: 0; border-inline: 2px solid var(--accent-ink); background: transparent;
  }
  .rung[data-rung="none"][aria-checked="true"] .rung__mark {
    border: 0; border-block-start: 2px solid var(--accent-ink); background: transparent;
  }
  .rung[aria-checked="true"] .rung__ex { color: var(--accent-ink); }

  /* 选中档的上下文编辑器：不是新面板，只是同一控件展开的子行 */
  .rung-detail { margin-block-start: var(--sp-2); }
  .rd__chips { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
  .chip {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    block-size: var(--control-h-sm);
    padding: 0 var(--sp-2);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-full);
    background: var(--bg-subtle);
    color: var(--ink-2);
    font: inherit;
    font-size: var(--text-sm);
    white-space: nowrap;
    cursor: pointer;
  }
  .chip:hover { background: var(--bg-hover); color: var(--ink-1); }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .chip--on {
    border-color: var(--accent-ink);
    background: var(--accent-tint);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .chip--cal { border-style: dashed; }
  .rd__hint {
    margin: var(--sp-2) 0 0;
    color: var(--ink-quiet);
    font-size: var(--text-xs);
    line-height: 1.5;
  }
  .rd__hint .nowrap { white-space: nowrap; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  .seg {
    display: flex;
    gap: 2px;
    padding: 2px;
    border-radius: var(--radius-md);
    background: var(--bg-sunken);
  }
  .seg .chip {
    flex: 1;
    justify-content: center;
    block-size: 26px;
    border-color: transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--ink-2);
    font-size: var(--text-sm);
  }
  .seg .chip:hover { background: var(--bg-hover); color: var(--ink-1); }
  .seg .chip--on {
    background: var(--bg-surface);
    color: var(--ink-1);
    box-shadow: var(--shadow-sm);
    border-color: transparent;
  }
  .rd__seg { margin-block-start: var(--sp-2); }
  .rd__row { display: flex; align-items: center; gap: var(--sp-2); margin-block-start: var(--sp-2); }
  .rd__row--wrap { flex-wrap: wrap; }
  .rd__label { color: var(--ink-quiet); font-size: var(--text-xs); flex: none; }

  /* 「几点」的两个输入。5 个固定值只是五个常见时刻，不是全部时刻 ——
     一个 15:40 的会，在这 5 个值里根本选不出来，用户只能把它记错。 */
  .timepair {
    display: flex;
    align-items: center;
    gap: var(--sp-1);
    flex: 1;
    min-inline-size: 0;
  }
  .timepair__in {
    inline-size: 2.75rem;
    text-align: center;
    font-size: var(--text-sm);
    font-variant-numeric: tabular-nums;
  }
  .timepair__in[aria-invalid="true"] {
    border-color: var(--danger-ink);
    color: var(--danger-ink);
  }
  .timepair__sep { color: var(--ink-quiet); font-size: var(--text-sm); }
  .timepair__dash { color: var(--ink-quiet); padding-inline: 2px; }
  .timepair__clear {
    appearance: none;
    block-size: var(--control-h-sm);
    padding: 0 var(--sp-1);
    border: 0;
    border-radius: var(--radius-xs);
    background: transparent;
    color: var(--ink-quiet);
    font: inherit;
    font-size: var(--text-xs);
    cursor: pointer;
  }
  .timepair__clear:hover { background: var(--bg-hover); color: var(--ink-1); }
  .timepair__clear[hidden] { display: none; }
  .timepair__clear:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* 迷你月历 */
  .mgrid {
    margin-block-start: var(--sp-2);
    padding: var(--sp-2);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-md);
    background: var(--bg-subtle);
  }
  .mgrid__head { display: flex; align-items: center; gap: var(--sp-1); margin-block-end: var(--sp-1); }
  .mgrid__label {
    flex: 1;
    text-align: center;
    font-size: var(--text-sm);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .mgrid__nav {
    appearance: none;
    display: grid;
    place-items: center;
    inline-size: 24px;
    block-size: 24px;
    padding: 0;
    border: 0;
    border-radius: var(--radius-xs);
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
  }
  .mgrid__nav:hover { background: var(--bg-hover); color: var(--ink-1); }
  .mgrid__nav:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .mgrid__dow,
  .mgrid__grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
  .mgrid__dow { margin-block-end: 2px; }
  .mgrid__dow span {
    text-align: center;
    color: var(--ink-quiet);
    font-size: var(--text-xs);
    line-height: 1.8;
  }
  .mgrid__day {
    appearance: none;
    block-size: 26px;
    min-inline-size: 0;
    padding: 0;
    border: 1px solid transparent;
    border-radius: var(--radius-xs);
    background: transparent;
    color: var(--ink-1);
    font: inherit;
    font-size: var(--text-xs);
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .mgrid__day:hover { background: var(--bg-hover); }
  .mgrid__day:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
  .mgrid__day--out { color: var(--ink-quiet); }
  .mgrid__day--today { border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .mgrid__day--sel {
    border-color: var(--accent-strong);
    background: var(--accent-strong);
    color: var(--accent-contrast);
    font-weight: 600;
  }

  /* ---------- 象限 ---------- */
  /* 一个坑必须先说清楚：象限是**派生值**（ADR 0004 §4，important 是真源，
     紧急由 urgent 与时钟共同决定），所以详情面板不能像捕获条那样「点哪个就是哪个」。
     当时间把一件事推过紧急线时，Q1 与 Q2 会同时「真」——它确实同时是「重要」
     和「紧急」。那时界面上不能假装用户只选了其中一个：
     两格都亮，Q1 加一条「时间判定」的说明，而**写入永远同时落两个轴**。
     见 bindQuad()。 */
  .qgrid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--sp-1);
  }
  .qbtn {
    appearance: none;
    display: flex;
    align-items: center;
    gap: 6px;
    min-inline-size: 0;
    block-size: 34px;
    padding: 0 var(--sp-2);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    background: var(--bg-subtle);
    color: var(--ink-2);
    font: inherit;
    font-size: var(--text-sm);
    text-align: start;
    cursor: pointer;
    --q-tint: transparent;
    --q-ink: var(--ink-2);
  }
  .qbtn:hover { background: var(--bg-hover); color: var(--ink-1); }
  .qbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .qbtn[aria-checked="true"] {
    background: var(--q-tint);
    border-color: var(--q-ink);
    color: var(--q-ink);
    font-weight: 600;
  }
  .qbtn[data-q="1"] { --q-tint: var(--q1-t); --q-ink: var(--q1-i); }
  .qbtn[data-q="2"] { --q-tint: var(--q2-t); --q-ink: var(--q2-i); }
  .qbtn[data-q="3"] { --q-tint: var(--q3-t); --q-ink: var(--q3-i); }
  .qbtn[data-q="4"] { --q-tint: var(--q4-t); --q-ink: var(--q4-i); }

  /* ---------- 清单选择 ---------- */
  .selectwrap {
    position: relative;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    block-size: var(--control-h);
    padding: 0 var(--sp-2);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    background: var(--bg-subtle);
  }
  .selectwrap:hover { border-color: var(--hairline-strong); }
  .selectwrap:focus-within {
    outline: 2px solid var(--focus);
    outline-offset: -1px;
    border-color: var(--accent);
  }
  .ldot {
    inline-size: 7px;
    block-size: 7px;
    flex: none;
    border-radius: 50%;
    background: var(--ink-4);
  }
  .select {
    appearance: none;
    flex: 1;
    min-inline-size: 0;
    block-size: 100%;
    padding: 0 20px 0 0;
    border: 0;
    background: transparent;
    color: var(--ink-1);
    font: inherit;
    font-size: var(--text-body);
    cursor: pointer;
  }
  .select:focus-visible { outline: none; }
  .selectwrap svg {
    position: absolute;
    inset-inline-end: var(--sp-2);
    color: var(--ink-quiet);
    pointer-events: none;
  }

  /* ---------- 备注 ---------- */
  .field--area { min-block-size: 64px; }

  /* ---------- 底栏 ---------- */
  .insp__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    padding: var(--sp-3) var(--sp-5);
    border-block-start: 1px solid var(--hairline);
  }
  .insp__del { color: var(--danger-ink); }
  .insp__del:hover { background: var(--danger-tint); color: var(--danger-ink); }

  /* ---------- toast ---------- */
  .toast-host {
    inset-block-end: var(--sp-5);
    pointer-events: none;
  }
  .toast {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-md);
    background: var(--bg-surface);
    color: var(--ink-1);
    box-shadow: var(--shadow-lg);
    font-size: var(--text-body);
    opacity: 0;
    translate: 0 8px;
    pointer-events: none;
    transition: opacity var(--dur-base) var(--ease), translate var(--dur-base) var(--ease);
  }
  .toast[data-on] { opacity: 1; translate: 0 0; pointer-events: auto; }
  /* Measured 1.0:1: this toast is rendered inside an ancestor that is still at
     opacity:0 before it opens, and the undo label inherited that. It also sat
     transparent on the surface. Give it an explicit ground so the label reads
     as soon as the toast is shown. */
  .toast__undo {
    appearance: none;
    block-size: var(--control-h-sm);
    padding: 0 var(--sp-2);
    border: 0;
    border-radius: var(--radius-sm);
    background: var(--accent-tint);
    color: var(--accent-ink);
    font: inherit;
    font-size: var(--text-sm);
    font-weight: 600;
    cursor: pointer;
  }
  .toast__undo:hover { background: var(--bg-hover); }
  .toast__undo:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) {
    .saved, .toast { transition: none; }
  }
</style>
</head>
<body data-skin="refined" data-theme="light">
<div class="app">

  <nav class="rail" aria-label="主导航">
    <span class="rail__avatar" aria-hidden="true">K</span>
    <div class="rail__group">
      <button type="button" class="rail__item" aria-current="page" aria-label="所有事情">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      </button>
      <button type="button" class="rail__item" aria-label="四象限">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <button type="button" class="rail__item" aria-label="日历">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
      </button>
      <button type="button" class="rail__item" aria-label="搜索">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </div>
    <div class="rail__group rail__group--bottom">
      <button type="button" class="rail__item" aria-label="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </nav>

  <aside class="sidebar" aria-label="清单">
    <div class="sidebar__head"><span>视图</span></div>
    <div class="sidebar__group">
      <div class="srow srow--current">所有事情 <span class="sidebar__count" id="countAll">19</span></div>
      <div class="srow">今天 <span class="sidebar__count" id="countToday">5</span></div>
    </div>
    <div class="sidebar__sep" aria-hidden="true"></div>
    <div class="sidebar__head"><span>清单</span><span id="countLists">4</span></div>
    <div class="sidebar__group" id="listRows"></div>
    <p class="sidebar__hint">字段一改就保存。<br>没有「保存」按钮，也没有第二个编辑器。</p>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 class="topbar__title">所有事情</h1>
      <span class="topbar__sub" id="count">19 件未完成</span>
      <span class="kbd-hint">按 <kbd>Ctrl</kbd>+<kbd>N</kbd> 捕获新的一件事</span>
      <div class="topbar__actions"></div>
    </header>

    <div class="workarea">
      <div class="listpane">
        <p class="listpane__hint">按时间精度排 · 粗窗口在前 · 不限最后 · 点一行打开右侧详情</p>
        <div class="rows" id="rows"></div>
      </div>

      <aside class="inspector" id="inspector" aria-label="事情详情">
        <header class="insp__head">
          <span class="insp__eyebrow">事情详情</span>
          <span class="saved" id="saved" role="status" aria-live="polite"></span>
        </header>

        <div class="insp__body" id="inspBody">
          <section class="dsec dsec--title">
            <input class="insp__title" id="titleInput" type="text" aria-label="标题" autocomplete="off" spellcheck="false">
            <p class="insp__meta">改动即保存 · 关闭不需要确认</p>
          </section>

          <section class="dsec">
            <div class="dsec__head">
              <h3>时间</h3>
              <span class="due due--warning" id="due">明天到期</span>
            </div>
            <div class="ladder" id="ladder" role="radiogroup" aria-label="时间精度">
              <button type="button" class="rung" role="radio" aria-checked="false" data-rung="month">
                <span class="rung__mark" aria-hidden="true"></span>
                <span class="rung__name">下个月</span>
                <span class="rung__ex" data-ex>12月</span>
              </button>
              <button type="button" class="rung" role="radio" aria-checked="false" data-rung="week">
                <span class="rung__mark" aria-hidden="true"></span>
                <span class="rung__name">这周</span>
                <span class="rung__ex" data-ex>11-23 起</span>
              </button>
              <button type="button" class="rung" role="radio" aria-checked="true" data-rung="day">
                <span class="rung__mark" aria-hidden="true"></span>
                <span class="rung__name">某一天</span>
                <span class="rung__ex" data-ex>明天</span>
              </button>
              <button type="button" class="rung" role="radio" aria-checked="false" data-rung="period">
                <span class="rung__mark" aria-hidden="true"></span>
                <span class="rung__name">上午·下午·晚上</span>
                <span class="rung__ex" data-ex>今天下午</span>
              </button>
              <button type="button" class="rung" role="radio" aria-checked="false" data-rung="time">
                <span class="rung__mark" aria-hidden="true"></span>
                <span class="rung__name">具体时刻</span>
                <span class="rung__ex" data-ex>今天 15:00</span>
              </button>
              <button type="button" class="rung" role="radio" aria-checked="false" data-rung="none">
                <span class="rung__mark" aria-hidden="true"></span>
                <span class="rung__name">不限</span>
                <span class="rung__ex" data-ex>收集箱</span>
              </button>
            </div>
            <div class="rung-detail" id="rungDetail"></div>
            <p class="dsec__foot" id="dueFoot"></p>
          </section>

          <section class="dsec">
            <div class="dsec__head"><h3>象限</h3></div>
            <div class="qgrid" id="qgrid" role="radiogroup" aria-label="象限">
              <button type="button" class="qbtn" role="radio" aria-checked="false" data-q="1"><span class="qdot qdot--1" aria-hidden="true"></span>重要且紧急</button>
              <button type="button" class="qbtn" role="radio" aria-checked="false" data-q="2"><span class="qdot qdot--2" aria-hidden="true"></span>重要不紧急</button>
              <button type="button" class="qbtn" role="radio" aria-checked="false" data-q="3"><span class="qdot qdot--3" aria-hidden="true"></span>不重要但紧急</button>
              <button type="button" class="qbtn" role="radio" aria-checked="false" data-q="4"><span class="qdot qdot--4" aria-hidden="true"></span>不重要不紧急</button>
            </div>
            <p class="dsec__foot" id="quadFoot"></p>
          </section>

          <section class="dsec">
            <div class="dsec__head"><h3>清单</h3></div>
            <div class="selectwrap">
              <span class="ldot" id="listDot" aria-hidden="true"></span>
              <select class="select" id="listSel" aria-label="清单"></select>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </div>
          </section>

          <section class="dsec">
            <div class="dsec__head"><h3>备注</h3></div>
            <textarea class="field field--area" id="notes" placeholder="添加备注…" aria-label="备注"></textarea>
          </section>
        </div>

        <footer class="insp__foot">
          <button type="button" class="btn btn--ghost insp__del" id="btnDelete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>
            删除
          </button>
          <span class="spacer"></span>
          <button type="button" class="btn btn--secondary" id="btnClose">关闭</button>
        </footer>
      </aside>
    </div>

    <!-- toast 挂在 .main 里，用共享的 .floating-center（容器查询），
         不用 100vw 减侧栏宽度的算法。 -->
    <div class="floating-center toast-host">
      <div class="toast" id="toast" role="status" aria-live="polite">
        <span id="toastText"></span>
        <button type="button" class="toast__undo" id="toastUndo">撤销</button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var K = window.Kairos;
  if (!K) return;

  var RANK = { month: 0, week: 1, range: 2, day: 3, period: 4, time: 5, none: 6 };
  var RUNG_ORDER = ['month', 'week', 'day', 'period', 'time', 'none']; /* 粗窗口在前，不限最后 */
  var RUNG_EX = {
    none: '清单名', month: '12月', week: '11-23 起',
    day: '明天', period: '今天下午', time: '今天 15:00'
  };
  /* 五个常用时刻 —— 只是快选，不是全部。精确分钟走 HH:MM 输入。 */
  var TIME_PRESETS = ['09:00', '12:00', '15:00', '18:00', '21:00'];

  /* 直接引用 K.ITEMS 里的对象，不再复制一份。
     原来这里是 Object.assign({}, i)，于是面板里改的是一份影子数据：
     关掉面板、切到下一条再回来，或者任何别处读 K.ITEMS（日历、四象限板），
     看到的都还是旧值。ADR 0004 §1 说「只有一个详情面板」，那这个面板
     写进去的东西就必须是那份唯一的存储。 */
  var items = K.ITEMS.filter(function (i) { return !i.done; });
  var notes = {};
  var selectedId = 6;
  var savedTimer = null;
  var toastTimer = null;
  var toastAction = null;
  var gridOpen = false;
  var gridMonth = new Date(2026, 10, 1);

  var el = {
    rows: document.getElementById('rows'),
    inspector: document.getElementById('inspector'),
    inspBody: document.getElementById('inspBody'),
    title: document.getElementById('titleInput'),
    due: document.getElementById('due'),
    dueFoot: document.getElementById('dueFoot'),
    ladder: document.getElementById('ladder'),
    detail: document.getElementById('rungDetail'),
    qgrid: document.getElementById('qgrid'),
    listSel: document.getElementById('listSel'),
    listDot: document.getElementById('listDot'),
    notes: document.getElementById('notes'),
    saved: document.getElementById('saved'),
    count: document.getElementById('count'),
    countAll: document.getElementById('countAll'),
    countToday: document.getElementById('countToday'),
    listRows: document.getElementById('listRows'),
    toast: document.getElementById('toast'),
    toastText: document.getElementById('toastText'),
    toastUndo: document.getElementById('toastUndo')
  };

  function current() {
    for (var i = 0; i < items.length; i++) if (items[i].id === selectedId) return items[i];
    return null;
  }
  /* 面板里的时钟：K.now() 是唯一真源。原来这里读 K.TODAY / K.NOW_MIN 的快照，
     而那两个值在 data.js 里已经是可变的，快照会在 setNow() 之后说谎。 */
  function today() { return K.now().today; }
  function listOf(id) {
    for (var i = 0; i < K.LISTS.length; i++) if (K.LISTS[i].id === id) return K.LISTS[i];
    return K.LISTS[0];
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function rowLabel(it) {
    if (it.rung === 'none') return listOf(it.list).name;
    var label = K.rungLabel(it);
    // 产品评审会是 15:00 到 16:00 的事。行上只写「今天 15:00」会让它看起来
    // 像一分钟的事，也和日历里那条 15:00–16:00 的块对不上。结束是可选的，
    // 没填就还是不写。
    if (it.rung === 'time' && it.end) label += '–' + it.end;
    if (K.isWindowPassed(it)) label += '·未完成';
    return label;
  }
  function whenClass(it) {
    if (K.isLate(it)) return 'when--late';
    if (K.isWindowPassed(it)) return 'when--late-soft';
    return 'when--' + it.rung;
  }

  /* ---- 紧急读数：时间只负责读，不移动卡片 ---- */
  function dueInfo(it) {
    var lvl = K.urgencyOf(it);
    if (K.isLate(it)) return { text: rowLabel(it) + ' 已过', tone: 'danger' };
    if (K.isWindowPassed(it)) {
      return { text: (it.rung === 'week' ? '上周' : '上个月') + ' · 未完成', tone: 'warning' };
    }
    if (it.rung === 'none') return { text: '不排期', tone: 'muted' };
    if (it.rung === 'month' || it.rung === 'week') {
      return { text: K.rungLabel(it) + ' · 计划窗口', tone: 'normal' };
    }
    if (it.rung === 'day') {
      var n = K.diffDays(it.date, today());
      var txt = n === 0 ? '今天到期' : n === 1 ? '明天到期' : n > 1 ? n + ' 天后到期' : '已过';
      return { text: txt, tone: n <= 2 ? 'warning' : 'normal' };
    }
    var tone = lvl === 'urgent' ? 'danger' : lvl === 'near' ? 'warning' : 'normal';
    return { text: K.rungLabel(it) + ' 到期', tone: tone };
  }

  function urgencyWord(it) {
    if (it.rung === 'none') return { word: '无时间读数', tone: 'muted' };
    var lvl = K.urgencyOf(it);
    if (lvl === 'urgent') return { word: it.urgent && !K.isLate(it) ? '已标紧急' : '已过期', tone: 'danger' };
    if (lvl === 'near') return { word: '马上到期', tone: 'warning' };
    if (lvl === 'soon') return { word: '临近', tone: 'warning' };
    return { word: '不急', tone: 'muted' };
  }

  function flashSaved() {
    if (!el.saved) return;
    el.saved.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>已保存';
    el.saved.setAttribute('data-on', '');
    clearTimeout(savedTimer);
    savedTimer = setTimeout(function () {
      el.saved.removeAttribute('data-on');
      setTimeout(function () { el.saved.textContent = ''; }, 180);
    }, 1400);
  }

  /* ---- 左栏列表 ---- */
  function renderList() {
    var sorted = items.slice().sort(function (a, b) {
      var d = RANK[a.rung] - RANK[b.rung];
      if (d) return d;
      var ad = a.date || '9999-99-99';
      var bd = b.date || '9999-99-99';
      return ad < bd ? -1 : ad > bd ? 1 : a.id - b.id;
    });
    var open = !el.inspector.hidden;
    el.rows.innerHTML = sorted.map(function (it) {
      var flag = K.isLate(it) ? '<span class="when__flag">已过</span>' : '';
      var sel = open && it.id === selectedId;
      return '<button type="button" class="lrow' + (sel ? ' lrow--sel' : '') + '" data-id="' + it.id + '"' +
        (sel ? ' aria-current="true"' : '') + '>' +
        '<span class="qdot qdot--' + K.quadrantOf(it) + '" aria-hidden="true"></span>' +
        '<span class="lrow__title">' + esc(it.title) + '</span>' +
        '<span class="when ' + whenClass(it) + '">' + esc(rowLabel(it)) + flag + '</span>' +
        '</button>';
    }).join('');
  }

  function renderCounts() {
    el.count.textContent = items.length + ' 件未完成';
    el.countAll.textContent = items.length;
    var todayCount = items.filter(function (i) { return i.date === today(); }).length;
    el.countToday.textContent = todayCount;
    K.LISTS.forEach(function (l) {
      var node = el.listRows.querySelector('[data-list-count="' + l.id + '"]');
      if (node) node.textContent = items.filter(function (i) { return i.list === l.id; }).length;
    });
  }

  function buildSidebar() {
    el.listRows.innerHTML = K.LISTS.map(function (l) {
      return '<div class="srow">' +
        '<span class="srow__dot" style="background:' + l.color + '" aria-hidden="true"></span>' +
        '<span>' + esc(l.name) + '</span>' +
        '<span class="sidebar__count" data-list-count="' + l.id + '">0</span>' +
        '</div>';
    }).join('');
  }

  /* ---- 面板 ---- */
  function renderLadder() {
    var it = current();
    if (!it) return;
    Array.prototype.forEach.call(el.ladder.querySelectorAll('.rung'), function (btn) {
      var rung = btn.getAttribute('data-rung');
      btn.setAttribute('aria-checked', String(rung === it.rung));
      var ex = btn.querySelector('[data-ex]');
      if (!ex) return;
      /* 每一行右边那一格是「如果选它，行上会写成什么」。所以「不限」
         显示的是这条事所在清单的名字，不是占位符。 */
      if (rung === it.rung) ex.textContent = rowLabel(it);
      else if (rung === 'none') ex.textContent = listOf(it.list).name;
      else ex.textContent = RUNG_EX[rung];
    });
  }

  function renderDetail() {
    var it = current();
    if (!it) { el.detail.innerHTML = ''; return; }
    var html = '';
    if (it.rung === 'none') {
      html += '<p class="rd__hint">不排期。排在所有档之后，不进日历，也不参与日期提醒。</p>';
      el.detail.innerHTML = html;
      return;
    }
    if (it.rung === 'month') {
      var months = [
        { v: '2026-11-01', label: K.rungLabel({ rung: 'month', date: '2026-11-01' }) },
        { v: '2026-12-01', label: K.rungLabel({ rung: 'month', date: '2026-12-01' }) },
        { v: '2027-01-01', label: K.rungLabel({ rung: 'month', date: '2027-01-01' }) }
      ];
      html += '<div class="rd__chips">' + months.map(function (m) {
        return '<button type="button" class="chip' + (it.date === m.v ? ' chip--on' : '') + '" data-set-month="' + m.v + '" aria-pressed="' + (it.date === m.v) + '">' + m.label + '</button>';
      }).join('') + '</div>';
      html += '<p class="rd__hint">一个计划窗口，按整月计。跨月后显示「上个月·未完成」，但不算逾期。</p>';
      el.detail.innerHTML = html;
      return;
    }
    if (it.rung === 'week') {
      var weeks = [-1, 0, 1].map(function (n) {
        var d = K.addDays(K.WEEK_START, n * 7);
        return { v: d, label: K.rungLabel({ rung: 'week', date: d }) };
      });
      html += '<div class="rd__chips">' + weeks.map(function (w) {
        return '<button type="button" class="chip' + (it.date === w.v ? ' chip--on' : '') + '" data-set-week="' + w.v + '" aria-pressed="' + (it.date === w.v) + '">' + w.label + '</button>';
      }).join('') + '</div>';
      html += '<p class="rd__hint">一个计划窗口，按整周计。进入下一周之后它仍停在原来那一周，不会自己滚过去。</p>';
      el.detail.innerHTML = html;
      return;
    }

    /* day / period / time 共用同一排日期，再按档位加时段的细分 */
    var days = [0, 1, 2].map(function (n) {
      var d = K.addDays(today(), n);
      return { v: d, label: K.rungLabel({ rung: 'day', date: d }) };
    });
    html += '<div class="rd__chips">' + days.map(function (d) {
      return '<button type="button" class="chip' + (it.date === d.v ? ' chip--on' : '') + '" data-set-day="' + d.v + '" aria-pressed="' + (it.date === d.v) + '">' + d.label + '</button>';
    }).join('');
    html += '<button type="button" class="chip chip--cal" data-toggle-grid aria-expanded="' + gridOpen + '">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>' +
      (gridOpen ? '收起日历' : '选日期') + '</button></div>';

    if (gridOpen) html += gridHTML(it);

    if (it.rung === 'period') {
      html += '<div class="seg rd__seg" role="group" aria-label="时段">' +
        ['morning', 'afternoon', 'evening'].map(function (p) {
          return '<button type="button" class="chip' + (it.period === p ? ' chip--on' : '') + '" data-set-period="' + p + '" aria-pressed="' + (it.period === p) + '">' + K.PERIOD_LABEL[p] + '</button>';
        }).join('') + '</div>';
      html += '<p class="rd__hint">到这半天结束才过期。</p>';
    } else if (it.rung === 'time') {
      /* 5 个常用时刻只是快捷方式，不是全部时刻。一条 15:40 的会在这 5 个值里
         根本不存在，所以后面必须跟一个真的 HH:MM 输入 —— 否则「具体时刻」这一档
         说得出「几点」，说不出「几分」。结束时间同理，且是可选的（一个时刻可以
         只是「到点做某事」，不必有长度）。 */
      html += '<div class="rd__row rd__row--wrap"><span class="rd__label">开始</span><div class="rd__chips">' +
        TIME_PRESETS.map(function (t) {
          return '<button type="button" class="chip' + (it.time === t ? ' chip--on' : '') + '" data-set-time="' + t + '" aria-pressed="' + (it.time === t) + '">' + t + '</button>';
        }).join('') + '</div></div>';
      html += '<div class="rd__row"><span class="rd__label">几点</span>' +
        timePairHTML(it.time, 'start') +
        '</div>';
      html += '<div class="rd__row"><span class="rd__label">到</span>' +
        timePairHTML(it.end, 'end') +
        '</div>';
      html += '<p class="rd__hint">开始时刻过了就算过期；结束是可选的，填了就在行上写成 <b class="nowrap">' +
        esc((it.time || '15:00') + '–' + (it.end || '16:00')) + '</b> 这样的区间。</p>';
    } else {
      html += '<p class="rd__hint">到当天 24:00 才过期。</p>';
    }
    el.detail.innerHTML = html;
  }

  /* 一对 HH:MM 输入。kind = start | end：开始必填（一个「具体时刻」没有开始就不成立），
     结束可选（点「清除」就是「这件事没有长度」）。两个都由 renderDetail 重建，
     所以重绘后焦点会掉；commitTimePair 里把焦点还回去。 */
  function timePairHTML(value, kind) {
    var v = value || '';
    var parts = v ? v.split(':') : ['', ''];
    var id = 'time-' + kind + '-' + (current() ? current().id : 'x');
    return '<span class="timepair">' +
      '<input class="field timepair__in" id="' + id + '" data-time-pair="' + kind + '" data-part="hour" type="text" inputmode="numeric" maxlength="2" value="' +
        esc(parts[0]) + '" placeholder="HH" aria-label="' + (kind === 'end' ? '结束小时' : '开始小时') + '" autocomplete="off">' +
      '<span class="timepair__sep" aria-hidden="true">:</span>' +
      '<input class="field timepair__in" data-time-pair="' + kind + '" data-part="minute" type="text" inputmode="numeric" maxlength="2" value="' +
        esc(parts[1]) + '" placeholder="MM" aria-label="' + (kind === 'end' ? '结束分钟' : '开始分钟') + '" autocomplete="off">' +
      (kind === 'end' ? '<button type="button" class="timepair__clear" data-clear-end' + (v ? '' : ' hidden') + '>清除</button>' : '') +
      '</span>';
  }

  /* 一对输入的读数：两个都空 = 没填（仅结束允许）；有一个不合法 = 非法；
     只有一个填了 = 按 :00 补（用户打了「16」多半是 16:00，不是「拒绝」）。 */
  function readPair(kind) {
    var h = el.detail.querySelector('[data-time-pair="' + kind + '"][data-part="hour"]');
    var m = el.detail.querySelector('[data-time-pair="' + kind + '"][data-part="minute"]');
    if (!h || !m) return { empty: true };
    var hs = h.value.replace(/\D/g, '');
    var ms = m.value.replace(/\D/g, '');
    if (hs === '' && ms === '') {
      h.removeAttribute('aria-invalid'); m.removeAttribute('aria-invalid');
      return { empty: true };
    }
    var hh = hs === '' ? 0 : parseInt(hs, 10);
    var mm = ms === '' ? 0 : parseInt(ms, 10);
    var ok = hh >= 0 && hh <= 23 && mm >= 0 && mm <= 59;
    h.setAttribute('aria-invalid', String(!ok));
    m.setAttribute('aria-invalid', String(!ok));
    if (!ok) return { bad: true };
    return { value: String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0') };
  }

  function gridHTML(it) {    var y = gridMonth.getFullYear();
    var m = gridMonth.getMonth();
    var first = new Date(y, m, 1);
    var offset = (first.getDay() + 6) % 7;
    var start = new Date(y, m, 1 - offset);
    var cells = '';
    for (var i = 0; i < 42; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var ds = K.fmt(d);
      var out = d.getMonth() !== m;
      var cls = 'mgrid__day' + (out ? ' mgrid__day--out' : '') +
        (ds === today() ? ' mgrid__day--today' : '') +
        (ds === it.date ? ' mgrid__day--sel' : '');
      cells += '<button type="button" class="' + cls + '" data-day="' + ds + '" aria-pressed="' + (ds === it.date) + '">' + d.getDate() + '</button>';
    }
    return '<div class="mgrid">' +
      '<div class="mgrid__head">' +
      '<button type="button" class="mgrid__nav" data-nav="-1" aria-label="上个月"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>' +
      '<span class="mgrid__label">' + y + '年' + (m + 1) + '月</span>' +
      '<button type="button" class="mgrid__nav" data-nav="1" aria-label="下个月"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>' +
      '</div>' +
      '<div class="mgrid__dow" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>' +
      '<div class="mgrid__grid">' + cells + '</div></div>';
  }

  function renderDue() {
    var it = current();
    if (!it) return;
    var info = dueInfo(it);
    el.due.textContent = info.text;
    el.due.className = 'due due--' + info.tone;
    var u = urgencyWord(it);
    var tail;
    if (it.rung === 'none') tail = '无日期，不参与日期提醒';
    else if (K.isWindowPassed(it)) tail = '计划窗口已过，不算逾期';
    else if (K.urgencyOf(it) === 'urgent') tail = '会进 Q1';
    else if (K.urgencyOf(it) === 'near') tail = '24 小时内，但不进 Q1';
    else if (K.urgencyOf(it) === 'soon') tail = '3 天内，不移动卡片';
    else tail = '不进 Q1';
    el.dueFoot.innerHTML = '时间读数 <b class="is-' + u.tone + '">' + u.word + '</b> · ' + tail;
  }

  function renderQuad() {
    var it = current();
    if (!it) return;
    /* 界面上必须只有一个亮格 —— 它是一个 radiogroup，四格同时亮就读不出「我在哪」。
       亮的那一格永远是 quadrantOf()，也就是**真值**：用户说的 important 与 urgent
       是输入，时间读数是另一个输入，象限是两者的结果（ADR 0004 §4）。
       当时间把 userChose 的那一格推走时（Q2 的事过了自己的时刻 → 真值 Q1），
       脚注要说清楚是谁动了它，否则用户会以为点击没生效。 */
    var shown = K.quadrantOf(it);
    Array.prototype.forEach.call(el.qgrid.querySelectorAll('.qbtn'), function (btn) {
      btn.setAttribute('aria-checked', String(+btn.getAttribute('data-q') === shown));
    });
    var foot = document.getElementById('quadFoot');
    if (!foot) return;
    var chosen = it.important ? (it.urgent ? 1 : 2) : (it.urgent ? 3 : 4);
    if (shown !== chosen) {
      foot.innerHTML = '你标的是 <b>' + (K.QUADRANTS[chosen] ? K.QUADRANTS[chosen].name : '') +
        '</b>，但时间已经把这个时刻推过去了，所以它落在 <b class="is-warning">' +
        (K.QUADRANTS[shown] ? K.QUADRANTS[shown].name : '') + '</b>。' +
        '想让这件事「不急」，只能把时间推远 —— 时间不能被压低。';
    } else {
      foot.innerHTML = '直接点一格，只需要回答两个问题：<b>重要吗</b>、<b>现在就要做吗</b>。' +
        '紧急由你说了算，时间只负责在你没说话的时候读一个值出来。';
    }
  }

  /* 四格对应两个布尔：Q1 = 都真，Q2 = 只有重要，Q3 = 只有紧急，Q4 = 都假。 */
  var QUAD_AXES = {
    1: { important: true, urgent: true },
    2: { important: true, urgent: false },
    3: { important: false, urgent: true },
    4: { important: false, urgent: false }
  };

  function renderSelect() {
    var it = current();
    if (!it) return;
    el.listSel.value = it.list;
    el.listDot.style.background = listOf(it.list).color;
  }

  function bindPanel() {
    var it = current();
    if (!it) return;
    el.title.value = it.title;
    el.notes.value = notes[it.id] || '';
    renderSelect();
    renderLadder();
    renderDetail();
    renderDue();
    renderQuad();
    el.inspBody.scrollTop = 0;
  }

  function openPanel(id) {
    selectedId = id;
    el.inspector.hidden = false;
    bindPanel();
    renderList();
  }

  function closePanel() {
    el.inspector.hidden = true;
    renderList();
  }

  function showToast(text, action) {
    el.toastText.textContent = text;
    el.toastUndo.hidden = !action;
    toastAction = action || null;
    el.toast.setAttribute('data-on', '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() {
    el.toast.removeAttribute('data-on');
    toastAction = null;
  }

  /* ---- 事件 ---- */
  el.rows.addEventListener('click', function (e) {
    var row = e.target.closest('.lrow');
    if (!row) return;
    openPanel(+row.getAttribute('data-id'));
  });

  el.title.addEventListener('input', function () {
    var it = current();
    if (!it) return;
    it.title = el.title.value;
    var node = el.rows.querySelector('.lrow[data-id="' + it.id + '"] .lrow__title');
    if (node) node.textContent = it.title || '未命名';
    flashSaved();
  });

  el.notes.addEventListener('input', function () {
    var it = current();
    if (!it) return;
    notes[it.id] = el.notes.value;
    flashSaved();
  });

  el.ladder.addEventListener('click', function (e) {
    var btn = e.target.closest('.rung');
    if (!btn) return;
    var it = current();
    if (!it) return;
    var rung = btn.getAttribute('data-rung');
    if (rung === it.rung) return;
    it.rung = rung;
    // 用 K.now() 而不是模块顶部的快照：setNow() 之后「今天」是会变的。
    var nowToday = today();
    if (rung === 'month') it.date = '2026-12-01';
    else if (rung === 'week') it.date = K.weekStartOf(nowToday);
    else if (rung === 'day') it.date = nowToday;
    else if (rung === 'period') { it.date = nowToday; it.period = 'afternoon'; }
    else if (rung === 'time') {
      // 切到「具体时刻」时不要留着上一个档位的时间：它可能是昨天 10:00，
      // 一进面板就显示成「已过」，且结束时刻还可能早于新的开始。
      it.date = nowToday;
      it.time = '15:00';
      it.end = '16:00';
    } else if (rung === 'none') {
      delete it.date; delete it.period; delete it.time; delete it.end;
    }
    gridOpen = false;
    renderLadder(); renderDetail(); renderDue(); renderList(); flashSaved();
  });

  el.ladder.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    var it = current();
    if (!it) return;
    var idx = RUNG_ORDER.indexOf(it.rung);
    var next = RUNG_ORDER[(idx + (e.key === 'ArrowDown' ? 1 : RUNG_ORDER.length - 1)) % RUNG_ORDER.length];
    var btn = el.ladder.querySelector('[data-rung="' + next + '"]');
    if (btn) { btn.focus(); btn.click(); }
  });

  el.detail.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var it = current();
    if (!it) return;
    var changed = true;

    if (btn.hasAttribute('data-toggle-grid')) {
      gridOpen = !gridOpen;
      if (gridOpen && it.date) {
        var d = K.parse(it.date);
        gridMonth = new Date(d.getFullYear(), d.getMonth(), 1);
      }
      changed = false;
    } else if (btn.hasAttribute('data-nav')) {
      var dir = +btn.getAttribute('data-nav');
      gridMonth = new Date(gridMonth.getFullYear(), gridMonth.getMonth() + dir, 1);
      changed = false;
    } else if (btn.hasAttribute('data-set-month')) {
      it.date = btn.getAttribute('data-set-month');
    } else if (btn.hasAttribute('data-set-week')) {
      it.date = btn.getAttribute('data-set-week');
    } else if (btn.hasAttribute('data-set-day')) {
      it.date = btn.getAttribute('data-set-day');
    } else if (btn.hasAttribute('data-day')) {
      it.date = btn.getAttribute('data-day');
      gridOpen = false;
    } else if (btn.hasAttribute('data-set-period')) {
      it.period = btn.getAttribute('data-set-period');
    } else if (btn.hasAttribute('data-set-time')) {
      it.time = btn.getAttribute('data-set-time');
      // 换开始时刻不该悄悄丢掉结束时刻，但结束早于新的开始是不成立的 ——
      // 那种情况清掉它，比留下一个倒着走的区间诚实。
      if (it.end && it.end <= it.time) delete it.end;
    } else if (btn.hasAttribute('data-clear-end')) {
      delete it.end;
    } else {
      return;
    }

    renderLadder(); renderDetail();
    if (changed) { renderDue(); renderList(); flashSaved(); }
  });

  /* ---- 时/分输入：唯一能填出 15:40 的地方 ----
     两个必须遵守的细节：

     1. 监听 input，不监听 change —— change 只在失焦时来，那样「改完立刻看行上的
        区间变没变」就是空的。
     2. 打字过程中**绝不重建这块 DOM**。第一版每次 input 都 renderDetail()，
        于是打「09:05」时第一个「0」被立刻规整成「00」，第二个「9」再拼上去就是
        「009」→ 截成「00」。用户看到的是输入框吞字。
        所以打字时只更新「输入框之外」的东西：行标签、到期读数、预设 chip。
        失焦时才 renderDetail()，把「9」补成「09」、把非法值标红。 */
  el.detail.addEventListener('input', function (e) {
    var input = e.target.closest('[data-time-pair]');
    if (!input) return;
    var it = current();
    if (!it) return;
    var kind = input.getAttribute('data-time-pair');
    var part = input.getAttribute('data-part');
    input.value = input.value.replace(/\D/g, '').slice(0, 2);
    var r = readPair(kind);
    if (r.bad) return;               // 非法值：标红，不写入
    if (kind === 'start') {
      if (r.empty) return;           // 开始不能为空，等用户打完
      it.time = r.value;
      if (it.end && it.end <= it.time) delete it.end;
    } else if (r.empty) {
      delete it.end;
    } else {
      if (r.value <= it.time) {
        input.closest('.timepair').querySelectorAll('input').forEach(function (n) {
          n.setAttribute('aria-invalid', 'true');
        });
        return;
      }
      it.end = r.value;
    }
    syncTimeChips(it);
    renderLadder(); renderDue(); renderList(); flashSaved();
    // 把光标还到用户正在打的那一格（重绘没有发生，但 setAttribute 之类
    // 不会动选择区，这里只是保证它没被别的逻辑挪走）。
    if (document.activeElement !== input) {
      var again = el.detail.querySelector('[data-time-pair="' + kind + '"][data-part="' + part + '"]');
      if (again) again.focus();
    }
  });

  /* 失焦时才规整：补零、夹紧、清掉早于开始的结束。
     同样不整块重建 —— 从「小时」跳到「分钟」时，小时的 change 会先触发，
     重建会把刚拿到焦点的分钟框一起换掉，用户看到的是「点进去打不了字」。
     所以这里就地改 value，只在模型真的被清理了（结束被删）时才重画，
     而且重画前先把焦点记下来、重画后还回去。 */
  el.detail.addEventListener('change', function (e) {
    var input = e.target.closest('[data-time-pair]');
    if (!input) return;
    var it = current();
    if (!it) return;
    var kind = input.getAttribute('data-time-pair');
    var pair = input.closest('.timepair');
    var h0 = pair.querySelector('[data-part="hour"]');
    var m0 = pair.querySelector('[data-part="minute"]');
    var r = readPair(kind);
    if (r.bad) return;

    if (r.empty) {
      if (kind === 'start') {
        // 开始不能空着：回到当前值，而不是留一个空框。
        h0.value = (it.time || '15:00').slice(0, 2);
        m0.value = (it.time || '15:00').slice(3, 5);
      } else {
        delete it.end;
        renderDetail();
      }
      return;
    }

    if (kind === 'start') {
      it.time = r.value;
      if (it.end && it.end <= it.time) {
        delete it.end;
        renderDetail();          // 结束被清掉，界面要跟着变
        return;
      }
    } else if (r.value > it.time) {
      it.end = r.value;
    } else {
      // 结束早于开始：拒收，把框里的值退回当前的结束（没有就清空）。
      delete it.end;
      renderDetail();
      return;
    }
    h0.value = r.value.slice(0, 2);
    m0.value = r.value.slice(3, 5);
    syncTimeChips(it);
    renderLadder(); renderDue(); renderList(); flashSaved();
  });

  /* 预设 chip 的选中态。不重建 DOM，只改 class，避免上面那个吞字问题。 */
  function syncTimeChips(it) {
    el.detail.querySelectorAll('[data-set-time]').forEach(function (c) {
      var on = c.getAttribute('data-set-time') === it.time;
      c.classList.toggle('chip--on', on);
      c.setAttribute('aria-pressed', String(on));
    });
  }

  function gridHTML(it) {
    var y = gridMonth.getFullYear();
    var m = gridMonth.getMonth();
    var first = new Date(y, m, 1);
    var offset = (first.getDay() + 6) % 7;
    var start = new Date(y, m, 1 - offset);
    var cells = '';
    for (var i = 0; i < 42; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var ds = K.fmt(d);
      var out = d.getMonth() !== m;
      var cls = 'mgrid__day' + (out ? ' mgrid__day--out' : '') +
        (ds === today() ? ' mgrid__day--today' : '') +
        (ds === it.date ? ' mgrid__day--sel' : '');
      cells += '<button type="button" class="' + cls + '" data-day="' + ds + '" aria-pressed="' + (ds === it.date) + '">' + d.getDate() + '</button>';
    }
    return '<div class="mgrid">' +
      '<div class="mgrid__head">' +
      '<button type="button" class="mgrid__nav" data-nav="-1" aria-label="上个月"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>' +
      '<span class="mgrid__label">' + y + '年' + (m + 1) + '月</span>' +
      '<button type="button" class="mgrid__nav" data-nav="1" aria-label="下个月"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>' +
      '</div>' +
      '<div class="mgrid__dow" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>' +
      '<div class="mgrid__grid">' + cells + '</div></div>';
  }

  el.qgrid.addEventListener('click', function (e) {
    var btn = e.target.closest('.qbtn');
    if (!btn) return;
    var it = current();
    if (!it) return;
    var nextQ = +btn.getAttribute('data-q');
    var axes = QUAD_AXES[nextQ];
    if (!axes) return;
    /* 写入永远是两个轴，不是象限编号（象限不存在存储里，它是派生值）。
       这正是 W2 那条「Q1 输入框写入 important/urgent 而不是 q」的同一条规则。
       Q1 → important:true, urgent:true
       Q2 → important:true
       Q3 → urgent:true
       Q4 → 两个都 false
       点 Q2 / Q4 时顺手清掉用户手标的 urgent：那一格的意思就是「现在不用做」。 */
    it.important = axes.important;
    it.urgent = axes.urgent;
    renderQuad(); renderDue(); renderLadder(); renderList(); flashSaved();
  });

  el.listSel.addEventListener('change', function () {
    var it = current();
    if (!it) return;
    it.list = el.listSel.value;
    el.listDot.style.background = listOf(it.list).color;
    renderLadder(); renderDue(); renderList(); renderCounts(); flashSaved();
  });

  document.getElementById('btnDelete').addEventListener('click', function () {
    var it = current();
    if (!it) return;
    var idx = items.indexOf(it);
    var removed = items.splice(idx, 1)[0];
    selectedId = null;
    el.inspector.hidden = true;
    renderList(); renderCounts();
    showToast('已删除「' + removed.title + '」', function () {
      items.splice(Math.min(idx, items.length), 0, removed);
      selectedId = removed.id;
      el.inspector.hidden = false;
      bindPanel(); renderList(); renderCounts();
    });
  });

  document.getElementById('btnClose').addEventListener('click', closePanel);

  el.toastUndo.addEventListener('click', function () {
    var action = toastAction;
    hideToast();
    if (action) action();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !el.inspector.hidden) closePanel();
  });

  /* ---- 初始化 ---- */
  buildSidebar();
  K.LISTS.forEach(function (l) {
    var opt = document.createElement('option');
    opt.value = l.id;
    opt.textContent = l.name;
    el.listSel.appendChild(opt);
  });
  bindPanel();
  renderList();
  renderCounts();

  /* 验收读数口：面板写进的是不是那份唯一的存储，要能从外面看见。 */
  window.KairosDetail = {
    selected: function () { return current(); },
    stored: function (title) {
      for (var i = 0; i < K.ITEMS.length; i++) if (K.ITEMS[i].title === title) return K.ITEMS[i];
      return null;
    }
  };
});
</script>
</body>
</html>
