<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairos v2 · 日程视图</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="demo.css">
<script src="data.js" defer></script>
<script src="base.js" defer></script>
<style>
  .topbar__title { display: flex; align-items: baseline; gap: var(--sp-3); }
  .topbar__title .sub { font-size: var(--text-sm); font-weight: 400; color: var(--ink-quiet); font-variant-numeric: tabular-nums; }
  .topbar__actions { padding-inline-end: 10rem; }
  .nav { display: flex; align-items: center; gap: var(--sp-1); }
  .nav .btn { padding: 0 var(--sp-2); }

  /* 底部视图胶囊 */
  .vpill {
    display: flex; align-items: center; gap: 2px;
    padding: 4px;
    background: var(--bg-surface);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-full);
    box-shadow: var(--shadow-lg);
    max-inline-size: 100%; overflow-x: auto;
  }
  .vpill__item {
    appearance: none; border: 0; cursor: pointer;
    block-size: 30px; padding: 0 var(--sp-3);
    border-radius: var(--radius-full);
    background: transparent; color: var(--ink-2);
    font: inherit; font-size: var(--text-body); white-space: nowrap;
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .vpill__item:hover { background: var(--bg-hover); color: var(--ink-1); }
  .vpill__item[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent-ink); font-weight: 600; }
  .vpill__item:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .vpill__sep { inline-size: 1px; block-size: 18px; background: var(--hairline); margin: 0 var(--sp-1); flex: none; }
  .vpill__cta {
    appearance: none; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    block-size: 30px; padding: 0 var(--sp-3);
    border-radius: var(--radius-full);
    background: var(--cta-bg); color: var(--cta-text);
    font: inherit; font-size: var(--text-body); font-weight: 600; white-space: nowrap;
  }
  .vpill__cta:hover { background: var(--cta-bg-hover); }
  .vpill__cta:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ============================ 日程列表 ============================ */
  .content--agenda { padding: 0 0 80px; }
  .agenda {
    max-inline-size: 860px;
    margin-inline: auto;
    padding-inline: var(--sp-4);
  }

  /* 分组 + 粘性表头 */
  .agroup { position: relative; }
  .agroup + .agroup { margin-block-start: var(--sp-2); }

  .agroup__head {
    position: sticky; inset-block-start: 0; z-index: 5;
    display: flex; align-items: center; gap: var(--sp-2);
    block-size: 34px;
    margin-inline: calc(var(--sp-4) * -1);
    padding-inline: var(--sp-4);
    background: var(--bg-app);
    /* 粘性表头上面要盖住正在滚过去的上一行：向上补一块同色底，
       否则会看到半行字从表头上沿露出来 */
    box-shadow: 0 -10px 0 0 var(--bg-app), 0 1px 0 var(--hairline);
  }
  .agroup__dow {
    font-size: var(--text-body); font-weight: 600; color: var(--ink-1);
  }
  .agroup__num {
    font-size: var(--text-body); font-weight: 600; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .agroup__tag {
    display: inline-flex; align-items: center;
    block-size: 18px; padding: 0 6px;
    border-radius: var(--radius-full);
    background: var(--accent-tint); color: var(--accent-ink);
    font-size: var(--text-xs); font-weight: 600;
  }
  .agroup__tag--muted { background: var(--bg-sunken); color: var(--ink-2); }
  .agroup__tag--warn { background: transparent; color: var(--warning-ink); font-weight: 600; }
  .agroup__count { margin-inline-start: auto; font-size: var(--text-xs); color: var(--ink-quiet); font-variant-numeric: tabular-nums; }
  .agroup.is-today .agroup__dow { color: var(--accent-ink); }

  /* 行 */
  .arows { display: grid; }
  .arow-item {
    display: grid;
    grid-template-columns: 76px 18px 1fr auto;
    align-items: center;
    gap: var(--sp-3);
    min-block-size: 38px;
    padding: 0 var(--sp-2);
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-align: start;
    appearance: none; border: 0; background: transparent;
    color: var(--ink-1); font: inherit;
    inline-size: 100%;
    border-block-end: 1px solid var(--hairline-soft);
  }
  .arow-item:last-child { border-block-end: 0; }
  .arow-item:hover { background: var(--bg-hover); }
  .arow-item:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

  /* 时间列：把「时间说到多细」直接摆出来 */
  .arow-item__when {
    display: flex; align-items: center; gap: 4px;
    font-size: var(--text-sm); color: var(--ink-quiet);
    font-variant-numeric: tabular-nums; white-space: nowrap;
    overflow: hidden;
  }
  .arow-item__when.is-time { color: var(--ink-1); font-weight: 500; }
  .arow-item__when.is-late { color: var(--danger-ink); font-weight: 600; }
  .arow-item__when.is-late-soft { color: var(--warning-ink); font-weight: 600; }

  /* 清单色点 */
  .arow-item__dot { inline-size: 7px; block-size: 7px; border-radius: 50%; justify-self: center; }

  /* 标题 + 二阶信息 */
  .arow-item__main { display: flex; align-items: center; gap: var(--sp-2); min-inline-size: 0; }
  .arow-item__title {
    font-size: var(--text-md); color: var(--ink-1);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-inline-size: 0;
  }
  .arow-item__repeat { flex: none; display: inline-grid; place-items: center; color: var(--ink-quiet); }
  /* 一段（这周 / 下个月）的起止：让「这周」不是一个模糊的词 */
  .arow-item__span {
    flex: none; font-size: var(--text-xs); color: var(--ink-quiet);
    font-variant-numeric: tabular-nums;
    padding-inline-start: var(--sp-2);
    border-inline-start: 1px solid var(--hairline);
  }
  .arow-item__flag {
    flex: none; font-size: var(--text-xs); font-weight: 600;
    color: var(--danger-ink);
  }
  .arow-item__flag.is-soft { color: var(--warning-ink); }

  /* 右侧：象限点 + 复选框 */
  .arow-item__end { display: flex; align-items: center; gap: var(--sp-3); }
  .arow-item__q { inline-size: 7px; block-size: 7px; border-radius: 50%; flex: none; }
  .arow-item .check { inline-size: 16px; block-size: 16px; }
  .arow-item.is-done .arow-item__title { text-decoration: line-through; color: var(--ink-quiet); }

  /* 不限分组：视觉上必须与上半部分隔开 */
  .agroup--none {
    margin-block-start: var(--sp-6);
    border-block-start: 1px solid var(--hairline-strong);
    padding-block-start: var(--sp-2);
  }
  .agroup--none .agroup__head {
    position: static;
    block-size: auto;
    padding-block: var(--sp-2) var(--sp-1);
    background: transparent;
    border-block-end: 0;
    box-shadow: none;
  }
  .agroup--none .arow-item { background: var(--bg-subtle); }
  .agroup--none .arow-item:hover { background: var(--bg-hover); }
  .agroup--none .arow-item__when { color: var(--ink-quiet); }

  .agroup__explain {
    display: flex; align-items: flex-start; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-2) var(--sp-3);
    font-size: var(--text-xs); color: var(--ink-quiet); line-height: 1.6;
  }
  .agroup__explain svg { flex: none; margin-block-start: 2px; color: var(--ink-quiet); }
  .agroup__explain b { color: var(--ink-2); font-weight: 600; }

  /* 空分组 */
  .agroup__empty {
    padding: var(--sp-2) var(--sp-2);
    font-size: var(--text-body); color: var(--ink-quiet);
  }

  /* ---- 弹层 ---- */
  .pop {
    position: fixed; z-index: var(--z-popover);
    inline-size: 264px; padding: var(--sp-3);
    background: var(--bg-surface);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
  }
  .pop[hidden] { display: none; }
  .pop__title { font-size: var(--text-md); font-weight: 600; color: var(--ink-1); line-height: 1.4; }
  .pop__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-block-start: var(--sp-2); }
  .pop__when { display: inline-flex; align-items: center; block-size: 20px; padding: 0 var(--sp-2); border-radius: var(--radius-xs); background: var(--bg-sunken); color: var(--ink-2); font-size: var(--text-xs); font-weight: 500; font-variant-numeric: tabular-nums; }
  .pop__when.is-late { background: var(--danger-tint); color: var(--danger-ink); }
  .pop__when.is-late-soft { background: transparent; color: var(--warning-ink); font-weight: 600; }
  .pop__q, .pop__list { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); color: var(--ink-2); }
  .pop__list i { inline-size: 6px; block-size: 6px; border-radius: 50%; flex: none; }
  .pop__actions { display: flex; align-items: center; gap: var(--sp-1); margin-block-start: var(--sp-3); padding-block-start: var(--sp-3); border-block-start: 1px solid var(--hairline); }
  .pop__actions .btn { block-size: var(--control-h-sm); font-size: var(--text-body); }
  .pop__actions .btn:last-child { margin-inline-start: auto; }

  .toast {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    background: var(--bg-surface);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    font-size: var(--text-body); color: var(--ink-1);
    max-inline-size: 460px;
  }
  .toast[hidden] { display: none; }
  .toast svg { color: var(--success-ink); flex: none; }
</style>
</head>
<body data-skin="refined" data-theme="light">
<div class="app">
  <!-- ======================= 导航轨 ======================= -->
  <nav class="rail" aria-label="主导航">
    <div class="rail__avatar" aria-hidden="true">G</div>
    <div class="rail__group">
      <button class="rail__item" type="button" aria-label="事情（清单）" title="事情">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      </button>
      <button class="rail__item" type="button" aria-label="四象限" title="四象限">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
      </button>
      <button class="rail__item" type="button" aria-label="日历" aria-current="page" title="日历">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
      </button>
      <button class="rail__item" type="button" aria-label="搜索" title="搜索">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="rail__item" type="button" aria-label="归档" title="归档">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
      </button>
    </div>
    <div class="rail__group rail__group--bottom">
      <button class="rail__item" type="button" aria-label="同步" title="同步">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
      <button class="rail__item" type="button" aria-label="设置" title="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </nav>

  <!-- ======================= 清单侧栏 ======================= -->
  <aside class="sidebar" aria-label="清单">
    <div class="sidebar__head"><span>快捷</span></div>
    <div class="sidebar__group">
      <button class="sidebar__row" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        <span class="sidebar__label">今天</span><span class="sidebar__count">5</span>
      </button>
      <button class="sidebar__row" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span class="sidebar__label">最近</span><span class="sidebar__count">8</span>
      </button>
      <button class="sidebar__row" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span class="sidebar__label">全部</span><span class="sidebar__count">20</span>
      </button>
    </div>

    <div class="sidebar__head">
      <span>清单</span>
      <button class="icon-btn" type="button" aria-label="新建清单" title="新建清单" style="block-size:20px;inline-size:20px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
      </button>
    </div>
    <div class="sidebar__group">
      <button class="sidebar__row" type="button"><span class="sidebar__dot" style="background:#5b8def"></span><span class="sidebar__label">收集箱</span><span class="sidebar__count">3</span></button>
      <button class="sidebar__row" type="button"><span class="sidebar__dot" style="background:#3aa88b"></span><span class="sidebar__label">工作</span><span class="sidebar__count">9</span></button>
      <button class="sidebar__row" type="button"><span class="sidebar__dot" style="background:#8b79c9"></span><span class="sidebar__label">学习</span><span class="sidebar__count">1</span></button>
      <button class="sidebar__row" type="button"><span class="sidebar__dot" style="background:#d99a3d"></span><span class="sidebar__label">生活</span><span class="sidebar__count">6</span></button>
    </div>

    <div class="sidebar__head" style="margin-block-start:auto"><span>状态</span></div>
    <div class="sidebar__group">
      <button class="sidebar__row" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        <span class="sidebar__label">已完成</span><span class="sidebar__count">1</span>
      </button>
    </div>
  </aside>

  <!-- ======================= 主区 ======================= -->
  <div class="main">
    <header class="topbar">
      <h1 class="topbar__title"><span>日程</span>
        <span class="sub">按时间顺序 · 20 件未完成</span>
      </h1>
      <div class="topbar__actions">
        <button class="icon-btn" type="button" aria-label="搜索" title="搜索">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button class="btn btn--primary" type="button" id="newBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
          新建事情
        </button>
      </div>
    </header>

    <div class="content content--agenda">
      <div class="agenda" id="agenda"></div>
    </div>

    <!-- 底部视图切换胶囊 -->
    <div class="floating-center" style="inset-block-end:16px">
      <div class="vpill" role="group" aria-label="切换视图">
        <button class="vpill__item" type="button" data-view="quadrant" aria-pressed="false">四象限</button>
        <button class="vpill__item" type="button" data-view="month" aria-pressed="false">月</button>
        <button class="vpill__item" type="button" data-view="week" aria-pressed="false">周</button>
        <button class="vpill__item" type="button" data-view="day" aria-pressed="false">日</button>
        <button class="vpill__item" type="button" data-view="agenda" aria-pressed="true">日程</button>
        <button class="vpill__item" type="button" data-view="multiday" aria-pressed="false">多日</button>
        <button class="vpill__item" type="button" data-view="multiweek" aria-pressed="false">多周</button>
        <button class="vpill__item" type="button" data-view="year" aria-pressed="false">年</button>
        <span class="vpill__sep" aria-hidden="true"></span>
        <button class="vpill__cta" type="button" id="newBtn2">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
          新建事情
        </button>
      </div>
    </div>

    <!-- toast -->
    <div class="floating-center" style="inset-block-end:64px">
      <div class="toast" id="toast" role="status" aria-live="polite" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        <span id="toastText"></span>
      </div>
    </div>
  </div>
</div>

<!-- 条目弹层 -->
<div class="pop" id="pop" role="dialog" aria-label="事情详情" hidden>
  <div class="pop__title" id="popTitle">—</div>
  <div class="pop__meta">
    <span class="pop__when" id="popWhen">—</span>
    <span class="pop__q" id="popQ"><i class="qdot qdot--2"></i><span>重要不紧急</span></span>
    <span class="pop__list" id="popList"><i></i><span>工作</span></span>
  </div>
  <div class="pop__actions">
    <button class="btn btn--secondary" type="button" id="popOpen">打开</button>
    <button class="btn btn--primary" type="button" id="popDone">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      勾完成
    </button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var K = window.Kairos;
  var LIST = {};
  K.LISTS.forEach(function (l) { LIST[l.id] = l; });

  var DOW = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var MONTH = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

  var pop = document.getElementById('pop');
  var toast = document.getElementById('toast');
  var agenda = document.getElementById('agenda');
  var activeBtn = null;
  var toastTimer = 0;

  function toastMsg(text) {
    document.getElementById('toastText').textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 2800);
  }
  function clampPlace(box, x, y) {
    box.hidden = false;
    var w = box.offsetWidth, h = box.offsetHeight;
    box.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + 'px';
    box.style.top = Math.max(8, Math.min(y, window.innerHeight - h - 8)) + 'px';
  }
  function dowOf(d) {
    var p = d.split('-');
    return DOW[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
  }
  function md(d) {
    var p = d.split('-');
    return MONTH[+p[1] - 1] + (+p[2]) + '日';
  }

  /* ---------------- 分组 ----------------
     今天 → 明天 → 本周 → 下周 → 更远 → 不限
     week/month 归到它们窗口的起点所在的那一组；
     排序遵循 ADR 0004：粗窗口在前（month → week → day → period → time）。 */
  var RUNG_ORDER = { month: 0, week: 1, day: 2, period: 3, time: 4, none: 5 };

  function startDateOf(it) {
    if (it.rung === 'week') return K.weekStartOf(it.date);
    if (it.rung === 'month') return K.monthStartOf(it.date);
    return it.date;
  }
  function minuteOf(it) {
    if (it.rung === 'time') return +it.time.slice(0, 2) * 60 + +it.time.slice(3, 5);
    if (it.rung === 'period') return it.period === 'morning' ? 8 * 60 : it.period === 'afternoon' ? 13 * 60 : 19 * 60;
    /* day 档没有时刻：全天的事排在当天具体时刻之前（它「占一整天」，
       先看见它，再看见这天的会）。 */
    return -1;
  }
  function sortItems(a, b) {
    var sa = startDateOf(a), sb = startDateOf(b);
    if (sa !== sb) return sa < sb ? -1 : 1;
    /* 同一天按真实时刻排：这是一份「按时间顺序」的日程，
       不是按六档精度排的清单。时段（下午/晚上）取它典型的那一个小时参与比较，
       所以「下午」排在 15:00 之前、「晚上」排在 18:00 之后。 */
    return minuteOf(a) - minuteOf(b);
  }

  function bucketOf(it) {
    if (it.rung === 'none') return 'none';
    /* month 是「下个月」这种粗窗口，起点常落在下周的头几天。
       按起点日期分组会把它说成「下周到期」，那是把粗窗口当成了承诺 ——
       所以 month 一律进「更远」，与它真正覆盖的那一个月一起被看待。 */
    if (it.rung === 'month') return 'later';
    var s = startDateOf(it);
    var today = K.TODAY;
    if (s === today) return 'today';
    if (s === K.addDays(today, 1)) return 'tomorrow';
    var thisWk = K.weekStartOf(today);
    if (s < thisWk) return 'overdue';
    if (s < K.addDays(thisWk, 7)) return 'thisweek';
    if (s < K.addDays(thisWk, 14)) return 'nextweek';
    return 'later';
  }

  /* 顺序按 SPEC：今天 → 明天 → 本周 → 下周 → 更远 → 不限。
     「已过窗口」是唯一新增的一组，插在明天之后：它是上周没做完的窗口，
     既不属于「本周」，也不该被埋到最下面 —— 那正是 ADR 0004 §3 要让它被看见的东西。 */
  var GROUPS = [
    { id: 'today',    title: '今天',     tag: '今天',   tagCls: '' },
    { id: 'tomorrow', title: '明天',     tag: '',       tagCls: '' },
    { id: 'overdue',  title: '已过窗口', tag: '未完成', tagCls: 'agroup__tag--warn' },
    { id: 'thisweek', title: '本周',     tag: '',       tagCls: '' },
    { id: 'nextweek', title: '下周',     tag: '',       tagCls: '' },
    { id: 'later',    title: '更远',     tag: '',       tagCls: '' },
    { id: 'none',     title: '不限',     tag: '没有日期', tagCls: 'agroup__tag--muted' }
  ];

  /* 窗口已过的 week 归到「已过窗口」之后仍按日期顺排；
     这里把「上周」放在「本周」之前，因为它是 11-16，日期上确实更早。 */

  var items = K.ITEMS.filter(function (it) { return !it.done; });

  /* ---------------- 渲染 ---------------- */
  /* 日程表是「按时间排」的列表，一段（这周 / 下个月）当然只出现一次 ——
     这里不复制，只在它的起始位置列一行，并在时间列写出它覆盖的区间。 */
  function whenText(it) {
    if (it.rung === 'time') return it.time;
    if (it.rung === 'period') return K.PERIOD_LABEL[it.period];
    if (it.rung === 'week') return K.rungLabel(it);
    if (it.rung === 'month') return K.rungLabel(it);
    if (it.rung === 'none') return '不限';
    return '';
  }
  /** 一段的起止，写在标题后面，让「这周」不是一个模糊的词 */
  function spanHint(it) {
    if (it.rung === 'week') {
      var ws = K.weekStartOf(it.date);
      return shortDate(ws) + ' → ' + shortDate(K.addDays(ws, 7));
    }
    if (it.rung === 'month') {
      var ms = K.monthStartOf(it.date);
      var d = K.parse(ms); d.setMonth(d.getMonth() + 1);
      return shortDate(ms) + ' → ' + shortDate(K.fmt(d));
    }
    return '';
  }
  function shortDate(d) { var p = d.split('-'); return (+p[1]) + '/' + (+p[2]); }
  function whenClass(it) {
    var cls = 'arow-item__when';
    if (it.rung === 'time') cls += ' is-time';
    if (K.isLate(it)) cls += ' is-late';
    else if (K.isWindowPassed(it)) cls += ' is-late-soft';
    return cls;
  }
  function flagOf(it) {
    if (K.isLate(it)) return { text: it.rung === 'time' ? '已过' : '逾期', soft: false };
    if (K.isWindowPassed(it)) return { text: '未完成', soft: true };
    return null;
  }

  function rowEl(it) {
    var list = LIST[it.list];
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'arow-item' + (it.done ? ' is-done' : '');
    btn.dataset.id = it.id;
    btn.dataset.title = it.title;
    btn.dataset.when = whenLabelFull(it);
    btn.dataset.q = it.q;
    btn.dataset.list = list.name;
    btn.dataset.lcolor = list.color;
    if (K.isLate(it)) btn.dataset.late = 'danger';
    else if (K.isWindowPassed(it)) btn.dataset.late = 'soft';

    // 时间 / 阶梯标签
    var when = document.createElement('span');
    when.className = whenClass(it);
    when.textContent = whenText(it);
    btn.appendChild(when);

    // 清单色点
    var dot = document.createElement('span');
    dot.className = 'arow-item__dot';
    dot.style.background = list.color;
    btn.appendChild(dot);

    // 标题 + 二阶信息
    var main = document.createElement('span');
    main.className = 'arow-item__main';
    var title = document.createElement('span');
    title.className = 'arow-item__title';
    title.textContent = it.title;
    main.appendChild(title);
    if (it.repeat === 'weekly') {
      var rep = document.createElement('span');
      rep.className = 'arow-item__repeat';
      rep.title = '每周重复';
      rep.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>';
      main.appendChild(rep);
    }
    var flag = flagOf(it);
    if (flag) {
      var f = document.createElement('span');
      f.className = 'arow-item__flag' + (flag.soft ? ' is-soft' : '');
      f.textContent = flag.text;
      main.appendChild(f);
    }
    if (spanHint(it)) {
      var sh = document.createElement('span');
      sh.className = 'arow-item__span';
      sh.textContent = spanHint(it);
      main.appendChild(sh);
    }
    btn.appendChild(main);

    // 象限点 + 复选框
    var end = document.createElement('span');
    end.className = 'arow-item__end';
    var q = document.createElement('span');
    q.className = 'arow-item__q';
    q.style.background = 'var(--q' + it.q + ')';
    q.title = K.QUADRANTS[it.q].name;
    end.appendChild(q);
    var check = document.createElement('input');
    check.type = 'checkbox';
    check.className = 'check';
    check.checked = !!it.done;
    check.setAttribute('aria-label', '完成「' + it.title + '」');
    check.addEventListener('click', function (e) {
      e.stopPropagation();
      finish(it, btn, check.checked);
    });
    end.appendChild(check);
    btn.appendChild(end);

    btn.addEventListener('click', function () { openItem(btn); });
    return btn;
  }

  function whenLabelFull(it) {
    if (it.rung === 'time') return K.rungLabel(it) + ' – ';
    return K.rungLabel(it);
  }

  function groupHead(g, list) {
    var head = document.createElement('div');
    head.className = 'agroup__head';

    if (g.id === 'none') {
      head.innerHTML =
        '<span class="agroup__dow">不限</span>' +
        '<span class="agroup__tag agroup__tag--muted">没有日期</span>' +
        '<span class="agroup__count">' + list.length + ' 件</span>';
      return head;
    }

    /* 表头说的是「这组覆盖哪一段时间」，不是第一条的日期：
       今天 / 明天是单日；本周 / 下周 / 更远 / 已过窗口是一个窗口。 */
    var html;
    if (g.id === 'today' || g.id === 'tomorrow') {
      var d = startDateOf(list[0]);
      html = '<span class="agroup__dow">' + dowOf(d) + '</span>' +
             '<span class="agroup__num">' + md(d) + '</span>';
    } else if (g.id === 'thisweek') {
      var ws = K.weekStartOf(K.TODAY);
      html = '<span class="agroup__dow">本周</span>' +
             '<span class="agroup__num">' + rangeOf(ws) + '</span>';
    } else if (g.id === 'nextweek') {
      var ns = K.addDays(K.weekStartOf(K.TODAY), 7);
      html = '<span class="agroup__dow">下周</span>' +
             '<span class="agroup__num">' + rangeOf(ns) + '</span>';
    } else if (g.id === 'overdue') {
      var ow = K.addDays(K.weekStartOf(K.TODAY), -7);
      html = '<span class="agroup__dow">上周</span>' +
             '<span class="agroup__num">' + rangeOf(ow) + '</span>';
    } else {
      html = '<span class="agroup__dow">更远</span>' +
             '<span class="agroup__num">下月及以后</span>';
    }

    head.innerHTML = html +
      (g.tag ? '<span class="agroup__tag ' + g.tagCls + '">' + g.tag + '</span>' : '') +
      '<span class="agroup__count">' + list.length + ' 件</span>';
    return head;
  }
  /** 一周的起止写作「11/23 – 11/29」 */
  function rangeOf(start) {
    return shortDate(start) + ' – ' + shortDate(K.addDays(start, 6));
  }
  function shortDate(d) { var p = d.split('-'); return (+p[1]) + '/' + (+p[2]); }

  function render() {
    agenda.innerHTML = '';
    GROUPS.forEach(function (g) {
      var list = items.filter(function (it) { return bucketOf(it) === g.id; })
        .sort(sortItems);
      if (!list.length) return;

      var group = document.createElement('section');
      group.className = 'agroup' + (g.id === 'today' ? ' is-today' : '') + (g.id === 'none' ? ' agroup--none' : '');
      group.setAttribute('aria-label', g.title);

      group.appendChild(groupHead(g, list));

      if (g.id === 'none') {
        var ex = document.createElement('p');
        ex.className = 'agroup__explain';
        ex.innerHTML =
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>' +
          '<span>这些事<b>没有日期</b>，所以不在任何一天、也不会过期。它们只等你有空时处理 —— 给个日期，它们就会回到上面的时间顺序里。</span>';
        group.appendChild(ex);
      }

      var rows = document.createElement('div');
      rows.className = 'arows';
      list.forEach(function (it) { rows.appendChild(rowEl(it)); });
      group.appendChild(rows);

      agenda.appendChild(group);
    });
  }

  /* ---------------- 勾完成 ---------------- */
  function finish(it, btn, done) {
    if (!done) return;
    btn.classList.add('is-done');
    var title = it.title;
    var group = btn.closest('.agroup');
    setTimeout(function () {
      // 已完成离开日程；如果组空了，整组一起收掉，否则把表头的件数减一
      btn.remove();
      if (group && !group.querySelector('.arow-item')) {
        group.remove();
      } else if (group) {
        var count = group.querySelector('.agroup__count');
        var left = group.querySelectorAll('.arow-item').length;
        if (count) count.textContent = left + ' 件';
      }
      toastMsg('已完成「' + title + '」，它离开了日程');
    }, 320);
  }

  /* ---------------- 弹层 ---------------- */
  function openItem(btn) {
    activeBtn = btn;
    document.getElementById('popTitle').textContent = btn.dataset.title;
    var when = document.getElementById('popWhen');
    when.textContent = btn.dataset.when;
    when.className = 'pop__when' + (btn.dataset.late === 'soft' ? ' is-late-soft' : btn.dataset.late === 'danger' ? ' is-late' : '');
    document.getElementById('popQ').innerHTML = '<i class="qdot qdot--' + btn.dataset.q + '"></i><span>' + K.QUADRANTS[btn.dataset.q].name + '</span>';
    document.getElementById('popList').innerHTML = '<i style="background:' + btn.dataset.lcolor + '"></i><span>' + btn.dataset.list + '</span>';
    var r = btn.getBoundingClientRect();
    clampPlace(pop, r.right - 264, r.bottom + 6);
  }
  function closePop() { pop.hidden = true; activeBtn = null; }

  document.getElementById('popDone').addEventListener('click', function () {
    if (!activeBtn) return;
    var btn = activeBtn, title = btn.dataset.title;
    closePop();
    var check = btn.querySelector('.check');
    if (check) check.checked = true;
    finish({ title: title }, btn, true);
  });
  document.getElementById('popOpen').addEventListener('click', function () {
    if (!activeBtn) return;
    toastMsg('演示：打开唯一的详情面板（日历 / 清单 / 象限共用）');
  });

  document.getElementById('newBtn').addEventListener('click', function () { toastMsg('演示：打开唯一的新建事情面板'); });
  document.getElementById('newBtn2').addEventListener('click', function () { toastMsg('演示：打开唯一的新建事情面板'); });

  document.querySelectorAll('.vpill__item').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.vpill__item').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      closePop();
    });
  });

  document.addEventListener('pointerdown', function (e) {
    if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('.arow-item')) closePop();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePop();
  });

  render();
});
</script>
</body>
</html>
