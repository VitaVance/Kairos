<!DOCTYPE html>
<!--
  KAIROS v2 — 14 · 多日视图
  依据：design/v2/SPEC.md §7、docs/adr/0004-one-concept-time-ladder.md §2（v2 重写版）

  ── 这张稿子回答四件事 ──
  1. 三 / 五 / 七天的切换是真换列（--n 跟着变，不是把列藏起来）。
  2. 全天条装「某天」与「半天」两档：半天的 chip 带一个「下午 / 晚上」标。
  3. 「这周」不是一个精度档，是「一段时间」的预设（ADR §2）。
     ADR 0006 之后它**不再通栏**：日格只画「占用」（出差、假期）——那段时间真的没了。
     意图性的窗口（这周 / 下个月）改成全天行里的一个计数芯片「这周 · 2 件」，
     和月视图 26 号格子上的「+3」同一族语法：一个计数，一个字形。
     一条带子 = 一件事占了一段，不是七件一样的事。
  4. 时间块：短块（< 46px）横排「标题 + 时间」，高块竖排；
     同一时段相撞的两件事并排分列，谁也不用盖住谁。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kairos v2 · 多日视图</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="demo.css">
<style>
  .topnav { display: flex; align-items: center; gap: var(--sp-1); }
  .topnav__label {
    font-size: var(--text-body); font-weight: 600; color: var(--ink-1);
    font-variant-numeric: tabular-nums; min-inline-size: 9rem; text-align: center;
  }

  .content { display: flex; flex-direction: column; padding: 0; min-block-size: 0; }
  .mdv {
    --n: 3;
    --gutter: 3.25rem;
    --hr: 46px;
    display: flex; flex-direction: column;
    flex: 1; min-block-size: 0;
    background: var(--bg-surface);
  }

  /* ---------- 表头 ---------- */
  .mdv__head {
    display: grid;
    grid-template-columns: var(--gutter) repeat(var(--n), minmax(0, 1fr));
    border-block-end: 1px solid var(--hairline);
    flex: none;
  }
  .mdv__head-gutter { border-inline-end: 1px solid var(--hairline-soft); }
  .mdv__day {
    padding: var(--sp-2) var(--sp-3);
    min-inline-size: 0;
    border-inline-start: 1px solid var(--hairline-soft);
  }
  .mdv__day:first-of-type { border-inline-start: 0; }
  .mdv__dow { font-size: var(--text-xs); color: var(--ink-quiet); }
  .mdv__dnum {
    display: flex; align-items: baseline; gap: var(--sp-2);
    font-size: var(--text-lg); font-weight: 600; color: var(--ink-1);
    font-variant-numeric: tabular-nums; line-height: 1.25;
  }
  .mdv__dnum--today { color: var(--accent-ink); }
  .mdv__today {
    font-size: var(--text-xs); font-weight: 600;
    padding: 0 var(--sp-2); border-radius: var(--radius-full);
    background: var(--accent-tint); color: var(--accent-ink);
    align-self: center;
  }

  /* ---------- 全天区：上面是跨天横带，下面是某天/半天 ---------- */
  .mdv__allday {
    display: grid;
    grid-template-columns: var(--gutter) repeat(var(--n), minmax(0, 1fr));
    grid-template-rows: auto auto auto;
    background: var(--bg-subtle);
    border-block-end: 1px solid var(--hairline);
    flex: none;
  }
  .mdv__allday-gutter {
    grid-row: 1 / 4; grid-column: 1;
    display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between;
    padding: 5px var(--sp-2) 4px;
    border-inline-end: 1px solid var(--hairline-soft);
    font-size: var(--text-xs); color: var(--ink-quiet);
    white-space: nowrap;
  }
  .mdv__allday-gutter span { line-height: 1; }

  /* 跨天横带所在的区域：横跨所有可见列，本身不属于任何一列 */
  .mdv__spanlane {
    grid-row: 1; grid-column: 2 / -1;
    position: relative;
    display: grid; gap: 3px;
    padding: 4px 0 3px;
  }
  /* 跨天区与「全天」区是两个区域：一条发丝线把它们分开，
     也让横带不会被读成「落在下面那几列里的一行」。 */
  .mdv__spanlane:not(.is-empty) { border-block-end: 1px solid var(--hairline); }
  .mdv__spanlane.is-empty { padding-block: 0; }

  /* 窗口芯片行：放在跨天横带与「某天」之间。
     它横跨所有列，但内容只是一两个计数芯片 —— 「这周 · 2 件」。 */
  .mdv__winlane {
    grid-row: 2; grid-column: 2 / -1;
    display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
    padding: 3px 4px;
    border-block-end: 1px solid var(--hairline);
  }
  .mdv__winlane.is-empty { display: none; }
  .wchip {
    appearance: none; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    block-size: 20px; padding: 0 8px;
    border-radius: var(--radius-xs);
    background: var(--bg-surface); color: var(--ink-2);
    font: inherit; font-size: var(--text-xs); font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    border: 1px solid var(--hairline-strong);
  }
  .wchip:hover { background: var(--bg-hover); color: var(--ink-1); }
  .wchip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .wchip__k { font-weight: 500; color: var(--ink-quiet); }
  .wchip__n::before { content: "·"; margin-inline-end: 5px; color: var(--ink-quiet); }

  .spanbar {
    appearance: none; cursor: pointer; text-align: start;
    position: relative;
    display: flex; align-items: center; gap: var(--sp-2);
    min-inline-size: 0; block-size: 1.375rem;
    margin-inline-start: calc(100% / var(--n) * var(--i) + 3px);
    inline-size: calc(100% / var(--n) * var(--span) - 6px);
    padding: 0 var(--sp-2) 0 calc(3px + var(--sp-2));
    border: 0;
    border-inline-start: 3px solid var(--chip-color);
    border-radius: var(--radius-sm);
    background: color-mix(in oklab, var(--chip-color) 14%, var(--bg-surface));
    color: var(--ink-1);
    font: inherit; font-size: var(--text-xs); line-height: 1.35;
    transition: background var(--dur-fast) var(--ease);
  }
  .spanbar:hover { background: color-mix(in oklab, var(--chip-color) 22%, var(--bg-surface)); }
  .spanbar:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  /* 越出视口的那一头：方角 + 去掉前导竖条，读作「还在继续」 */
  .spanbar--cont-l { margin-inline-start: 0; inline-size: calc(100% / var(--n) * var(--span)); border-start-start-radius: 0; border-end-start-radius: 0; border-inline-start-color: transparent; padding-inline-start: var(--sp-2); }
  .spanbar--cont-r { inline-size: calc(100% / var(--n) * var(--span) - 3px); border-start-end-radius: 0; border-end-end-radius: 0; }
  .spanbar--cont-l.spanbar--cont-r { inline-size: calc(100% / var(--n) * var(--span)); }
  .spanbar__cont { color: var(--ink-quiet); flex: none; font-size: var(--text-xs); }
  .spanbar__t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .spanbar__k { margin-inline-start: auto; flex: none; color: var(--ink-2); font-size: var(--text-xs); }

  .mdv__allday-cell {
    grid-row: 3;
    display: flex; flex-direction: column; gap: 2px;
    padding: 2px 3px 4px; min-inline-size: 0;
    border-inline-start: 1px solid var(--hairline-soft);
  }
  .mdv__allday-cell--first { border-inline-start: 0; }
  .mdv__allday-cell--empty::after {
    content: ''; flex: 1; min-block-size: 8px; margin: 2px 3px 1px;
    border-block-end: 1px dashed var(--hairline-strong); opacity: .5;
  }

  /* ---------- 一条事（chip）---------- */
  .chip {
    appearance: none; cursor: pointer; text-align: start;
    display: flex; align-items: baseline; gap: var(--sp-2);
    inline-size: 100%; min-inline-size: 0;
    padding: 2px var(--sp-2);
    border: 0; border-inline-start: 3px solid var(--chip-color);
    border-radius: var(--radius-sm);
    background: color-mix(in oklab, var(--chip-color) 14%, var(--bg-surface));
    color: var(--ink-1);
    font: inherit; font-size: var(--text-xs); line-height: 1.5;
    transition: background var(--dur-fast) var(--ease);
  }
  .chip:hover { background: color-mix(in oklab, var(--chip-color) 22%, var(--bg-surface)); }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .chip__t {
    flex: 1; min-inline-size: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip__k { flex: none; font-size: var(--text-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .chip__k--late { color: var(--danger-ink); font-weight: 600; }
  .chip__period {
    flex: none; padding: 0 4px; border-radius: var(--radius-xs);
    background: color-mix(in oklab, var(--chip-color) 26%, var(--bg-surface));
    color: var(--ink-1); font-weight: 600; font-size: var(--text-xs);
  }
  .chip__repeat { flex: none; color: var(--ink-quiet); display: grid; place-items: center; }

  /* ---------- 时间网格 ---------- */
  .mdv__scroll { flex: 1; min-block-size: 0; overflow: auto; scrollbar-width: thin; }
  .mdv__body {
    display: grid;
    grid-template-columns: var(--gutter) repeat(var(--n), minmax(0, 1fr));
    position: relative;
  }
  .mdv__gutter { position: relative; padding-block-start: 6px; }
  .mdv__hl {
    position: absolute; inset-inline-end: var(--sp-2);
    font-size: var(--text-xs); color: var(--ink-quiet);
    font-variant-numeric: tabular-nums; line-height: 1;
    transform: translateY(-6px); pointer-events: none;
  }
  .mdv__col { position: relative; padding-block-start: 6px; border-inline-start: 1px solid var(--hairline-soft); }
  .mdv__col--today { background: color-mix(in oklab, var(--accent) 4%, var(--bg-surface)); }
  .mdv__line {
    block-size: var(--hr); box-sizing: border-box;
    border-block-end: 1px solid var(--hairline); position: relative;
  }
  .mdv__line::after {
    content: ''; position: absolute; inset-inline: 0; inset-block-start: 50%;
    block-size: 1px; background: color-mix(in oklab, var(--hairline-soft) 70%, transparent);
    pointer-events: none;
  }

  /* 时间块 */
  .blk { position: absolute; box-sizing: border-box; padding: 1px 0; }
  .blk .chip {
    block-size: 100%; box-sizing: border-box;
    padding: 1px var(--sp-2);
  }
  /* 短块（30 分钟等）：一行放「标题 · 时间」 */
  .blk--short .chip { align-items: center; }
  .blk--short .chip__t { white-space: nowrap; }
  /* 高块：标题在上、时间在下 */
  .blk--tall .chip { flex-direction: column; align-items: flex-start; gap: 0; justify-content: center; }
  .blk--tall .chip__t { white-space: normal; line-height: 1.3; }
  .blk--tall .chip__k { white-space: nowrap; }

  /* 现在时刻线 */
  .now {
    position: absolute; inset-inline: 0; z-index: 3;
    block-size: 2px; margin-block-start: -1px;
    background: var(--accent); pointer-events: none;
  }
  .now::before {
    content: ''; position: absolute; inset-inline-start: -4px; inset-block-start: 50%;
    inline-size: 8px; block-size: 8px; border-radius: 50%;
    background: var(--accent); translate: 0 -50%;
  }
  /* The label sits ON the 2px accent line, so --accent-ink on --accent
     measured 1.0:1 — invisible in every skin. Give it the surface as a ground
     and keep the accent as ink: 4.5+ in all six combos. */
  .now__lab {
    position: absolute; inset-block-start: 50%; translate: 0 -50%;
    inset-inline-start: var(--sp-2);
    padding: 0 .25rem;
    border-radius: var(--radius-xs);
    background: var(--bg-surface);
    font-size: var(--text-xs); font-weight: 700; color: var(--accent-ink);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* ---------- 点空格 = 就地捕获 ---------- */
  .cap {
    position: absolute; z-index: 8;
    inline-size: 15.5rem;
    padding: var(--sp-2);
    background: var(--bg-surface);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    display: grid; gap: var(--sp-2);
  }
  .cap__when {
    display: flex; align-items: center; gap: var(--sp-1);
    font-size: var(--text-xs); font-weight: 600; color: var(--accent-ink);
    font-variant-numeric: tabular-nums;
  }
  .cap .field { block-size: var(--control-h-sm); font-size: var(--text-body); }
  .cap__ok {
    inline-size: 100%; block-size: var(--control-h-sm);
    border: 0; cursor: pointer; border-radius: var(--radius-md);
    background: var(--cta-bg); color: var(--cta-text);
    font: inherit; font-size: var(--text-body); font-weight: 600;
  }
  .cap__ok:hover { background: var(--cta-bg-hover); }
  .cap__hint { font-size: var(--text-xs); color: var(--ink-quiet); }

  /* ---------- 窄屏 ----------
     900px 下 220px 侧栏把 3–7 列压得放不下芯片，收起侧栏；
     7 天在更窄的窗口里再缩一点 gutter。 */
  @media (max-width: 900px) {
    .app { grid-template-columns: 56px minmax(0, 1fr); }
    .sidebar { display: none; }
    .topbar { padding-inline: var(--sp-3); }
    .mdv { --gutter: 2.5rem; }
    .mdv__day { padding-inline: var(--sp-2); }
    .spanbar__k { display: none; }
  }
  /* 560 以下：多日视图的列数不变（那是它的语义），但每列只剩 ~55px。
     计时列再收一档，跨天条的说明文字藏掉，只保留色条与标题。 */
  @media (max-width: 560px) {
    .mdv { --gutter: 2rem; }
    .mdv__day { padding-inline: 4px; }
    .spanbar__k, .chip__k { display: none; }
  }

  /* ---------- 详情浮层（与 03 / 04 同一族） ---------- */
  .mdpop {
    position: fixed;
    z-index: 60;
    inline-size: 15rem;
    padding: var(--sp-3);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-lg);
    background: var(--bg-surface);
    box-shadow: var(--shadow-lg);
  }
  .mdpop[hidden] { display: none; }
  .mdpop__title {
    margin: 0 0 var(--sp-1);
    font-size: var(--text-body);
    font-weight: 600;
    color: var(--ink-1);
  }
  .mdpop__when {
    margin: 0 0 var(--sp-1);
    font-size: var(--text-sm);
    color: var(--ink-2);
  }
  .mdpop__when.is-late { color: var(--danger-ink); font-weight: 600; }
  .mdpop__when.is-passed { color: var(--warning-ink); font-weight: 600; }
  .mdpop__meta {
    margin: 0 0 var(--sp-3);
    font-size: var(--text-sm);
    color: var(--ink-quiet);
  }
  .mdpop__acts { display: flex; gap: var(--sp-2); justify-content: flex-end; }
</style>
<script src="data.js" defer></script>
<script src="radio.js" defer></script>
<script src="base.js" defer></script>

        </div>
        <button class="btn btn--ghost" type="button">今天</button>
        <button class="btn btn--primary" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          新建
        </button>
      </div>
    </header>

    <div class="content">
      <div class="mdv" id="mdv" data-days="3">
        <div class="mdv__head" id="head"></div>
        <div class="mdv__allday" id="allday"></div>
        <div class="mdv__scroll" id="scroll">
          <div class="mdv__body" id="grid"></div>
        </div>
      </div>
      <!-- 点任何一件事都开这里。03/04 都有弹层，14 原来只有空白网格能点，
           chip 和跨天条都是死的 —— 同一个产品里「点一件事」不该按视图变意思。 -->
      <div class="mdpop" id="mdpop" role="dialog" aria-modal="false" aria-label="事情详情" hidden>
        <p class="mdpop__title" id="mdpopTitle"></p>
        <p class="mdpop__when" id="mdpopWhen"></p>
        <p class="mdpop__meta" id="mdpopMeta"></p>
        <div class="mdpop__acts">
          <button type="button" class="btn btn--secondary" id="mdpopDone">勾完成</button>
          <button type="button" class="btn btn--primary" id="mdpopOpen">打开</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var K = window.Kairos;
  if (!K) return;

  var DOW = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var HOURS = 24, HR = 46, PAD = 6;

  var state = { days: 3, start: K.addDays(K.now().today, -1) };

  function listColor(id) {
    var l = K.LISTS.filter(function (x) { return x.id === id; })[0];
    return l ? l.color : 'var(--ink-quiet)';
  }
  function mdShort(ds) { return (+ds.slice(5, 7)) + '-' + ds.slice(8); }
  function md(ds) { return (+ds.slice(5, 7)) + ' 月 ' + (+ds.slice(8)) + ' 日'; }
  function hhmm(it) { return it.end ? it.time + '–' + it.end : it.time; }
  function toMin(t) { return (+t.slice(0, 2)) * 60 + (+t.slice(3, 5)); }
  function fmtMin(m) {
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }

  /* 区间的半开切片：终点唯一来自 K.spanEnd()。
     ADR 0006：只给「占用」用 —— 意图不画条，改成计数芯片。 */
  function spanArg(it) {
    return it.rung === 'range' ? { start: it.start, end: it.end } : it.date;
  }
  function spanHalfOpen(it) {
    var r = K.spanEnd(it.rung, spanArg(it), false);
    return r ? { s: r.start, e: r.end } : null;
  }

  /* ISO 周序号（周一为一周之始），与 03 / 04 同一套。 */
  function weekNo(date) {
    var p = date.split('-');
    var t = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    var dow = (t.getUTCDay() + 6) % 7;
    t.setUTCDate(t.getUTCDate() - dow + 3);
    var jan4 = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
    var jdow = (jan4.getUTCDay() + 6) % 7;
    jan4.setUTCDate(jan4.getUTCDate() - jdow + 3);
    return 1 + Math.round((t - jan4) / (7 * 86400000));
  }

  function visibleDays() {
    return Array.from({ length: state.days }, function (_, i) { return K.addDays(state.start, i); });
  }
  function anchorFor(n) {
    if (n === 7) return K.WEEK_START;
    if (n === 5) return K.addDays(K.now().today, -2);
    return K.addDays(K.now().today, -1);
  }

  var REPEAT = '<svg class="chip__repeat" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>';

  function chipHTML(it, extra) {
    var late = K.isLate(it);
    var when = '';
    if (it.rung === 'period') when = '<span class="chip__period">' + K.PERIOD_LABEL[it.period] + '</span>';
    else if (it.rung === 'day' && it.repeat) when = REPEAT;
    return '<button class="chip" type="button" data-id="' + it.id + '" style="--chip-color:' + listColor(it.list) + '" title="' +
      it.title + (it.rung === 'day' ? ' · ' + md(it.date) : '') + '">' +
      '<span class="chip__t">' + it.title + '</span>' + when + (extra || '') + '</button>';
  }

  function render() {
    var days = visibleDays();
    var first = days[0], last = days[days.length - 1];
    var mdv = document.getElementById('mdv');
    mdv.style.setProperty('--n', state.days);
    mdv.dataset.days = state.days;

    /* ---- 表头 ---- */
    var head = '<div class="mdv__head-gutter"></div>';
    days.forEach(function (ds, i) {
      var isToday = ds === K.now().today;
      head += '<div class="mdv__day">' +
        '<div class="mdv__dow">' + DOW[K.parse(ds).getDay()] + '</div>' +
        '<div class="mdv__dnum' + (isToday ? ' mdv__dnum--today' : '') + '">' + (+ds.slice(8)) +
          (isToday ? '<span class="mdv__today">今天</span>' : '') +
        '</div></div>';
    });
    document.getElementById('head').innerHTML = head;

    /* ---- 跨天横带：只有「占用」才占地方（ADR 0006）---- */
    var spans = K.ITEMS.filter(function (it) {
      if (it.done || !K.isOccupancy(it)) return false;
      var sp = spanHalfOpen(it);
      if (!sp) return false;
      return sp.s < K.addDays(last, 1) && sp.e > first;    /* 与可见范围相交 */
    }).sort(function (a, b) { return spanHalfOpen(a).s < spanHalfOpen(b).s ? -1 : 1; });

    var lane = '';
    spans.forEach(function (it) {
      var sp = spanHalfOpen(it);
      var startIdx = Math.max(0, K.diffDays(sp.s, first));
      var endIdx = Math.min(state.days, K.diffDays(sp.e, first));
      var contL = sp.s < first;
      var contR = sp.e > K.addDays(last, 1);
      var cls = 'spanbar' + (contL ? ' spanbar--cont-l' : '') + (contR ? ' spanbar--cont-r' : '');
      lane += '<button class="' + cls + '" type="button" data-id="' + it.id + '" style="--chip-color:' + listColor(it.list) +
          ';--i:' + startIdx + ';--span:' + (endIdx - startIdx) + '" title="' + it.title + ' · ' + K.formatSpan(it.rung, spanArg(it)) + '">' +
          (contL ? '<span class="spanbar__cont" aria-hidden="true">‹</span>' : '') +
          '<span class="spanbar__t">' + it.title + '</span>' +
          '<span class="spanbar__k">' + K.formatSpan(it.rung, spanArg(it)) + '</span>' +
          (contR ? '<span class="spanbar__cont" aria-hidden="true">›</span>' : '') +
        '</button>';
    });

    /* ---- 窗口（意图）：芯片，不是通栏横带 ----
       「这周 · 2 件」——和 +3 同一族；它不占任何一列。 */
    var wins = K.ITEMS.filter(function (it) {
      if (it.done || K.isOccupancy(it)) return false;
      if (it.rung !== 'week' && it.rung !== 'month') return false;
      var sp = spanHalfOpen(it);
      return sp.s < K.addDays(last, 1) && sp.e > first;
    });
    var winGroups = [], byKey = {};
    wins.forEach(function (it) {
      var key = it.rung + ':' + K.startOf(it);
      if (!byKey[key]) {
        byKey[key] = {
          label: it.rung === 'month'
            ? (K.monthStartOf(it.date) === K.monthStartOf(K.now().today) ? '这个月' : K.rungLabel(it))
            : K.rungLabel(it),
          span: K.formatSpan(it.rung, spanArg(it)),
          key: key,
          items: []
        };
        winGroups.push(byKey[key]);
      }
      byKey[key].items.push(it);
    });
    var winChips = winGroups.map(function (g) {
      return '<button class="wchip" type="button" data-win="' + g.key + '" title="' + g.span + '：' +
        g.items.map(function (x) { return x.title; }).join('、') + '">' +
        '<span class="wchip__k">' + g.label + '</span>' +
        '<span class="wchip__n">' + g.items.length + ' 件</span>' +
      '</button>';
    }).join('');

    /* ---- 全天条：某天 + 半天 ---- */
    var ad = '<div class="mdv__allday-gutter"><span>跨天</span><span>全天</span></div>';
    ad += '<div class="mdv__spanlane' + (lane ? '' : ' is-empty') + '" aria-label="跨天占用：横带横跨它覆盖的每一天">' + lane + '</div>';
    ad += '<div class="mdv__winlane' + (winChips ? '' : ' is-empty') + '" aria-label="窗口内的事（不占任何一天）">' + winChips + '</div>';
    days.forEach(function (ds, i) {
      var items = K.ITEMS.filter(function (it) {
        if (it.done || it.date !== ds) return false;
        return it.rung === 'day' || it.rung === 'period';
      }).sort(function (a, b) {
        var r = { day: 0, period: 1 };
        if (r[a.rung] !== r[b.rung]) return r[a.rung] - r[b.rung];
        return (a.period || '') < (b.period || '') ? -1 : 1;
      });
      ad += '<div class="mdv__allday-cell' + (i === 0 ? ' mdv__allday-cell--first' : '') +
        (items.length ? '' : ' mdv__allday-cell--empty') + '">' +
        items.map(function (it) { return chipHTML(it); }).join('') +
        '</div>';
    });
    document.getElementById('allday').innerHTML = ad;

    /* ---- 时间网格 ---- */
    var g = '<div class="mdv__gutter">';
    for (var h = 0; h < HOURS; h++) {
      g += '<span class="mdv__hl" style="top:' + (h * HR + PAD - 1) + 'px">' + String(h).padStart(2, '0') + ':00</span>';
    }
    g += '</div>';

    days.forEach(function (ds, di) {
      var blocks = K.ITEMS.filter(function (it) {
        return !it.done && it.rung === 'time' && it.date === ds;
      }).sort(function (a, b) { return toMin(a.time) - toMin(b.time); });

      /* 相撞的两件事并排：按起始时间贪心分组，组内平分宽度 */
      var groups = [], cur = [];
      blocks.forEach(function (it) {
        var s = toMin(it.time), e = it.end ? toMin(it.end) : s + 30;
        it._s = s; it._e = e;
        if (cur.length && s >= Math.max.apply(null, cur.map(function (x) { return x._e; }))) {
          groups.push(cur); cur = [];
        }
        cur.push(it);
      });
      if (cur.length) groups.push(cur);
      var lanes = {};
      groups.forEach(function (grp) {
        grp.forEach(function (it, k) { lanes[it.id] = { k: k, n: grp.length }; });
      });

      g += '<div class="mdv__col' + (ds === K.now().today ? ' mdv__col--today' : '') + '" data-day="' + ds + '"' +
        (di === 0 ? ' style="border-inline-start:0"' : '') + '>';
      for (var h2 = 0; h2 < HOURS; h2++) g += '<div class="mdv__line"></div>';

      blocks.forEach(function (it) {
        var l = lanes[it.id];
        var top = it._s / 60 * HR + PAD;
        var hgt = Math.max((it._e - it._s) / 60 * HR, 22);
        var late = K.isLate(it);
        var w = 100 / l.n;
        g += '<div class="blk ' + (hgt >= 40 ? 'blk--tall' : 'blk--short') + '" style="top:' + top + 'px;block-size:' + hgt +
          'px;inset-inline:' + (l.k * w) + '% calc(' + ((l.n - l.k - 1) * w) + '% + 4px)">' +
          '<button class="chip" type="button" data-id="' + it.id + '" style="--chip-color:' + listColor(it.list) + '" title="' + it.title + ' · ' + hhmm(it) + '">' +
            '<span class="chip__t">' + it.title + '</span>' +
            '<span class="chip__k' + (late ? ' chip__k--late' : '') + '">' + hhmm(it) + (late ? ' · 已过' : '') + '</span>' +
          '</button></div>';
      });

      if (ds === K.now().today) {
        g += '<div class="now" style="top:' + (K.NOW_MIN / 60 * HR + PAD) + 'px">' +
          '<span class="now__lab">' + fmtMin(K.NOW_MIN) + '</span></div>';
      }
      g += '</div>';
    });
    document.getElementById('grid').innerHTML = g;

    var sc = document.getElementById('scroll');
    sc.scrollTop = Math.max(0, K.now().nowMin / 60 * HR + PAD - 12);

    document.getElementById('range').textContent =
      (first.slice(5, 7) === last.slice(5, 7))
        ? (+first.slice(5, 7)) + ' 月 ' + (+first.slice(8)) + ' – ' + (+last.slice(8)) + ' 日'
        : md(first) + ' – ' + md(last);
  }

  /* ---------- 切天数 ---------- */
  document.getElementById('days-seg').addEventListener('click', function (e) {
    var b = e.target.closest('.seg__item');
    if (!b) return;
    var n = +b.dataset.days;
    if (n === state.days) return;
    state.days = n;
    state.start = anchorFor(n);
    this.querySelectorAll('.seg__item').forEach(function (x) {
      x.setAttribute('aria-checked', String(+x.dataset.days === n));
    });
    clearCap();
    render();
  });

  /* 前后走：ADR 0006 的占用（12/3–12/5）不在今天附近，得能翻到它。 */
  document.getElementById('prevSpan').addEventListener('click', function () {
    state.start = K.addDays(state.start, -state.days);
    clearCap(); render();
  });
  document.getElementById('nextSpan').addEventListener('click', function () {
    state.start = K.addDays(state.start, state.days);
    clearCap(); render();
  });

  /* ---------- 点空格 = 就地捕获 ---------- */
  var cap = null;
  function clearCap() { if (cap && cap.parentNode) cap.parentNode.removeChild(cap); cap = null; }

  function openCap(col, yInCol) {
    clearCap();
    var startMin = Math.max(0, Math.floor(((yInCol - PAD) / HR * 60) / 30) * 30);
    var endMin = Math.min(24 * 60, startMin + 30);
    var ds = col.dataset.day;

    var el = document.createElement('div');
    el.className = 'cap';
    el.innerHTML =
      '<div class="cap__when">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>' +
        md(ds) + ' · ' + fmtMin(startMin) + '–' + fmtMin(endMin) +
      '</div>' +
      '<input class="field" type="text" placeholder="要做什么？" aria-label="事情标题">' +
      '<button class="cap__ok" type="button">加入「工作」</button>' +
      '<div class="cap__hint">回车即存 · Esc 关闭</div>';

    var grid = document.getElementById('grid');
    /* 弹层放在滚动容器里会跟着滚；用相对网格的坐标把它钉在点击处 */
    el.style.left = (col.offsetLeft + 8) + 'px';
    el.style.top = Math.max(0, startMin / 60 * HR - 4) + 'px';
    grid.appendChild(el);
    cap = el;

    var input = el.querySelector('input');
    input.focus();

    el.addEventListener('click', function (ev) {
      if (!ev.target.closest('.cap__ok')) return;
      var v = input.value.trim();
      ev.target.closest('.cap__ok').textContent = v ? '已加入 · ' + v : '已加入（未命名）';
      setTimeout(clearCap, 700);
    });
    el.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') el.querySelector('.cap__ok').click();
      if (ev.key === 'Escape') { clearCap(); }
    });
    setTimeout(function () {
      document.addEventListener('mousedown', function onDoc(ev2) {
        if (cap && !cap.contains(ev2.target)) { clearCap(); document.removeEventListener('mousedown', onDoc); }
      });
    }, 0);
  }

  /* ---------- 点一件事 → 详情浮层 ----------
     三种可点对象：时间块 chip、全天 chip、跨天条，都带 data-id。
     窗口芯片（data-win）是「一组」，点开列出窗口内的事。
     03 / 04 早就能点开，14 原来只有空白网格能点 —— 这不是本视图的取舍，是漏了。 */
  var pop = document.getElementById('mdpop');
  var popFor = null;

  function fmtWhen(it) {
    if (it.rung === 'week' || it.rung === 'month' || it.rung === 'range') {
      return K.formatSpan(it.rung, spanArg(it)) + (K.isWindowPassed(it) ? ' · 未完成' : '');
    }
    return K.rungLabel(it) + (K.isLate(it) ? ' · 已过' : '');
  }

  function openPop(anchor, it) {
    popFor = it;
    document.getElementById('mdpopTitle').textContent = it.title;
    var when = document.getElementById('mdpopWhen');
    when.textContent = fmtWhen(it);
    when.className = 'mdpop__when' + (K.isLate(it) ? ' is-late' : K.isWindowPassed(it) ? ' is-passed' : '');
    var q = K.quadrantOf(it);
    document.getElementById('mdpopMeta').textContent = K.QUADRANTS[q].name + ' · ' + (K.LISTS.filter(function (l) { return l.id === it.list; })[0] || {}).name;
    var r = anchor.getBoundingClientRect();
    pop.hidden = false;
    pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8)) + 'px';
    pop.style.top = Math.max(8, Math.min(r.bottom + 6, window.innerHeight - pop.offsetHeight - 8)) + 'px';
    pop.querySelector('#mdpopDone').focus();
  }
  function closePop() { pop.hidden = true; popFor = null; }

  document.getElementById('mdv').addEventListener('click', function (e) {
    var chip = e.target.closest('[data-id]');
    if (chip) {
      e.stopPropagation();
      var it = K.ITEMS.filter(function (x) { return x.id === +chip.getAttribute('data-id'); })[0];
      if (it) { openPop(chip, it); }
      return;
    }
    var win = e.target.closest('[data-win]');
    if (win) {
      e.stopPropagation();
      var key = win.getAttribute('data-win');
      var members = K.ITEMS.filter(function (x) {
        return !x.done && (x.rung === 'week' || x.rung === 'month') && x.rung + ':' + K.startOf(x) === key;
      });
      var lead = members[0];
      if (!lead) { return; }
      openPop(win, lead);
      document.getElementById('mdpopTitle').textContent = win.textContent.trim();
      document.getElementById('mdpopWhen').textContent = members.map(function (m) { return m.title; }).join('、');
      document.getElementById('mdpopMeta').textContent = members.length + ' 件窗口内的事';
    }
  });

  document.getElementById('mdpopDone').addEventListener('click', function () {
    if (!popFor) { return; }
    popFor.done = true;
    closePop();
    render();
  });
  document.getElementById('mdpopOpen').addEventListener('click', function () {
    closePop();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !pop.hidden) { closePop(); }
  });
  document.addEventListener('pointerdown', function (e) {
    if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('[data-id],[data-win]')) { closePop(); }
  });

  document.getElementById('grid').addEventListener('click', function (e) {
    if (e.target.closest('.blk') || e.target.closest('.cap')) return;
    var col = e.target.closest('.mdv__col');
    if (!col) return;
    openCap(col, e.clientY - col.getBoundingClientRect().top);
  });

  render();
});
</script>
</body>
</html>
