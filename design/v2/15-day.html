<!DOCTYPE html>
<!--
  KAIROS v2 — 15 · 日视图
  依据：design/v2/SPEC.md §7、docs/adr/0004-one-concept-time-ladder.md §2

  ── 一整天，精确到分钟，四个区域从上到下 ──
  1. 页头：11 月 26 日 · 周四 · 「今天」；今天到期 5 件（含已完成 1 件？不含 —— 完成的事离开日历）。
  2. 跨天条：「这周」是「一段时间」的预设（本周一 → 下周一）。
     它覆盖今天，所以在今天这里画成**一根只占今天的横带**，两端加续接箭头，
     读作「这一段盖住了今天」，而不是「今天 08:00 有一件事」。
  3. 全天条：今天的两件半天的事（下午 / 晚上）。它们没有时刻，所以不进时间轴。
  4. 时间轴：00:00–06:00 压成四分之一高（那六小时几乎总是空的），
     06:00 之后按小时等距；14:20 一条现在时刻线；空槽悬停给一个幽灵块，
     点一下变成待确认的块。

  已完成的事（家长会 11-24）不在这里 —— 它离开日历，只留在年视图的热度里。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kairos v2 · 日视图</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="demo.css">
<style>
  .topnav { display: flex; align-items: center; gap: var(--sp-1); }
  .topnav__label {
    font-size: var(--text-body); font-weight: 600; color: var(--ink-1);
    font-variant-numeric: tabular-nums;
  }

  .content { display: flex; flex-direction: column; padding: 0; min-block-size: 0; }
  .day {
    --hr: 32px;
    --early: 0.26;          /* 00:00–06:00 压到 26% */
    --pad: 6px;
    --gutter: 3.5rem;
    display: flex; flex-direction: column;
    flex: 1; min-block-size: 0;
    background: var(--bg-surface);
  }

  /* ---------- 页头 ---------- */
  .day__head {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-3) var(--sp-4);
    border-block-end: 1px solid var(--hairline);
    flex: none;
  }
  .day__date {
    display: flex; align-items: baseline; gap: var(--sp-2);
  }
  .day__dnum {
    font-size: var(--text-2xl); font-weight: 600; line-height: 1;
    color: var(--ink-1); font-variant-numeric: tabular-nums;
  }
  .day__dow { font-size: var(--text-md); color: var(--ink-2); }
  .day__today {
    font-size: var(--text-xs); font-weight: 600;
    padding: 2px var(--sp-2); border-radius: var(--radius-full);
    background: var(--accent-tint); color: var(--accent-ink);
  }
  .day__due {
    margin-inline-start: auto;
    display: flex; align-items: baseline; gap: var(--sp-2);
    font-size: var(--text-sm); color: var(--ink-2);
  }
  .day__due b { font-size: var(--text-md); color: var(--ink-1); font-variant-numeric: tabular-nums; }
  /* 分隔符是文字，必须用墨色令牌。--hairline-strong 是分隔线，
     压在画布上只有 1.28:1 —— 等于看不见。 */
  .day__due-sep { color: var(--ink-quiet); }

  /* ---------- 跨天 + 全天 ---------- */
  .day__top { flex: none; display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr); background: var(--bg-subtle); border-block-end: 1px solid var(--hairline); }
  .day__top-gutter {
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end;
    padding: 5px var(--sp-2);
    border-inline-end: 1px solid var(--hairline-soft);
    font-size: var(--text-xs); color: var(--ink-quiet); white-space: nowrap;
  }
  .day__top-gutter span { line-height: 1; }
  .day__top-body { display: grid; gap: 3px; padding: 4px 0 3px; }

  /* 一根只占今天的横带：两端是续接箭头 */
  .spanbar {
    appearance: none; cursor: pointer; text-align: start;
    display: flex; align-items: center; gap: var(--sp-2);
    block-size: 1.375rem; min-inline-size: 0;
    margin-inline: 3px;
    padding: 0 var(--sp-2);
    border: 0;
    border-radius: var(--radius-sm);
    background: color-mix(in oklab, var(--chip-color) 14%, var(--bg-surface));
    color: var(--ink-1); font: inherit; font-size: var(--text-xs); line-height: 1.35;
    transition: background var(--dur-fast) var(--ease);
  }
  .spanbar:hover { background: color-mix(in oklab, var(--chip-color) 22%, var(--bg-surface)); }
  .spanbar:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .spanbar__t { flex: 1; min-inline-size: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .spanbar__k { flex: none; color: var(--ink-2); font-size: var(--text-xs); white-space: nowrap; }
  .spanbar__cont { flex: none; color: var(--ink-quiet); font-size: var(--text-xs); }
  /* 一根带子横贯今天，两端都不收口：读作「还在继续」 */
  .spanbar { border-radius: 0; }
  .spanbar--top { border-start-start-radius: var(--radius-sm); border-start-end-radius: var(--radius-sm); }
  .spanbar--bottom { border-end-start-radius: var(--radius-sm); border-end-end-radius: var(--radius-sm); }

  .day__allday {
    display: flex; flex-direction: column; gap: 2px;
    padding: 2px 3px 4px; min-inline-size: 0;
    border-block-start: 1px solid var(--hairline);
  }
  .day__allday--empty::after {
    content: ''; min-block-size: 8px; margin: 1px 3px;
    border-block-end: 1px dashed var(--hairline-strong); opacity: .5;
  }

  /* ---------- chip ---------- */
  .chip {
    appearance: none; cursor: pointer; text-align: start;
    display: flex; align-items: center; gap: var(--sp-2);
    inline-size: 100%; min-inline-size: 0;
    padding: 2px var(--sp-2);
    border: 0; border-inline-start: 3px solid var(--chip-color);
    border-radius: var(--radius-sm);
    background: color-mix(in oklab, var(--chip-color) 14%, var(--bg-surface));
    color: var(--ink-1);
    font: inherit; font-size: var(--text-sm); line-height: 1.5;
    transition: background var(--dur-fast) var(--ease);
  }
  .chip:hover { background: color-mix(in oklab, var(--chip-color) 22%, var(--bg-surface)); }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .chip__t { flex: 1; min-inline-size: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip__k { flex: none; font-size: var(--text-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .chip__k--late { color: var(--danger-ink); font-weight: 600; }
  .chip__period {
    flex: none; padding: 0 5px; border-radius: var(--radius-xs);
    background: color-mix(in oklab, var(--chip-color) 26%, var(--bg-surface));
    color: var(--ink-1); font-weight: 600; font-size: var(--text-xs);
  }

  /* ---------- 时间轴 ---------- */
  .day__scroll { flex: 1; min-block-size: 0; overflow: auto; scrollbar-width: thin; }
  .day__grid {
    position: relative;
    display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr);
    block-size: calc(var(--px-total));
    padding-block-start: var(--pad);
  }
  .day__gutter { position: relative; }
  .day__hl {
    position: absolute; inset-inline-end: var(--sp-2);
    font-size: var(--text-xs); color: var(--ink-quiet);
    font-variant-numeric: tabular-nums; line-height: 1;
    transform: translateY(-6px); pointer-events: none;
  }
  /* 压缩带的单一标签：居中在那一段 */
  .day__hl--span { transform: translateY(-50%); text-align: end; }
  .day__col { position: relative; border-inline-start: 1px solid var(--hairline-soft); cursor: cell; }
  .day__line {
    box-sizing: border-box; position: relative;
    border-block-end: 1px solid var(--hairline);
  }
  .day__line::after {
    content: ''; position: absolute; inset-inline: 0; inset-block-start: 50%;
    block-size: 1px; background: color-mix(in oklab, var(--hairline-soft) 70%, transparent);
    pointer-events: none;
  }
  /* 压缩带：不打半线，整段给一层极淡的底，读作「这六小时被折叠了」 */
  .day__line--early { border-block-end-style: dashed; }
  .day__line--early::after { display: none; }
  /* 折叠段两端各一条实线，把它和正常小时区分开 */
  .early-band {
    position: absolute; inset-inline: 0;
    border-block: 1px solid var(--hairline);
    background:
      repeating-linear-gradient(135deg,
        transparent 0 5px,
        color-mix(in oklab, var(--ink-4) 18%, transparent) 5px 6px);
    pointer-events: none;
  }

  .blk { position: absolute; box-sizing: border-box; padding: 1px 0; inset-inline: 4px; }
  .blk .chip { block-size: 100%; box-sizing: border-box; }
  .blk--tall .chip { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; }
  .blk--tall .chip__t { white-space: normal; line-height: 1.3; }
  .blk--tall .blk__acts { inset-block-start: 4px; translate: none; }

  /* 块的操作：只在 hover / focus-within 出现；出现时让出时间标签的位置，
     而不是盖住它 —— 三个东西挤在 32px 高的一行里谁也读不清。 */
  .blk__acts {
    position: absolute; inset-block-start: 50%; translate: 0 -50%; inset-inline-end: 4px;
    display: flex; gap: 2px; opacity: 0;
    transition: opacity var(--dur-fast) var(--ease);
  }
  .blk:hover .blk__acts, .blk:focus-within .blk__acts { opacity: 1; }
  .blk:hover .chip__k, .blk:focus-within .chip__k { visibility: hidden; }
  .blk__act {
    appearance: none; border: 0; cursor: pointer;
    inline-size: 20px; block-size: 20px; border-radius: var(--radius-xs);
    display: grid; place-items: center;
    background: var(--bg-surface); color: var(--ink-2);
    box-shadow: inset 0 0 0 1px var(--hairline-strong);
  }
  .blk__act:hover { background: var(--bg-hover); color: var(--ink-1); }
  .blk__act:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* 幽灵块：空槽悬停时「将要建出来的样子」 */
  .ghost {
    position: absolute; inset-inline: 4px;
    box-sizing: border-box;
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 0 var(--sp-2);
    border: 1px dashed var(--accent);
    border-radius: var(--radius-sm);
    background: color-mix(in oklab, var(--accent) 9%, var(--bg-surface));
    color: var(--accent-ink);
    font: inherit; font-size: var(--text-xs);
    pointer-events: none;
    opacity: 0;
    transition: opacity var(--dur-fast) var(--ease);
  }
  .ghost.is-on { opacity: 1; }

  /* 已点下、待确认的块 */
  .pending {
    position: absolute; inset-inline: 4px; z-index: 4;
    box-sizing: border-box;
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 0 var(--sp-2);
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    background: color-mix(in oklab, var(--accent) 13%, var(--bg-surface));
    color: var(--ink-1);
    font: inherit; font-size: var(--text-sm);
    box-shadow: var(--shadow-sm);
  }
  .pending__t { flex: 1; min-inline-size: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pending__k { flex: none; font-size: var(--text-xs); color: var(--accent-ink); font-variant-numeric: tabular-nums; }
  .pending__go {
    flex: none; appearance: none; border: 0; cursor: pointer;
    block-size: 22px; padding: 0 var(--sp-2); border-radius: var(--radius-xs);
    background: var(--cta-bg); color: var(--cta-text);
    font: inherit; font-size: var(--text-xs); font-weight: 600;
  }
  .pending__go:hover { background: var(--cta-bg-hover); }

  /* 现在时刻线 */
  .now {
    position: absolute; inset-inline: 0; z-index: 5;
    block-size: 2px; margin-block-start: -1px;
    background: var(--accent); pointer-events: none;
  }
  .now::before {
    content: ''; position: absolute; inset-inline-start: -4px; inset-block-start: 50%;
    inline-size: 8px; block-size: 8px; border-radius: 50%;
    background: var(--accent); translate: 0 -50%;
  }
  /* The label sits ON the 2px accent line, so --accent-ink on --accent
     measured 1.0:1 — invisible in every skin. Give it the surface as a ground
     and keep the accent as ink: 4.5+ in all six combos. */
  .now__lab {
    position: absolute; inset-block-start: 50%; translate: 0 -50%;
    inset-inline-start: var(--sp-2);
    padding: 0 .25rem;
    border-radius: var(--radius-xs);
    background: var(--bg-surface);
    font-size: var(--text-xs); font-weight: 700; color: var(--accent-ink);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* ---------- 窄屏 ----------
     日视图的计时列宽由 --gutter 决定；900px 下 220px 侧栏会把标题列吃到很窄，
     先把侧栏收起（与 03/04 一致），再把计时列收窄。 */
  @media (max-width: 900px) {
    .app { grid-template-columns: 56px minmax(0, 1fr); }
    .sidebar { display: none; }
    .topbar { padding-inline: var(--sp-3); }
    .topbar__actions { padding-inline-end: 0; }
    .day { --gutter: 3.25rem; }
    .day__hl { padding-inline: var(--sp-2); }
    .spanbar__k { display: none; }
    .pending { inset-inline: var(--sp-2); }
    .now__lab { inset-inline-start: var(--sp-1); }
  }
  @media (max-width: 560px) {
    .day { --gutter: 2.75rem; }
    .day__hl { font-size: var(--text-xs); }
    .pending__k { display: none; }
  }
</style>
<script src="data.js" defer></script>
<script src="radio.js" defer></script>
<script src="base.js" defer></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var K = window.Kairos;
  if (!K) return;

  var HR = 32, EARLY = 0.26, PAD = 6;
  var HOURS = 24;
  var EARLY_END = 6;                    /* 00:00–06:00 压缩 */

  var DOW = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  /* 日期一律从 K.now().today 推出：串 → 数字，不写死「26」「周四」「11 月」 */
  function dowName(d) {
    var p = d.split('-');
    return DOW[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
  }
  function dayNum(d) { return +d.slice(8); }
  function monthNum(d) { return +d.slice(5, 7); }

  function toMin(t) { return (+t.slice(0, 2)) * 60 + (+t.slice(3, 5)); }
  function fmtMin(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
  function listColor(id) {
    var l = K.LISTS.filter(function (x) { return x.id === id; })[0];
    return l ? l.color : 'var(--ink-quiet)';
  }
  function hhmm(it) { return it.end ? it.time + '–' + it.end : it.time; }

  /* 分 → 像素：压缩带与正常带的唯一区别在这里 */
  function px(min) {
    if (min <= EARLY_END * 60) return min / 60 * HR * EARLY;
    return EARLY_END * HR * EARLY + (min - EARLY_END * 60) / 60 * HR;
  }
  var TOTAL = px(24 * 60);

  /* 一段时间（这周 / 下个月）的起止；「这周」= 本周一 → 下周一 */
  function spanOf(it) {
    if (it.rung === 'week') {
      var s = K.weekStartOf(it.date);
      return { s: s, e: K.addDays(s, 7) };
    }
    if (it.rung === 'month') {
      var s2 = K.monthStartOf(it.date);
      var d = K.parse(s2);
      d.setMonth(d.getMonth() + 1);
      return { s: s2, e: K.fmt(d) };
    }
    return null;
  }

  var sc = document.getElementById('scroll');
  var pending = null;

  function render() {
    var now = K.now();
    var DS = now.today;
    var nowMin = now.nowMin;
    var scrollKeep = sc ? sc.scrollTop : 0;

    /* ---------- 页头：日期 / 星期 / 月份全部由 DS 推出 ---------- */
    var dueItems = K.ITEMS.filter(function (it) {
      return !it.done && it.date === DS;
    });
    document.getElementById('navLabel').textContent = monthNum(DS) + ' 月 ' + dayNum(DS) + ' 日';
    document.getElementById('head').innerHTML =
      '<div class="day__date">' +
        '<span class="day__dnum">' + dayNum(DS) + '</span>' +
        '<span class="day__dow">' + monthNum(DS) + ' 月 · ' + dowName(DS) + '</span>' +
        '<span class="day__today">今天</span>' +
      '</div>' +
      '<div class="day__due">' +
        '今天到期 <b>' + dueItems.length + '</b> 件' +
        '<span class="day__due-sep">/</span>' +
        '本周窗口 <b>' + K.ITEMS.filter(function (it) {
          return !it.done && it.rung === 'week' && K.weekStartOf(it.date) === K.weekStartOf(DS);
        }).length + '</b> 件' +
      '</div>';

    /* ---------- 跨天条 + 全天条 ---------- */
    var spans = K.ITEMS.filter(function (it) {
      if (it.done) return false;
      var sp = spanOf(it);
      return sp && sp.s <= DS && DS < sp.e;   /* 覆盖今天 */
    });
    var adItems = K.ITEMS.filter(function (it) {
      if (it.done || it.date !== DS) return false;
      return it.rung === 'period' || it.rung === 'day';
    }).sort(function (a, b) {
      var r = { day: 0, period: 1 };
      if (r[a.rung] !== r[b.rung]) return r[a.rung] - r[b.rung];
      var order = { morning: 0, afternoon: 1, evening: 2 };
      return (order[a.period] || 0) - (order[b.period] || 0);
    });

    var top = '<div class="day__top-gutter"><span>跨天</span><span>全天</span></div>' +
      '<div class="day__top-body">';

    spans.forEach(function (it) {
      var sp = spanOf(it);
      var contL = sp.s < DS, contR = sp.e > K.addDays(DS, 1);
      var label = it.rung === 'week'
        ? (K.weekStartOf(it.date) === K.weekStartOf(DS) ? '这周' : '上周 · 未完成')
        : K.rungLabel(it);
      top += '<button class="spanbar' + (contL || contR ? ' spanbar--top' : '') + '" type="button" ' +
          'style="--chip-color:' + listColor(it.list) + '" ' +
          'title="' + it.title + ' · ' + (+sp.s.slice(5, 7)) + '-' + (+sp.s.slice(8)) + ' → ' + (+sp.e.slice(5, 7)) + '-' + (+sp.e.slice(8)) + '（覆盖今天）">' +
          (contL ? '<span class="spanbar__cont" aria-hidden="true">‹</span>' : '') +
          '<span class="spanbar__t">' + it.title + '</span>' +
          '<span class="spanbar__k">' + label + ' · 覆盖今天</span>' +
          (contR ? '<span class="spanbar__cont" aria-hidden="true">›</span>' : '') +
        '</button>';
    });

    top += '<div class="day__allday' + (adItems.length ? '' : ' day__allday--empty') + '">' +
      adItems.map(function (it) {
        var mk = it.rung === 'period'
          ? '<span class="chip__period">' + K.PERIOD_LABEL[it.period] + '</span>'
          : '';
        return '<button class="chip" type="button" data-id="' + it.id + '" style="--chip-color:' + listColor(it.list) + '" title="' + it.title + '">' +
          '<span class="chip__t">' + it.title + '</span>' + mk + '</button>';
      }).join('') +
    '</div></div>';
    document.getElementById('top').innerHTML = top;

    /* ---------- 时间轴 ---------- */
    var blocks = K.ITEMS.filter(function (it) {
      return !it.done && it.rung === 'time' && it.date === DS;
    }).sort(function (a, b) { return toMin(a.time) - toMin(b.time); });

    var g = '<div class="day__gutter">';
    for (var h = 0; h < HOURS; h++) {
      if (h === 0) {
        /* 压缩带只留一个居中标签，不写六个 */
        g += '<span class="day__hl day__hl--span" style="top:' + (PAD + px(3 * 60)) + 'px">00 – 06</span>';
      } else if (h >= EARLY_END) {
        g += '<span class="day__hl" style="top:' + (PAD + px(h * 60) - 1) + 'px">' + String(h).padStart(2, '0') + ':00</span>';
      }
    }
    g += '</div>';

    g += '<div class="day__col" id="col">';
    for (var h2 = 0; h2 < HOURS; h2++) {
      var hh = HR * (h2 < EARLY_END ? EARLY : 1);
      g += '<div class="day__line' + (h2 < EARLY_END ? ' day__line--early' : '') + '" style="block-size:' + hh + 'px"></div>';
    }
    /* 压缩带的两端各一条实线，把「折叠」这件事画出来 */
    g += '<div class="early-band" style="top:' + PAD + 'px;block-size:' + px(EARLY_END * 60) + 'px" aria-hidden="true"></div>';

    blocks.forEach(function (it) {
      var s = toMin(it.time), e = it.end ? toMin(it.end) : s + 30;
      it._s = s; it._e = e;
    });

    /* 同一时段相撞的两件事并排分列：15:00–16:00 与 15:30 必须都看得见 */
    var groups = [], cur = [];
    blocks.forEach(function (it) {
      if (cur.length && it._s >= Math.max.apply(null, cur.map(function (x) { return x._e; }))) {
        groups.push(cur); cur = [];
      }
      cur.push(it);
    });
    if (cur.length) groups.push(cur);
    var lanes = {};
    groups.forEach(function (grp) {
      grp.forEach(function (it, k) { lanes[it.id] = { k: k, n: grp.length }; });
    });

    blocks.forEach(function (it) {
      var t = PAD + px(it._s), hgt = Math.max(px(it._e) - px(it._s), 24);
      var late = K.isLate(it);
      var l = lanes[it.id];
      var w = 100 / l.n;
      var inline = (l.n === 1)
        ? 'inset-inline:4px'
        : 'inset-inline:calc(' + (l.k * w) + '% + 4px) calc(' + ((l.n - l.k - 1) * w) + '% + 4px)';
      g += '<div class="blk ' + (hgt >= 44 ? 'blk--tall' : '') + '" style="top:' + t + 'px;block-size:' + hgt + 'px;' + inline + '" data-block="' + it.id + '">' +
        '<button class="chip" type="button" style="--chip-color:' + listColor(it.list) + '" title="' + it.title + ' · ' + hhmm(it) + '">' +
          '<span class="chip__t">' + it.title + '</span>' +
          '<span class="chip__k' + (late ? ' chip__k--late' : '') + '">' + hhmm(it) + (late ? ' · 已过' : '') + '</span>' +
        '</button>' +
        '<span class="blk__acts">' +
          '<button class="blk__act" type="button" aria-label="完成：' + it.title + '" title="完成">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>' +
          '</button>' +
          '<button class="blk__act" type="button" aria-label="更多：' + it.title + '" title="更多">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>' +
          '</button>' +
        '</span>' +
      '</div>';
    });

    /* 现在时刻线：读时钟，不再写死 14:20 */
    g += '<div class="now" style="top:' + (PAD + px(nowMin)) + 'px"><span class="now__lab">' + fmtMin(nowMin) + '</span></div>';
    g += '<div class="ghost" id="ghost" aria-hidden="true"><span id="ghost-t">—</span></div>';
    g += '</div>';

    document.getElementById('grid').innerHTML = g;
    document.getElementById('grid').style.setProperty('--px-total', (TOTAL + PAD * 2) + 'px');

    /* 空槽：悬停给幽灵，点击转待确认 */
    wireSlots();

    /* 时钟每分钟重渲染会把 innerHTML 换掉，滚动位置一起丢；
       重画后把它放回原处，用户滚到哪就停在哪。 */
    if (sc) sc.scrollTop = scrollKeep;
  }

  function wireSlots() {
    var col = document.getElementById('col');
    var ghost = document.getElementById('ghost');
    var ghostT = document.getElementById('ghost-t');
    if (!col || !ghost) return;

    function slotAt(clientY) {
      var r = col.getBoundingClientRect();
      var y = clientY - r.top - PAD;
      /* 反向查：像素 → 分钟（两段斜率不同） */
      var earlyPx = EARLY_END * HR * EARLY;
      var min;
      if (y < earlyPx) min = y / (HR * EARLY) * 60;
      else min = EARLY_END * 60 + (y - earlyPx) / HR * 60;
      return Math.max(0, Math.min(24 * 60 - 30, Math.floor(min / 30) * 30));
    }

    col.addEventListener('mousemove', function (e) {
      if (e.target.closest('.blk') || e.target.closest('.pending')) { ghost.classList.remove('is-on'); return; }
      var m = slotAt(e.clientY);
      ghost.classList.add('is-on');
      ghost.style.top = (PAD + px(m)) + 'px';
      ghost.style.blockSize = Math.max(px(m + 30) - px(m), 20) + 'px';
      ghostT.textContent = fmtMin(m) + '–' + fmtMin(m + 30) + ' · 点击新建';
    });
    col.addEventListener('mouseleave', function () { ghost.classList.remove('is-on'); });

    col.addEventListener('click', function (e) {
      if (e.target.closest('.blk') || e.target.closest('.pending')) return;
      var m = slotAt(e.clientY);
      if (pending) pending.remove();

      pending = document.createElement('div');
      pending.className = 'pending';
      pending.style.top = (PAD + px(m)) + 'px';
      pending.style.blockSize = Math.max(px(m + 30) - px(m), 24) + 'px';
      pending.innerHTML =
        '<span class="pending__t">新事情</span>' +
        '<span class="pending__k">' + fmtMin(m) + '–' + fmtMin(m + 30) + '</span>' +
        '<button class="pending__go" type="button">确认</button>';
      col.appendChild(pending);

      pending.querySelector('.pending__go').addEventListener('click', function (ev) {
        ev.stopPropagation();
        this.textContent = '已加入';
        this.disabled = true;
        setTimeout(function () { if (pending) { pending.remove(); pending = null; } }, 800);
      });
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && pending) { pending.remove(); pending = null; }
  });

  render();

  /* 打开就滚到 11:00 上方：整个下午（现在线、15:00 评审、18:00 报销）都在首屏。
     只在首次渲染时设置一次：时钟每分钟重渲染时不打断读者自己的滚动。 */
  sc.scrollTop = PAD + px(11 * 60) - 16;

  /* 时钟：每分钟把「现在」推一分钟并重渲染，现在线就真的在走。
     today 保持 data.js 里演示的那一天 —— 这是设计稿，不是真实日历。 */
  setInterval(function () {
    var n = K.now();
    K.setNow(n.nowMin + 1, n.today);
    render();
  }, 60000);
});
</script>
</body>
</html>
