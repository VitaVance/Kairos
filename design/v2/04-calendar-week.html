<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairos v2 · 周视图</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="demo.css">
<script src="data.js" defer></script>
<script src="sidebar-counts.js" defer></script>
<script src="base.js" defer></script>
<style>
  .topbar__title { display: flex; align-items: baseline; gap: var(--sp-3); }
  .topbar__title .sub { font-size: var(--text-sm); font-weight: 400; color: var(--ink-quiet); font-variant-numeric: tabular-nums; }
  .topbar__actions { padding-inline-end: 10rem; }
  .nav { display: flex; align-items: center; gap: var(--sp-1); }
  .nav .btn { padding: 0 var(--sp-2); }

  /* ---------- 底部视图胶囊（.floating-center 负责居中） ---------- */
  .vpill {
    display: flex; align-items: center; gap: 2px;
    padding: 4px;
    background: var(--bg-surface);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-full);
    box-shadow: var(--shadow-lg);
    max-inline-size: 100%;
    overflow-x: auto;
  }
  .vpill__item {
    appearance: none; border: 0; cursor: pointer;
    block-size: 30px; padding: 0 var(--sp-3);
    border-radius: var(--radius-full);
    background: transparent; color: var(--ink-2);
    font: inherit; font-size: var(--text-body); white-space: nowrap;
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .vpill__item:hover { background: var(--bg-hover); color: var(--ink-1); }
  .vpill__item[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent-ink); font-weight: 600; }
  .vpill__item:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .vpill__sep { inline-size: 1px; block-size: 18px; background: var(--hairline); margin: 0 var(--sp-1); flex: none; }
  .vpill__cta {
    appearance: none; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    block-size: 30px; padding: 0 var(--sp-3);
    border-radius: var(--radius-full);
    background: var(--cta-bg); color: var(--cta-text);
    font: inherit; font-size: var(--text-body); font-weight: 600; white-space: nowrap;
  }
  .vpill__cta:hover { background: var(--cta-bg-hover); }
  .vpill__cta:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ============================ 周历外壳 ============================ */
  .content--week { display: flex; flex-direction: column; padding: var(--sp-3) var(--sp-4) 76px; }
  .wcal {
    flex: 1; min-block-size: 0;
    display: flex; flex-direction: column;
    background: var(--bg-surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-xl);
    overflow: hidden;
  }

  /* 统一列：52px 时间轴 + 7 天 */
  .grid7 { display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)); }

  /* ---- 表头 ---- */
  .whead { flex: none; border-block-end: 1px solid var(--hairline); background: var(--bg-subtle); }
  .whead__corner {
    display: flex; align-items: flex-end; justify-content: center;
    padding-block-end: 6px;
    font-size: var(--text-xs); color: var(--ink-quiet);
  }
  .wday {
    padding: var(--sp-2) var(--sp-1) 6px;
    border-inline-start: 1px solid var(--hairline-soft);
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .wday__dow { font-size: var(--text-xs); color: var(--ink-quiet); font-weight: 500; }
  .wday__num {
    inline-size: 24px; block-size: 24px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: var(--text-md); font-weight: 600; color: var(--ink-1);
    font-variant-numeric: tabular-nums;
  }
  .wday.is-today .wday__num { background: var(--accent); color: var(--accent-contrast); }
  .wday.is-today .wday__dow { color: var(--accent-ink); font-weight: 600; }
  .wday__load { font-size: var(--text-xs); color: var(--ink-quiet); font-variant-numeric: tabular-nums; }

  /* ---- 窗口带 + 全天条目 ---- */
  .allday { flex: none; background: var(--bg-surface); border-block-end: 1px solid var(--hairline); }

  .arow { display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: stretch; }
  /* display:grid 会盖掉 UA 的 [hidden]{display:none}，必须显式关掉 */
  .arow[hidden] { display: none; }
  .arow + .arow { border-block-start: 1px solid var(--hairline-soft); }
  .arow__gutter {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; padding: 3px 2px;
    border-inline-end: 1px solid var(--hairline);
    text-align: center; line-height: 1.15;
  }
  .arow__gutter b { font-size: var(--text-xs); font-weight: 600; color: var(--ink-2); }
  .arow__gutter span { font-size: var(--text-xs); color: var(--ink-quiet); }

  /* 一段（占用：出差三天 / 假期）：一条按列定位的条。
     ADR 0006：只有真正占掉时间的区间才有资格在这里占地方。
     「这周 / 下个月」这类意图不进日格，也不通栏 —— 见 .winlane。 */
  .bandlane { position: relative; }
  .wband {
    position: absolute; inset-block-start: calc(var(--row, 0) * 22px + 2px);
    block-size: 18px;
    inset-inline-start: calc(var(--a, 0) * 100% / 7 + 3px);
    inline-size: calc((var(--b, 7) - var(--a, 0)) * 100% / 7 - 6px);
    display: flex; align-items: center; gap: 7px;
    padding: 0 8px;
    border: 1px solid color-mix(in oklab, var(--chip) 34%, var(--bg-surface));
    border-inline-start: 3px solid var(--chip);
    border-radius: var(--radius-xs);
    background: color-mix(in oklab, var(--chip) 11%, var(--bg-surface));
    color: var(--ink-1);
    font: inherit; font-size: var(--text-xs); line-height: 1;
    text-align: start; cursor: pointer; overflow: hidden;
  }
  .wband:hover { background: color-mix(in oklab, var(--chip) 17%, var(--bg-surface)); }
  .wband:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .wband__tag {
    flex: none; font-weight: 600; color: var(--ink-2);
    padding-inline-end: 7px;
    border-inline-end: 1px solid color-mix(in oklab, var(--chip) 32%, transparent);
  }
  .wband__title { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .wband__meta { flex: none; margin-inline-start: auto; color: var(--ink-quiet); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .wband__ticks { position: absolute; inset-block: 2px; inset-inline: 0; pointer-events: none; }
  .wband__ticks i { position: absolute; inset-block: 0; inline-size: 1px; background: color-mix(in oklab, var(--chip) 22%, transparent); }
  .wband--late {
    background: color-mix(in oklab, var(--warning-ink) 8%, var(--bg-surface));
    border-color: color-mix(in oklab, var(--warning-ink) 42%, var(--bg-surface));
    border-inline-start-color: var(--warning-ink);
  }
  .wband--late .wband__tag { color: var(--warning-ink); border-inline-end-color: color-mix(in oklab, var(--warning-ink) 34%, transparent); }
  .wband--late .wband__meta { color: var(--warning-ink); font-weight: 600; }
  .wband--late .wband__ticks i { background: color-mix(in oklab, var(--warning-ink) 22%, transparent); }

  /* ---- 窗口（意图）：芯片，不是条 ----
     ADR 0006：这周有 2 件窗口内的事。它和「+3」同一族：一个计数，一个字形。
     它住在全天行里，但不属于任何一天 —— 所以它有自己的行，不通栏、不占列。 */
  .winrow .arow__gutter b { color: var(--ink-1); }
  .winlane {
    display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
    padding: 3px 6px; min-inline-size: 0;
  }
  .wchip {
    appearance: none; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    block-size: 20px; padding: 0 8px;
    border-radius: var(--radius-xs);
    background: var(--bg-sunken); color: var(--ink-2);
    font: inherit; font-size: var(--text-xs); font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .wchip:hover { background: var(--bg-hover); color: var(--ink-1); }
  .wchip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .wchip__k { font-weight: 500; color: var(--ink-quiet); }
  .wchip__n::before { content: "·"; margin-inline-end: 5px; color: var(--ink-quiet); }

  /* 全天条目：7 列，每列一条竖分隔 */
  .allday__chips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: stretch; }
  .aday {
    min-block-size: 26px; padding: 3px 4px 4px;
    border-inline-start: 1px solid var(--hairline-soft);
    display: grid; gap: 3px; align-content: start; min-inline-size: 0;
  }
  .aday:first-child { border-inline-start: 0; }
  .aday.is-today { background: color-mix(in oklab, var(--accent) 5%, transparent); }

  .achip {
    appearance: none; cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    inline-size: 100%; min-block-size: 20px; padding: 0 5px;
    border: 0; border-inline-start: 3px solid var(--chip);
    border-radius: var(--radius-xs);
    background: color-mix(in oklab, var(--chip) 11%, var(--bg-surface));
    color: var(--ink-1);
    font: inherit; font-size: var(--text-xs); line-height: 1.35; text-align: start;
  }
  .achip:hover { background: color-mix(in oklab, var(--chip) 18%, var(--bg-surface)); }
  .achip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .achip__mark { flex: none; font-size: var(--text-xs); font-weight: 600; color: var(--ink-2); padding-inline-end: 4px; border-inline-end: 1px solid color-mix(in oklab, var(--chip) 35%, transparent); }
  .achip__x { flex: 1; min-inline-size: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .achip__flag { flex: none; font-size: var(--text-xs); font-weight: 600; color: var(--danger-ink); }
  .achip--late { background: var(--danger-tint); }
  .achip--late .achip__mark { color: var(--danger-ink); }
  .achip__ico { flex: none; display: inline-grid; place-items: center; color: var(--ink-quiet); }

  /* ---- 压缩区：00:00–06:00 常驻在滚动区之外 ---- */
  .comprow {
    flex: none;
    border-block-end: 1px solid var(--hairline-strong);
    background: var(--bg-sunken);
  }
  .comprow__inner { display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: stretch; }
  .comprow__gutter {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2px; gap: 1px;
    border-inline-end: 1px solid var(--hairline);
    font-size: var(--text-xs); color: var(--ink-quiet);
    line-height: 1.1; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .comprow__gutter b { font-weight: 600; color: var(--ink-2); }
  .comprow__body {
    display: flex; align-items: center; justify-content: center;
    min-block-size: 30px; position: relative;
  }
  .comprow__body span {
    font-size: var(--text-xs); color: var(--ink-quiet);
    padding: 0 var(--sp-2);
    position: relative; z-index: 1;
    background: var(--bg-sunken);
  }
  .comprow__body::before {
    content: ""; position: absolute; inset-inline: 6px; inset-block-start: 50%;
    block-size: 1px; background: var(--hairline-strong);
    background-image: none;
  }

  /* ---- 时间网格 ---- */
  .wbody { flex: 1; min-block-size: 0; overflow: auto; position: relative; }
  .wgrid { --hour: 38px; position: relative; min-inline-size: 0; }
  .wgrid > .grid7 { block-size: calc(18 * var(--hour)); }

  .hours { position: relative; border-inline-end: 1px solid var(--hairline); }
  .hours__tick {
    position: absolute; inset-inline: 0;
    translate: 0 -50%;
    padding-inline-end: 7px;
    text-align: end;
    font-size: var(--text-xs); color: var(--ink-quiet);
    font-variant-numeric: tabular-nums; line-height: 1;
  }

  .daycol {
    position: relative; min-inline-size: 0;
    border-inline-start: 1px solid var(--hairline-soft);
  }
  .daycol.is-weekend { background: var(--bg-subtle); }
  .daycol.is-today { background: color-mix(in oklab, var(--accent) 4%, transparent); }

  .hrule { position: absolute; inset-inline: 0; block-size: 1px; background: var(--hairline-soft); pointer-events: none; }

  .slot {
    position: absolute; inset-inline: 0;
    border: 0; background: transparent; cursor: pointer; padding: 0;
    border-radius: var(--radius-xs);
    z-index: 1;
  }
  .slot:hover { background: color-mix(in oklab, var(--accent) 9%, transparent); }
  .slot:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

  /* ---- 时间块 ---- */
  .tblock {
    position: absolute;
    display: flex; flex-direction: column;
    padding: 2px 4px 2px 5px;
    border: 0; border-inline-start: 3px solid var(--chip);
    border-radius: var(--radius-xs);
    background: color-mix(in oklab, var(--chip) 14%, var(--bg-surface));
    color: var(--ink-1);
    font: inherit; text-align: start;
    cursor: grab; overflow: hidden;
    z-index: 3;
    box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--chip) 18%, transparent);
    transition: background var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
    touch-action: none;
  }
  .tblock:hover { background: color-mix(in oklab, var(--chip) 20%, var(--bg-surface)); z-index: 4; }
  .tblock:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .tblock__time { font-size: var(--text-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; line-height: 1.25; flex: none; }
  .tblock__title { font-size: var(--text-xs); font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .tblock__flag { font-size: var(--text-xs); font-weight: 600; color: var(--danger-ink); flex: none; }
  .tblock--short { flex-direction: row; align-items: center; gap: 5px; padding-block: 0; }
  .tblock--short .tblock__time { flex: none; }
  .tblock--short .tblock__title { flex: 1; min-inline-size: 0; display: block; white-space: nowrap; text-overflow: ellipsis; -webkit-line-clamp: unset; font-weight: 500; }
  .tblock--short .tblock__flag { margin-inline-start: auto; }
  .tblock--late {
    background: var(--danger-tint);
    border-inline-start-color: var(--danger);
    box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--danger) 22%, transparent);
  }
  .tblock--late:hover { background: color-mix(in oklab, var(--danger) 16%, var(--bg-surface)); }
  .tblock--late .tblock__time { color: var(--danger-ink); font-weight: 600; }
  .tblock.is-dragging { cursor: grabbing; z-index: 30; box-shadow: var(--shadow-lg); }

  /* 拖动时的时间提示 */
  .dragtip {
    position: fixed; z-index: var(--z-toast);
    padding: 2px 6px; border-radius: var(--radius-xs);
    background: var(--bg-surface); color: var(--ink-1);
    border: 1px solid var(--hairline-strong);
    box-shadow: var(--shadow-lg);
    font-size: var(--text-xs); font-weight: 600;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .dragtip[hidden] { display: none; }

  /* ---- 当前时间线 ---- */
  .nowline {
    position: absolute; inset-inline: 52px; z-index: 6;
    block-size: 0; pointer-events: none;
    border-block-start: 2px solid var(--accent);
  }
  .nowline__dot {
    position: absolute; inset-block-start: -6px;
    inline-size: 10px; block-size: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px var(--bg-surface);
  }
  .nowline__label {
    position: absolute; inset-block-start: -9px;
    padding: 1px 5px; border-radius: var(--radius-xs);
    background: var(--accent); color: var(--accent-contrast);
    font-size: var(--text-xs); font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .nowline[hidden] { display: none; }
  /* 「今天不在本周」/「在压缩带里」—— 现在线不画时的一句说明 */
  .now-note {
    position: sticky; inset-block-start: 4px;
    margin-inline-start: auto; margin-inline-end: 12px;
    z-index: 7; pointer-events: none;
    inline-size: fit-content;
    padding: 2px 8px; border-radius: var(--radius-full);
    background: var(--bg-surface); color: var(--ink-2);
    border: 1px solid var(--hairline-strong);
    font-size: var(--text-xs); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .now-note[hidden] { display: none; }

  /* ---- 内联捕获（非模态） ---- */
  .cap {
    position: fixed; z-index: var(--z-popover);
    inline-size: 276px; padding: var(--sp-3);
    background: var(--bg-surface);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
  }
  .cap[hidden] { display: none; }
  .cap__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); margin-block-end: var(--sp-2); }
  .cap__head b { font-size: var(--text-body); color: var(--ink-1); font-weight: 600; }
  .cap__head span { font-size: var(--text-xs); color: var(--ink-quiet); font-variant-numeric: tabular-nums; }
  .cap__row { display: flex; align-items: center; gap: var(--sp-2); margin-block-start: var(--sp-2); }
  .cap__label { font-size: var(--text-xs); color: var(--ink-2); inline-size: 2.6em; flex: none; }
  .cap .field { block-size: var(--control-h-sm); }
  .cap__actions { display: flex; align-items: center; gap: var(--sp-1); margin-block-start: var(--sp-3); }
  .cap__actions .btn { block-size: var(--control-h-sm); font-size: var(--text-body); }
  .cap__actions .btn:last-child { margin-inline-start: auto; }
  .cap__hint { margin: var(--sp-2) 0 0; font-size: var(--text-xs); color: var(--ink-quiet); line-height: 1.5; }

  /* ---- 条目弹层 ---- */
  .pop {
    position: fixed; z-index: var(--z-popover);
    inline-size: 264px; padding: var(--sp-3);
    background: var(--bg-surface);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
  }
  .pop[hidden] { display: none; }
  .pop__title { font-size: var(--text-md); font-weight: 600; color: var(--ink-1); line-height: 1.4; }
  .pop__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-block-start: var(--sp-2); }
  .pop__when { display: inline-flex; align-items: center; block-size: 20px; padding: 0 var(--sp-2); border-radius: var(--radius-xs); background: var(--bg-sunken); color: var(--ink-2); font-size: var(--text-xs); font-weight: 500; font-variant-numeric: tabular-nums; }
  .pop__when.is-late { background: var(--danger-tint); color: var(--danger-ink); }
  .pop__when.is-late-soft { background: transparent; color: var(--warning-ink); font-weight: 600; }
  .pop__q, .pop__list { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); color: var(--ink-2); }
  .pop__list i { inline-size: 6px; block-size: 6px; border-radius: 50%; flex: none; }
  .pop__note { margin: var(--sp-2) 0 0; font-size: var(--text-xs); color: var(--ink-quiet); line-height: 1.5; }
  .pop__actions { display: flex; align-items: center; gap: var(--sp-1); margin-block-start: var(--sp-3); padding-block-start: var(--sp-3); border-block-start: 1px solid var(--hairline); }
  .pop__actions .btn { block-size: var(--control-h-sm); font-size: var(--text-body); }
  .pop__actions .btn:last-child { margin-inline-start: auto; }

  /* ---- toast ---- */
  .toast {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    background: var(--bg-surface);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    font-size: var(--text-body); color: var(--ink-1);
    max-inline-size: 460px;
  }
  .toast[hidden] { display: none; }
  .toast svg { color: var(--success-ink); flex: none; }

  /* ---------- 窄屏 ----------
     900px 下 220px 侧栏把 7 列压到 ~80px，横带标题会被挤成 0 宽。
     收起侧栏，7 列拿回整条宽度。 */
  @media (max-width: 900px) {
    .app { grid-template-columns: 56px minmax(0, 1fr); }
    .sidebar { display: none; }
    .topbar { padding-inline: var(--sp-3); }
    .topbar__actions { padding-inline-end: 0; }
    .content--week { padding-inline: var(--sp-2); }
    .grid7 { grid-template-columns: 40px repeat(7, minmax(0, 1fr)); }
    .arow, .comprow__inner { grid-template-columns: 40px minmax(0, 1fr); }
    .wband { gap: 4px; padding: 0 5px; }
    .wband__meta { display: none; }
    .nowline { inset-inline: 40px; }
  }
  /* 560 以下：7 天 × ~46px。时间块里的标题放不下了，只留时间与色条；
     全天行里的芯片同理，缩成圆点宽度。 */
  @media (max-width: 560px) {
    .content--week { padding-inline: 4px; }
    .grid7 { grid-template-columns: 34px repeat(7, minmax(0, 1fr)); }
    .arow, .comprow__inner { grid-template-columns: 34px minmax(0, 1fr); }
    .tblock__title, .achip__x, .wband { display: none; }

    .comprow__gutter { font-size: 10px; }
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var K = window.Kairos;
  var LIST = {};
  K.LISTS.forEach(function (l) { LIST[l.id] = l; });

  var START = K.WEEK_START;
  var DAYS = [];
  for (var i = 0; i < 7; i++) DAYS.push(K.addDays(START, i));
  var DOW = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  /* 演示允许在两周边界内前后走：ADR 0006 的那条「占用」（12/3–12/5）不在本周，
     不给走法它就永远证明不了自己。范围从数据算，不写字面量。 */
  var WEEK_MIN = K.WEEK_START;
  var WEEK_MAX = K.addDays(K.WEEK_START, 14);

  var HOUR = 38;                 // 每小时像素
  var DAY_START = 6 * 60;        // 网格从 06:00 起（00–06 在压缩带里）
  var DAY_END = 24 * 60;
  var GUTTER = 52;

  function yOf(min) { return (min - DAY_START) / 60 * HOUR; }
  function fmtTime(min) {
    min = Math.round(min);
    var h = Math.floor(min / 60), m = min % 60;
    return String(h % 24).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }
  function shortDate(d) { var p = d.split('-'); return (+p[1]) + '/' + (+p[2]); }

  /* ---------------- 时间块 ---------------- */
  var blocks = [];
  var nextId = 1000;

  /* 切周时重构 DAYS 与时间块：所有渲染都读这两份，改完重画即可。 */
  function setWeek(start) {
    START = start;
    DAYS = [];
    for (var i = 0; i < 7; i++) DAYS.push(K.addDays(START, i));
    blocks = [];
    K.ITEMS.forEach(function (it) {
      if (it.done || it.rung !== 'time') return;
      if (it.date < START || it.date > K.addDays(START, 6)) return;
      var start = +it.time.slice(0, 2) * 60 + +it.time.slice(3, 5);
      var dur = 30;
      if (it.end) dur = (+it.end.slice(0, 2) * 60 + +it.end.slice(3, 5)) - start;
      blocks.push({
        id: nextId++, title: it.title, date: it.date, start: start, dur: dur,
        list: it.list, q: K.quadrantOf(it), late: K.isLate(it), sourceId: it.id
      });
    });
  }
  setWeek(WEEK_MIN);

  var pop = document.getElementById('pop');
  var cap = document.getElementById('cap');
  var toast = document.getElementById('toast');
  var dragtip = document.getElementById('dragtip');
  var wbody = document.getElementById('wbody');
  var grid = document.getElementById('wgrid');
  var colsBox = document.getElementById('dayCols');
  var activeBlock = null, activeTitle = '';
  var capCtx = null;
  var currentDur = 60;
  var toastTimer = 0;

  function toastMsg(text) {
    document.getElementById('toastText').textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 3000);
  }
  function clampPlace(box, x, y) {
    box.hidden = false;
    var w = box.offsetWidth, h = box.offsetHeight;
    box.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + 'px';
    box.style.top = Math.max(8, Math.min(y, window.innerHeight - h - 8)) + 'px';
  }

  /* ---------------- 表头 ---------------- */
  /* ISO 周序号（周一为一周之始）。与 03-month 同一套算法。 */
  function weekNo(date) {
    var p = date.split('-');
    var t = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    var dow = (t.getUTCDay() + 6) % 7;
    t.setUTCDate(t.getUTCDate() - dow + 3);
    var jan4 = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
    var jdow = (jan4.getUTCDay() + 6) % 7;
    jan4.setUTCDate(jan4.getUTCDate() - jdow + 3);
    return 1 + Math.round((t - jan4) / (7 * 86400000));
  }

  /* 页头：「11月23日 – 29日」「2026 年 · 第 48 周 · 本周」——全部从本周起止算。
     跨月时右端带上月份，否则「11月30日 – 6日」读不出是哪个月。 */
  function renderHeader() {
    var end = K.addDays(START, 6);
    document.getElementById('weekTitle').textContent =
      (+START.slice(5, 7)) + '月' + (+START.slice(8)) + '日 – ' +
      (START.slice(5, 7) === end.slice(5, 7) ? '' : (+end.slice(5, 7)) + '月') + (+end.slice(8)) + '日';
    var thisWeek = (K.weekStartOf(K.now().today) === START);
    document.getElementById('weekSub').textContent =
      START.slice(0, 4) + ' 年 · 第 ' + weekNo(START) + ' 周 · ' + (thisWeek ? '本周' : '不在本周');
  }

  function renderHead() {
    var head = document.getElementById('wdayHead');
    head.innerHTML = '';
    DAYS.forEach(function (d, i) {
      var el = document.createElement('div');
      el.className = 'wday';
      if (d === K.now().today) el.classList.add('is-today');
      var n = blocks.filter(function (b) { return b.date === d; }).length + allDayOn(d).length;
      el.innerHTML = '<span class="wday__dow">' + DOW[i] + '</span>' +
        '<span class="wday__num">' + (+d.slice(8)) + '</span>' +
        '<span class="wday__load">' + (n ? n + ' 件' : '—') + '</span>';
      head.appendChild(el);
    });
  }

  /* ---------------- 全天（day / period） ---------------- */
  function allDayOn(date) {
    return K.ITEMS.filter(function (it) {
      return !it.done && it.date === date && (it.rung === 'day' || it.rung === 'period');
    });
  }
  function whenLabel(it) {
    var base = K.rungLabel(it);
    if (K.isLate(it)) return base + (it.rung === 'time' ? ' · 已过' : ' · 逾期');
    return base;
  }

  function renderAllDay() {
    var box = document.getElementById('alldayChips');
    box.innerHTML = '';
    DAYS.forEach(function (d) {
      var cell = document.createElement('div');
      cell.className = 'aday' + (d === K.now().today ? ' is-today' : '');
      allDayOn(d).forEach(function (it) {
        var list = LIST[it.list];
        var late = K.isLate(it);
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'achip' + (late ? ' achip--late' : '');
        b.style.setProperty('--chip', list.color);
        b.dataset.id = it.id;
        b.dataset.title = it.title;
        b.dataset.q = K.quadrantOf(it);
        b.dataset.list = list.name;
        b.dataset.lcolor = list.color;
        b.dataset.when = whenLabel(it);
        if (late) b.dataset.late = 'danger';

        if (it.rung === 'period') {
          var m = document.createElement('span');
          m.className = 'achip__mark';
          m.textContent = K.PERIOD_LABEL[it.period];
          b.appendChild(m);
        }
        if (it.repeat === 'weekly') {
          var ico = document.createElement('span');
          ico.className = 'achip__ico';
          ico.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>';
          ico.title = '每周重复';
          b.appendChild(ico);
        }
        var x = document.createElement('span');
        x.className = 'achip__x';
        x.textContent = it.title;
        b.appendChild(x);
        if (late) {
          var f = document.createElement('span');
          f.className = 'achip__flag';
          f.textContent = '已过';
          b.appendChild(f);
        }
        b.addEventListener('click', function (e) { e.stopPropagation(); openItem(b); });
        cell.appendChild(b);
      });
      box.appendChild(cell);
    });
  }

  /* ---------------- 占用带 + 窗口计数（ADR 0006）----------------
     只有「占用」（blocksTime：出差、假期）在这条带里画。它按列定位，
     横跨它真正覆盖的那几列；越出本周的那一头切平（不带圆角、不带竖条）。
     意图性的区间（这周 / 下个月）不画条，改成全天行里的一个芯片：
     「这周 · 2 件」——和 +3 同一族语法。 */
  function spanArg(it) {
    return it.rung === 'range' ? { start: it.start, end: it.end } : it.date;
  }

  function renderBands() {
    var slot = document.getElementById('bandSlot1');
    slot.innerHTML = '';

    var weekEnd = K.addDays(START, 7);
    var spans = [];
    K.ITEMS.forEach(function (it) {
      if (it.done || !K.isOccupancy(it)) return;                 // 只有占用配占地方
      var r = K.spanEnd(it.rung, spanArg(it), false);            // 切片用半开区间
      if (!r) return;
      if (r.end <= START || r.start >= weekEnd) return;          // 与本周不重叠
      var a = 0, b = 7;
      for (var i = 0; i < 7; i++) { if (DAYS[i] < r.start) a = i + 1; else break; }
      for (var j = 6; j >= 0; j--) { if (K.addDays(DAYS[j], 1) > r.end) b = j; else break; }
      if (a >= b) return;
      spans.push({ item: it, a: a, b: b, contStart: r.start < START, contEnd: r.end > weekEnd });
    });

    document.getElementById('bandRow1').hidden = !spans.length;
    slot.style.blockSize = (spans.length * 22 + 4) + 'px';

    spans.forEach(function (sp, idx) {
      var it = sp.item;
      var list = LIST[it.list];
      var passed = K.isWindowPassed(it);
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'wband' + (passed ? ' wband--late' : '');
      b.style.setProperty('--chip', passed ? 'var(--warning-ink)' : list.color);
      b.style.setProperty('--a', sp.a);
      b.style.setProperty('--b', sp.b);
      b.style.setProperty('--row', idx);
      b.dataset.id = it.id;
      b.dataset.title = it.title;
      b.dataset.q = K.quadrantOf(it);
      b.dataset.list = list.name;
      b.dataset.lcolor = list.color;
      b.dataset.band = it.rung;
      b.dataset.when = K.formatSpan(it.rung, spanArg(it)) + (passed ? ' · 未完成' : '');
      if (passed) b.dataset.late = 'soft';

      b.innerHTML =
        '<span class="wband__tag">占用</span>' +
        '<span class="wband__title"></span>' +
        '<span class="wband__meta"></span>' +
        '<span class="wband__ticks" aria-hidden="true"></span>';
      b.querySelector('.wband__title').textContent = it.title;
      b.querySelector('.wband__meta').textContent = passed ? '未完成' : K.formatSpan(it.rung, spanArg(it));
      var ticks = b.querySelector('.wband__ticks');
      for (var k = sp.a + 1; k < sp.b; k++) {
        var t = document.createElement('i');
        t.style.left = ((k - sp.a) * 100 / (sp.b - sp.a)) + '%';
        ticks.appendChild(t);
      }
      b.addEventListener('click', function (e) { e.stopPropagation(); openItem(b); });
      slot.appendChild(b);
    });
  }

  /* 本周窗口里有哪些「意图」：这周 / 下个月 / 别的周 —— 不占格子，只计数。 */
  function weekWindows() {
    var weekEnd = K.addDays(START, 7);
    return K.ITEMS.filter(function (it) {
      if (it.done || K.isOccupancy(it)) return false;
      if (it.rung !== 'week' && it.rung !== 'month') return false;
      var r = K.spanEnd(it.rung, spanArg(it), false);
      return r.start < weekEnd && r.end > START;
    });
  }

  function renderWindows() {
    var wins = weekWindows();
    var row = document.getElementById('winRow');
    var lane = document.getElementById('winLane');
    lane.innerHTML = '';
    row.hidden = !wins.length;
    if (!wins.length) return;

    // 按窗口分组：「这周」一 chip，「下个月」一 chip —— 不是一件事一 chip。
    var groups = [], byKey = {};
    wins.forEach(function (it) {
      var key = it.rung + ':' + K.startOf(it);
      if (!byKey[key]) {
        byKey[key] = { label: it.rung === 'month' ? (K.monthStartOf(it.date) === K.monthStartOf(K.now().today) ? '这个月' : K.rungLabel(it)) : K.rungLabel(it), span: K.formatSpan(it.rung, spanArg(it)), items: [] , rung: it.rung };
        groups.push(byKey[key]);
      }
      byKey[key].items.push(it);
    });

    groups.forEach(function (g) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'wchip';
      b.innerHTML = '<span class="wchip__k"></span><span class="wchip__n"></span>';
      b.querySelector('.wchip__k').textContent = g.label;
      b.querySelector('.wchip__n').textContent = g.items.length + ' 件';
      b.dataset.count = '1';
      b.setAttribute('aria-label', g.label + '有 ' + g.items.length + ' 件窗口内的事：' + g.span);
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        toastMsg(g.label + '（' + g.span + '）· ' + g.items.map(function (x) { return x.title; }).join('、'));
      });
      lane.appendChild(b);
    });
  }

  /* ---------------- 时间网格 ---------------- */
  function renderHours() {
    var hours = document.getElementById('hours');
    hours.innerHTML = '';
    for (var h = 6; h <= 24; h++) {
      var t = document.createElement('span');
      t.className = 'hours__tick';
      t.style.top = yOf(h * 60) + 'px';
      t.textContent = h === 24 ? '24:00' : fmtTime(h * 60);
      hours.appendChild(t);
    }
  }

  /* 重叠时间块分列 */
  function laneLayout(list) {
    var sorted = list.slice().sort(function (a, b) { return a.start - b.start || a.dur - b.dur; });
    var groups = [], cur = [], curEnd = -1;
    sorted.forEach(function (b) {
      if (cur.length && b.start >= curEnd) { groups.push(cur); cur = []; curEnd = -1; }
      cur.push(b);
      curEnd = Math.max(curEnd, b.start + b.dur);
    });
    if (cur.length) groups.push(cur);
    groups.forEach(function (g) {
      var laneEnds = [];
      g.forEach(function (b) {
        var placed = false;
        for (var i = 0; i < laneEnds.length; i++) {
          if (laneEnds[i] <= b.start) { laneEnds[i] = b.start + b.dur; b.lane = i; placed = true; break; }
        }
        if (!placed) { laneEnds.push(b.start + b.dur); b.lane = laneEnds.length - 1; }
      });
      g.forEach(function (b) { b.lanes = laneEnds.length; });
    });
  }

  function renderCols() {
    colsBox.innerHTML = '';
    var height = (DAY_END - DAY_START) / 60 * HOUR;
    DAYS.forEach(function (d, i) {
      var col = document.createElement('div');
      col.className = 'daycol';
      col.dataset.date = d;
      if (d === K.now().today) col.classList.add('is-today');
      if (i >= 5) col.classList.add('is-weekend');
      col.style.blockSize = height + 'px';

      for (var h = 6; h <= 24; h++) {
        var line = document.createElement('span');
        line.className = 'hrule';
        line.style.top = yOf(h * 60) + 'px';
        col.appendChild(line);
      }
      for (var hh = 6; hh < 24; hh++) {
        var slot = document.createElement('button');
        slot.type = 'button';
        slot.className = 'slot';
        slot.style.top = yOf(hh * 60) + 'px';
        slot.style.blockSize = HOUR + 'px';
        slot.dataset.hour = hh;
        slot.setAttribute('aria-label', DOW[i] + ' ' + fmtTime(hh * 60) + ' 新建事情');
        col.appendChild(slot);
      }

      var dayBlocks = blocks.filter(function (b) { return b.date === d; });
      laneLayout(dayBlocks);
      dayBlocks.forEach(function (b) { col.appendChild(blockEl(b)); });

      colsBox.appendChild(col);
    });
  }

  function blockEl(b) {
    var list = LIST[b.list] || K.LISTS[0];
    var top = yOf(b.start);
    var h = Math.max(yOf(b.start + b.dur) - top, 18);
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'tblock' + (b.late ? ' tblock--late' : '') + (h < 44 ? ' tblock--short' : '');
    el.style.setProperty('--chip', b.late ? 'var(--danger)' : list.color);
    el.style.top = top + 'px';
    el.style.blockSize = (h - 2) + 'px';
    var lanes = b.lanes || 1;
    var laneW = 100 / lanes;
    el.style.insetInlineStart = 'calc(' + (b.lane || 0) * laneW + '% + 2px)';
    el.style.inlineSize = 'calc(' + laneW + '% - 4px)';
    el.dataset.id = b.id;
    el.dataset.title = b.title;
    el.dataset.q = b.q || 4;
    el.dataset.list = list.name;
    el.dataset.lcolor = list.color;
    el.dataset.when = shortDate(b.date) + ' · ' + fmtTime(b.start) + '–' + fmtTime(b.start + b.dur);
    if (b.late) el.dataset.late = 'danger';

    el.innerHTML =
      '<span class="tblock__time">' + fmtTime(b.start) + '–' + fmtTime(b.start + b.dur) + '</span>' +
      '<span class="tblock__title"></span>' +
      (b.late ? '<span class="tblock__flag">已过</span>' : '');
    el.querySelector('.tblock__title').textContent = b.title;

    el.addEventListener('click', function (e) {
      if (el.dataset.dragged === '1') { el.dataset.dragged = '0'; return; }
      e.stopPropagation();
      openItem(el);
    });
    el.addEventListener('pointerdown', startDrag);
    return el;
  }

  /*
   * 现在线。三种「不画」的情形都要说清楚，否则线会跑到负坐标或跑进 gutter：
   *   1. 今天不在本周（DAYS 里没有 today）—— 整条线隐藏，dot 不许留在 gutter 里；
   *   2. nowMin 落在 00:00–06:00 的压缩带里 —— 网格从 06:00 起画，yOf() 会给负值，
   *      线藏起来，标签也不显示（压缩带里没有它的位置）；
   *   3. 任何 y 也不允许是负的 —— 兜底 clamp。
   * 线本身带一个「今天不在本周」的说明文字，而不是沉默地消失。
   */
  function renderNow() {
    var now = K.now();
    var line = document.getElementById('nowline');
    var label = document.getElementById('nowLabel');
    var note = document.getElementById('nowNote');
    var idx = DAYS.indexOf(now.today);
    var inDay = idx !== -1;
    var inGrid = now.nowMin >= DAY_START && now.nowMin <= DAY_END;

    if (!inDay) {
      line.hidden = true;
      if (note) { note.hidden = false; note.textContent = '今天不在本周（' + now.today + '）'; }
      return;
    }
    if (!inGrid) {
      // 在压缩带：线不画，但告诉读者它为什么不在
      line.hidden = true;
      if (note) { note.hidden = false; note.textContent = fmtTime(now.nowMin) + ' 在 00–06 压缩带里'; }
      return;
    }
    line.hidden = false;
    if (note) note.hidden = true;

    var y = yOf(now.nowMin);
    line.style.top = Math.max(0, y) + 'px';
    var oneCol = '((100% - ' + GUTTER + 'px) / 7)';
    var xPos = 'calc(' + GUTTER + 'px + ' + idx + ' * ' + oneCol + ')';
    document.getElementById('nowDot').style.insetInlineStart = 'calc(' + xPos + ' - 5px)';
    label.textContent = fmtTime(now.nowMin);
    label.style.insetInlineStart = 'calc(' + xPos + ' + 4px)';
  }

  /* 初始滚动：把当前时刻放到可视区正中，且必须可复现。
     坑：DOMContentLoaded 时 flex 高度还没最终确定，clientHeight 读到的小值会把
     计算结果 clamp 到最大值（滚到底），六次开页就会时中时底。
     只靠「连续两帧 clientHeight 相同」也会被骗：布局在中间态停两帧是常事。
     所以用 ResizeObserver 跟着 wbody 的真实高度走，直到用户第一次滚动/交互为止
     —— 高度稳定后最后一次回调就把 scrollTop 钉在同一处。 */
  function computeScrollTop(clientH) {
    var now = K.now();
    if (DAYS.indexOf(now.today) === -1) return 0;
    var y = yOf(Math.max(DAY_START, Math.min(now.nowMin, DAY_END)));
    return Math.max(0, y - clientH / 2);
  }
  var autoFollow = true;
  function positionNow() {
    if (!autoFollow) return;
    wbody.scrollTop = computeScrollTop(wbody.clientHeight);
  }
  function scrollToNow() {
    autoFollow = true;
    positionNow();
    requestAnimationFrame(positionNow);
  }

  function renderAll() {
    renderHeader();
    renderHead();
    renderAllDay();
    renderBands();
    renderWindows();
    renderHours();
    renderCols();
    renderNow();
    // 注意：这里**不**滚动。DOMContentLoaded 时布局未定，clientHeight 偏小会把
    // 计算结果 clamp 成最大值，六次开页就会时中时底。初始滚动交给 settleScroll()。
  }

  /* ---------------- 点击空白槽：内联捕获 ---------------- */
  function openCapture(col, hour) {
    hidePop();
    capCtx = { date: col.dataset.date, start: hour * 60, dur: currentDur };
    document.getElementById('capInput').value = '';
    updateCapWhen();
    var r = col.getBoundingClientRect();
    var yTop = window.scrollY + r.top + yOf(hour * 60) - wbody.scrollTop + 2;
    var x = Math.min(r.left + 8, window.innerWidth - 296);
    clampPlace(cap, x, Math.min(Math.max(70, yTop), window.innerHeight - 220));
    setTimeout(function () { document.getElementById('capInput').focus(); }, 20);
  }
  function updateCapWhen() {
    if (!capCtx) return;
    document.getElementById('capWhen').textContent =
      shortDate(capCtx.date) + ' ' + fmtTime(capCtx.start) + '–' + fmtTime(Math.min(capCtx.start + capCtx.dur, 24 * 60));
  }

  grid.addEventListener('click', function (e) {
    var slot = e.target.closest('.slot');
    if (slot) {
      openCapture(slot.closest('.daycol'), +slot.dataset.hour);
      return;
    }
    if (!e.target.closest('.tblock, .cap')) hidePop();
  });

  document.querySelectorAll('#cap [data-dur]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#cap [data-dur]').forEach(function (x) { x.setAttribute('aria-checked', 'false'); });
      b.setAttribute('aria-checked', 'true');
      currentDur = +b.dataset.dur;
      if (capCtx) { capCtx.dur = currentDur; updateCapWhen(); }
    });
  });

  function closeCap() { cap.hidden = true; capCtx = null; }
  document.getElementById('capCancel').addEventListener('click', closeCap);
  document.getElementById('capSave').addEventListener('click', saveCap);
  document.getElementById('capInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); saveCap(); }
    if (e.key === 'Escape') { e.preventDefault(); closeCap(); }
  });
  function saveCap() {
    if (!capCtx) return;
    var title = document.getElementById('capInput').value.trim() || '新事情';
    var ctx = capCtx;
    blocks.push({
      id: nextId++, title: title, date: ctx.date, start: ctx.start, dur: ctx.dur,
      list: 'inbox', q: 4
    });
    closeCap();
    renderHead();
    renderCols();
    renderNow();
    toastMsg('已新建「' + title + '」· ' + shortDate(ctx.date) + ' ' + fmtTime(ctx.start) + '–' + fmtTime(ctx.start + ctx.dur));
  }

  /* ---------------- 拖动：换时间 / 换天 ---------------- */
  var drag = null;
  /** 以「天列」的几何为准换算列下标 —— 不能用被拖块的列做原点，那样原地放下会算成周一。 */
  function colIndexAt(rects, clientX) {
    for (var i = 0; i < rects.length; i++) {
      if (clientX >= rects[i].left && clientX < rects[i].right) return i;
    }
    return clientX < rects[0].left ? 0 : rects.length - 1;
  }
  function startDrag(e) {
    if (e.button != null && e.button !== 0) return;
    var el = e.currentTarget;
    var b = blocks.find(function (x) { return x.id === +el.dataset.id; });
    if (!b) return;
    drag = {
      el: el, b: b, startY: e.clientY, startX: e.clientX,
      origStart: b.start,
      rects: Array.prototype.map.call(document.querySelectorAll('.daycol'), function (c) {
        return c.getBoundingClientRect();
      }),
      moved: false
    };
    el.setPointerCapture(e.pointerId);
    el.classList.add('is-dragging');
    el.addEventListener('pointermove', onDrag);
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
    e.preventDefault();
    hidePop();
  }
  function dragTarget(e) {
    var dy = e.clientY - drag.startY;
    var deltaMin = Math.round((dy / (HOUR / 60)) / 15) * 15;
    var newStart = Math.max(DAY_START, Math.min(DAY_END - drag.b.dur, drag.origStart + deltaMin));
    var colIdx = colIndexAt(drag.rects, e.clientX);
    return { dy: dy, start: newStart, col: colIdx };
  }
  function onDrag(e) {
    if (!drag) return;
    var dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
    if (!drag.moved && Math.abs(dy) < 4 && Math.abs(dx) < 4) return;
    drag.moved = true;
    var t = dragTarget(e);
    drag.el.style.translate = (-drag.rects[DAYS.indexOf(drag.b.date)].left + drag.rects[t.col].left) + 'px ' + t.dy + 'px';

    dragtip.hidden = false;
    dragtip.textContent = DOW[t.col] + ' ' + fmtTime(t.start) + '–' + fmtTime(t.start + drag.b.dur);
    dragtip.style.left = (e.clientX + 14) + 'px';
    dragtip.style.top = (e.clientY + 10) + 'px';
  }
  function endDrag(e) {
    if (!drag) return;
    var el = drag.el, b = drag.b;
    el.removeEventListener('pointermove', onDrag);
    el.removeEventListener('pointerup', endDrag);
    el.removeEventListener('pointercancel', endDrag);
    el.classList.remove('is-dragging');
    el.style.translate = '';
    dragtip.hidden = true;

    if (drag.moved) {
      var t = dragTarget(e);
      b.start = t.start;
      b.date = DAYS[t.col];
      el.dataset.dragged = '1';
      renderHead(); renderCols(); renderNow();
      toastMsg('已移到 ' + DOW[t.col] + ' ' + fmtTime(b.start) + '–' + fmtTime(b.start + b.dur));
      // 让 click 不要紧接着打开弹层
      setTimeout(function () { el.dataset.dragged = '0'; }, 0);
    }
    drag = null;
  }

  /* ---------------- 条目弹层 ---------------- */
  function openItem(el) {
    activeBlock = el;
    activeTitle = el.dataset.title;
    document.getElementById('popTitle').textContent = el.dataset.title;
    var when = document.getElementById('popWhen');
    when.textContent = el.dataset.when;
    when.className = 'pop__when' + (el.dataset.late === 'soft' ? ' is-late-soft' : el.dataset.late === 'danger' ? ' is-late' : '');
    document.getElementById('popQ').innerHTML = '<i class="qdot qdot--' + el.dataset.q + '"></i><span>' + K.QUADRANTS[el.dataset.q].name + '</span>';
    document.getElementById('popList').innerHTML = '<i style="background:' + el.dataset.lcolor + '"></i><span>' + el.dataset.list + '</span>';
    var note = document.getElementById('popNote');
    if (el.dataset.band) {
      note.hidden = false;
      note.textContent = '这几天是真的被占掉了（出差 / 假期），所以它在日历上占地方。';
    } else note.hidden = true;
    var r = el.getBoundingClientRect();
    clampPlace(pop, r.right + 8, r.top);
    closeCap();
  }
  function hidePop() { pop.hidden = true; activeBlock = null; activeTitle = ''; }

  document.getElementById('popDone').addEventListener('click', function () {
    if (!activeBlock) return;
    var el = activeBlock, id = el.dataset.id, band = el.dataset.band, title = activeTitle;
    hidePop();
    if (band) {
      document.querySelectorAll('.wband[data-id="' + id + '"]').forEach(function (n) { n.parentNode.removeChild(n); });
      renderBands();
      renderWindows();
    } else if (el.classList.contains('tblock')) {
      blocks = blocks.filter(function (x) { return x.id !== +id; });
      renderHead(); renderCols();
    } else {
      if (el.parentNode) el.parentNode.removeChild(el);
      renderHead();
    }
    toastMsg('已完成「' + title + '」，它离开了日历');
  });
  document.getElementById('popOpen').addEventListener('click', function () {
    if (!activeBlock) return;
    toastMsg('演示：打开唯一的详情面板（日历 / 清单 / 象限共用）');
  });

  document.getElementById('newBtn').addEventListener('click', function () { toastMsg('演示：打开唯一的新建事情面板'); });
  document.getElementById('newBtn2').addEventListener('click', function () { toastMsg('演示：打开唯一的新建事情面板'); });
  document.getElementById('prevW').addEventListener('click', function () {
    var prev = K.addDays(START, -7);
    if (prev < WEEK_MIN) { toastMsg('演示从 ' + K.shortDate(WEEK_MIN) + ' 那一周开始'); return; }
    setWeek(prev); renderAll();
  });
  document.getElementById('nextW').addEventListener('click', function () {
    var next = K.addDays(START, 7);
    if (next > WEEK_MAX) { toastMsg('演示到 ' + K.shortDate(K.addDays(WEEK_MAX, 6)) + ' 那一周为止'); return; }
    setWeek(next); renderAll();
  });
  document.getElementById('todayBtn').addEventListener('click', function () {
    // 「今天」= 当前时钟所在的那一周，不是写死的演示起点
    setWeek(K.weekStartOf(K.now().today)); renderAll(); scrollToNow(); toastMsg('回到今天所在的那一周');
  });

  document.querySelectorAll('.vpill__item').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.vpill__item').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      hidePop(); closeCap();
    });
  });

  document.addEventListener('pointerdown', function (e) {
    if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('.tblock, .achip, .wband')) hidePop();
    if (!cap.hidden && !cap.contains(e.target) && !e.target.closest('.slot')) closeCap();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { hidePop(); closeCap(); }
  });

  renderAll();

  /* 布局落地后再定位初始滚动：ResizeObserver 等到 wbody 高度稳定才落位，
     保证六次开页 scrollTop 相同（验收帧 5）。用户一旦自己滚，就不再跟随。 */
  scrollToNow();
  if (window.ResizeObserver) {
    new ResizeObserver(function () { positionNow(); }).observe(wbody);
  }
  wbody.addEventListener('wheel', function () { autoFollow = false; }, { passive: true });
  wbody.addEventListener('touchmove', function () { autoFollow = false; }, { passive: true });
  wbody.addEventListener('keydown', function () { autoFollow = false; });
  // 兜底：几秒后无论布局如何都停掉跟随，避免一直抢用户的滚动
  setTimeout(function () { autoFollow = false; }, 4000);

  window.addEventListener('resize', function () { renderNow(); });

  /* 时钟：每分钟推一分钟并重渲染，现在线随之移动；页头「本周」也随时间更新。
     重渲染只动现在线，不动 scrollTop —— 用户可能已经滚到别处。 */
  setInterval(function () {
    var n = K.now();
    K.setNow(n.nowMin + 1, n.today);
    renderHeader();
    renderNow();
  }, 60000);
});
</script>
</body>
</html>
