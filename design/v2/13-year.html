<!DOCTYPE html>
<!--
  KAIROS v2 — 13 · 年视图
  依据：design/v2/SPEC.md §7、ADR 0004 §5、docs/CONCEPT-AUDIT.md §5.3

  ── 这张稿子只回答一件事：一年怎么一眼看完，以及「热度」和「月历」为什么说的不是一件事 ──

  审计 §5.3 的病根不是「已完成没有过滤掉」，而是「两个问题共用一条数据却没有说清楚」：
    热力图问：这天我忙不忙？        → 完成的、过去的，全算。（这是它唯一的用处）
    月历问：  这个月我还剩什么？    → 完成的离开日历（ADR 0004 §5）。

  所以这里不让两边「看起来一致」，而是让两个问题各自可读：
    · 热量口径写成一句话贴在热力图标题旁：「含已完成」；
    · 月卡口径写成对称的一句：「不含已完成」；
    · 展开 11 月时，11-24 会露出破绽——热度 1，格子里却是空的。那不是 bug，
      那是家长会已完成。月卡下方一行字把它点破，破绽变成证据。

  热度五档 = --accent 混向 --bg-surface（15/30/45/60%），零档用 --bg-sunken。
  永远不混向 white：深色皮肤下白底会把整条阶梯烤成白杠（DESIGN-LANGUAGE §2.2）。

  数据：全部由 data.js 的 20 条事情派生，没有第二份数字。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kairos v2 · 年视图</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="demo.css">
<style>
  /* ---------- 外壳微调：右上角给演示条留出呼吸位 ---------- */
  .topnav { display: flex; align-items: center; gap: var(--sp-1); }
  .topnav__label {
    min-inline-size: 5rem; text-align: center;
    font-size: var(--text-body); font-weight: 600; color: var(--ink-1);
    font-variant-numeric: tabular-nums;
  }
  .topbar .seg { margin-inline-start: auto; }

  /* 内容区：两块面板自然高度，底部留白由版面节奏承担 */
  .content { display: flex; flex-direction: column; gap: var(--sp-4); }
  .content > * { flex: none; }

  /* ---------- 热度阶梯（唯一一套）---------- */
  /* 五档：base（无记录）+ 15 / 30 / 45 / 60% accent 混向 surface */
  .heat--0 { background: var(--bg-sunken); }
  .heat--1 { background: color-mix(in oklab, var(--accent) 15%, var(--bg-surface)); }
  .heat--2 { background: color-mix(in oklab, var(--accent) 30%, var(--bg-surface)); }
  .heat--3 { background: color-mix(in oklab, var(--accent) 45%, var(--bg-surface)); }
  .heat--4 { background: color-mix(in oklab, var(--accent) 60%, var(--bg-surface)); }

  /* ---------- 面板 ---------- */
  .panel {
    background: var(--bg-surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-xl);
  }
  .heat-panel { padding: var(--sp-4) var(--sp-4) var(--sp-3); margin-block-end: var(--sp-4); }

  .phead { display: flex; align-items: flex-start; gap: var(--sp-3); }
  .phead__title {
    margin: 0; display: flex; align-items: center; gap: var(--sp-2);
    font-size: var(--text-md); font-weight: 600; color: var(--ink-1);
  }
  .phead__icon { color: var(--ink-2); flex: none; }
  .phead__q { margin: 3px 0 0; font-size: var(--text-sm); color: var(--ink-2); }
  .phead__q b { color: var(--ink-1); font-weight: 600; }
  /* 热力图是合成数据：在标题旁明说，不让人把背景热度假当成真实记录 */
  .demo-note {
    display: inline-flex; align-items: center; gap: 4px;
    margin-inline-start: var(--sp-2);
    padding: 1px var(--sp-2); border-radius: var(--radius-xs);
    background: var(--bg-sunken); color: var(--ink-quiet);
    font-size: var(--text-xs); white-space: nowrap;
  }
  .demo-note svg { flex: none; }

  /* 两个问题各一枚对仗的印章：含已完成 / 不含已完成 */
  .stamp {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 1px var(--sp-2); border-radius: var(--radius-full);
    font-size: var(--text-xs); font-weight: 600; white-space: nowrap;
    background: var(--accent-tint); color: var(--accent-ink);
    border: 1px solid color-mix(in oklab, var(--accent) 22%, var(--accent-tint));
  }
  .stamp--off {
    background: var(--bg-sunken); color: var(--ink-2);
    border-color: var(--hairline-strong);
  }

  /* ---------- 统计 ---------- */
  .stats { margin-inline-start: auto; display: flex; gap: var(--sp-2); }
  .stat {
    border: 1px solid var(--hairline-soft); border-radius: var(--radius-md);
    padding: var(--sp-1) var(--sp-3); min-inline-size: 5.5rem;
    background: var(--bg-subtle);
  }
  .stat__k { font-size: var(--text-xs); color: var(--ink-quiet); white-space: nowrap; }
  .stat__v {
    font-size: var(--text-md); font-weight: 600; color: var(--ink-1);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .stat__v small { font-size: var(--text-xs); font-weight: 400; color: var(--ink-2); }

  /* ---------- 热力图网格 ---------- */
  .heat-wrap { display: flex; gap: var(--sp-2); margin-block-start: var(--sp-4); }
  .heat-dow {
    display: grid; grid-template-rows: repeat(7, 14px); row-gap: 3px;
    padding-block-start: 19px; /* 让出月份标签那一行 */
    font-size: var(--text-xs); line-height: 14px; color: var(--ink-quiet);
    text-align: end; inline-size: 1.5rem; flex: none;
  }
  .heat-main { min-inline-size: 0; }
  .heat-months {
    display: grid; grid-template-columns: repeat(53, 14px); column-gap: 3px;
    block-size: 16px; font-size: var(--text-xs); line-height: 16px; color: var(--ink-quiet);
  }
  .heat-months span { grid-row: 1; white-space: nowrap; }
  .heat {
    display: grid; grid-auto-flow: column;
    grid-template-rows: repeat(7, 14px);
    grid-auto-columns: 14px;
    gap: 3px;
  }
  .heat-cell {
    border-radius: 3px; cursor: pointer;
    transition: outline-color var(--dur-fast) var(--ease);
    outline: 1px solid transparent; outline-offset: 1px;
  }
  .heat-cell:hover { outline-color: var(--ink-2); }
  .heat-cell.is-sel { outline: 1.5px solid var(--ink-1); }
  .heat-cell.is-today { outline: 1.5px dashed var(--accent-ink); outline-offset: 1px; }
  .heat-cell.is-out { visibility: hidden; }

  /* ---------- 热力图页脚：读数 + 五档图例 ---------- */
  .heat-foot {
    display: flex; align-items: center; gap: var(--sp-3);
    margin-block-start: var(--sp-3); padding-block-start: var(--sp-3);
    border-block-start: 1px solid var(--hairline-soft);
  }
  .readout {
    font-size: var(--text-sm); color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .readout b { color: var(--ink-1); font-weight: 600; }
  .readout .done { color: var(--ink-quiet); }
  .readout__hint { font-size: var(--text-xs); color: var(--ink-quiet); }
  .legend {
    margin-inline-start: auto; display: flex; align-items: center; gap: 3px;
    font-size: var(--text-xs); color: var(--ink-quiet); white-space: nowrap;
  }
  .legend__sw { inline-size: 14px; block-size: 14px; border-radius: 3px; }
  .legend__lab { margin-inline: var(--sp-1) 2px; }
  .legend__edge { color: var(--ink-quiet); }
  .legend__unit { margin-inline-start: var(--sp-2); color: var(--ink-quiet); }

  /* ---------- 月卡 ---------- */
  .months { padding: var(--sp-4); }
  .months__head { display: flex; align-items: flex-start; gap: var(--sp-3); margin-block-end: var(--sp-3); }
  .mgrid {
    display: grid; gap: var(--sp-3);
    grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    align-items: start;
  }
  .mcard {
    background: var(--bg-surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
    min-inline-size: 0;
    transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  .mcard:hover { border-color: var(--hairline-strong); }
  .mcard.is-open { grid-column: span 2; border-color: var(--hairline-strong); box-shadow: var(--shadow-sm); }
  .mcard__btn {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    display: block; inline-size: 100%; padding: var(--sp-3);
    font: inherit; color: inherit; text-align: start;
    border-radius: var(--radius-lg);
  }
  .mcard__btn:hover { background: var(--bg-hover); }
  .mcard.is-open .mcard__btn { border-end-start-radius: 0; border-end-end-radius: 0; background: transparent; }
  .mcard__btn:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .mcard__top { display: flex; align-items: baseline; gap: var(--sp-2); }
  .mcard__name { font-size: var(--text-md); font-weight: 600; color: var(--ink-1); }
  .mcard__count {
    margin-inline-start: auto; display: flex; align-items: baseline; gap: 4px;
    font-size: var(--text-body); font-weight: 600;
    color: var(--ink-1); font-variant-numeric: tabular-nums;
  }
  .mcard__count small {
    font-size: var(--text-xs); font-weight: 400; color: var(--ink-quiet);
  }
  .mcard__k { font-size: var(--text-xs); font-weight: 400; color: var(--ink-quiet); margin-inline-end: 2px; }
  .mstrip {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
    grid-template-rows: 8px; gap: 2px; margin-block-start: var(--sp-2);
  }
  .mstrip i { display: block; border-radius: 2px; min-inline-size: 2px; }
  /* 区间行：一整条横线 + 标题，读作「这件事占了这个月」，而不是「某天有件事」 */
  .mspans { display: grid; gap: 3px; margin-block-start: var(--sp-2); }
  .mspan {
    display: flex; align-items: center; gap: var(--sp-2);
    min-inline-size: 0; font-size: var(--text-xs);
  }
  .mspan__bar {
    flex: 1 1 auto; min-inline-size: 2rem; block-size: 3px; border-radius: var(--radius-full);
    background: var(--chip-color);
  }
  .mspan__t {
    flex: none; max-inline-size: 8.5rem;
    color: var(--ink-1); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mspan__k { flex: none; color: var(--ink-quiet); white-space: nowrap; }
  .minilegend__span {
    display: inline-block; inline-size: 1.125rem; block-size: 3px;
    border-radius: var(--radius-full); background: var(--ink-4);
    vertical-align: .2rem;
  }
  .mcard__meta {
    display: flex; align-items: baseline; gap: var(--sp-2);
    margin-block-start: var(--sp-2);
    font-size: var(--text-xs); color: var(--ink-quiet);
  }
  .mcard__meta b { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .mcard__rest { margin-inline-start: auto; display: inline-flex; align-items: baseline; gap: 4px; }
  .mcard__chev { color: var(--ink-quiet); display: grid; place-items: center; flex: none; margin-inline-start: var(--sp-1); translate: 0 1px; }
  .mcard.is-open .mcard__chev { rotate: 180deg; }

  /* 每张卡并排放两个读数，只用两条对仗的标签把口径讲明白 */
  .mcard__pair {
    display: flex; align-items: flex-start; gap: var(--sp-3);
    margin-block-start: var(--sp-2);
    padding-block-start: var(--sp-2);
    border-block-start: 1px solid var(--hairline-soft);
  }
  .mcard__cell { display: flex; align-items: baseline; gap: var(--sp-1); min-inline-size: 0; font-size: var(--text-xs); color: var(--ink-quiet); }
  .mcard__cell--end { margin-inline-start: auto; color: var(--ink-2); }
  .mcard__cell b { color: var(--ink-1); font-weight: 600; font-variant-numeric: tabular-nums; }
  .mcard__cell small { font-size: var(--text-xs); font-weight: 400; color: var(--ink-quiet); }
  .mcard__none { font-weight: 400; color: var(--ink-2); }

  /* 展开后的迷你月历：左历右说明 */
  .mcard__body {
    display: flex; align-items: flex-start; gap: var(--sp-4);
    padding: var(--sp-3) var(--sp-3) var(--sp-3);
    border-block-start: 1px solid var(--hairline-soft);
  }
  /* display:flex 会盖掉 UA 的 [hidden]{display:none}，必须显式关掉 */
  .mcard__body[hidden] { display: none; }
  .mini {
    flex: 0 0 20rem;
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px;
  }
  .mini__dow {
    font-size: var(--text-xs); color: var(--ink-quiet); text-align: center;
    padding-block: 2px;
  }
  .mini__day {
    position: relative; min-block-size: 2.125rem;
    border-radius: var(--radius-xs);
    padding: 2px 3px calc(2px + 6px);
    font-size: var(--text-xs); line-height: 1.2;
    color: var(--ink-quiet); font-variant-numeric: tabular-nums;
    border: 1px solid transparent;
  }
  .mini__day--blank { background: transparent; }
  /* 迷你月历只回答「还剩什么」：有未完成事情的天给一层安静底，颜色只在圆点上。
     热度不进入这张网格——留白的那天可能只是「做完了」，见底部那行字。 */
  .mini__day.has { color: var(--ink-1); background: var(--bg-subtle); }
  .mini__day.is-today {
    border-color: var(--accent-ink);
    font-weight: 600; color: var(--accent-ink);
  }
  .mini__dots {
    position: absolute; inset-inline: 3px; inset-block-end: 2px;
    display: flex; align-items: center; gap: 2px; overflow: hidden;
  }
  .mini__dots i { inline-size: 4px; block-size: 4px; border-radius: 50%; flex: none; }
  .mini__more { font-size: var(--text-xs); color: var(--ink-quiet); line-height: 1; }
  /* 右侧说明：把「留白 ≠ 空着」讲清楚 */
  .minilegend { flex: 1 1 auto; min-inline-size: 0; font-size: var(--text-xs); color: var(--ink-quiet); line-height: 1.6; }
  .minilegend__row { display: flex; align-items: baseline; gap: var(--sp-2); }
  .minilegend__row + .minilegend__row { margin-block-start: var(--sp-2); }
  .minilegend__key { flex: none; inline-size: 1.25rem; text-align: center; }
  .minilegend__sw {
    display: inline-block; inline-size: .75rem; block-size: .75rem; border-radius: var(--radius-xs);
    vertical-align: -.0625rem;
  }
  .minilegend__sw--has { background: var(--bg-subtle); border: 1px solid var(--hairline-strong); }
  .minilegend__t { color: var(--ink-2); }
  .mini__note {
    margin: 0; font-size: var(--text-xs); color: var(--ink-quiet);
    line-height: 1.55;
  }
  .mini__note b { color: var(--ink-2); font-weight: 600; }

  @media (max-width: 74rem) {
    .stats { display: none; }
    .mcard.is-open { grid-column: span 3; }
  }

  /* ---------- 窄屏 ----------
     900px 下收起侧栏；53 周的热力图本来就是 ~900px 宽，
     给它自己的横向滚动条，而不是把整页撑破。 */
  @media (max-width: 900px) {
    .app { grid-template-columns: 56px minmax(0, 1fr); }
    .sidebar { display: none; }
    .topbar { padding-inline: var(--sp-3); }
    .content { padding-inline: var(--sp-3); }
    .heat-panel, .months { padding-inline: var(--sp-3); }
    .heat-wrap { overflow-x: auto; }
    .heat-main { min-inline-size: 0; }
    .mcard.is-open { grid-column: span 1; }
    .mcard__body { flex-direction: column; gap: var(--sp-3); }
    .mini { flex-basis: auto; inline-size: 100%; }
    .heat-foot { flex-wrap: wrap; gap: var(--sp-2); }
    .legend { margin-inline-start: 0; flex-wrap: wrap; }
    /* 面板头：标题/说明在一个 flex 列里，容器宽度由最长一行决定。
       窄屏必须让每一层都能收缩，否则 phead__q 的 330px 会把面板撑到 411。 */
    .content { min-inline-size: 0; }
    .phead, .months__head { flex-wrap: wrap; }
    .phead > div, .months__head > div { flex: 1 1 100%; min-inline-size: 0; }
    .phead__title { flex-wrap: wrap; min-inline-size: 0; }
    .phead__q { max-inline-size: 100%; }
    .demo-note { white-space: normal; }
    .heat-panel, .months, .mcard, .mcard__btn { min-inline-size: 0; }
  }
</style>
<script src="data.js" defer></script>
<script src="sidebar-counts.js" defer></script>
<script src="radio.js" defer></script>
<script src="base.js" defer></script>
</head>

      <button class="sidebar__row" type="button"><span class="sidebar__label">已完成</span><span class="sidebar__count">1</span></button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 class="topbar__title">日历</h1>
      <div class="topnav">
        <button class="icon-btn" type="button" aria-label="上一年">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="topnav__label">2026 年</span>
        <button class="icon-btn" type="button" aria-label="下一年">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div class="topbar__actions">
        <div class="seg" role="radiogroup" aria-label="日历视图">
          <button class="seg__item" type="button" role="radio" aria-checked="false">月</button>
          <button class="seg__item" type="button" role="radio" aria-checked="false">周</button>
          <button class="seg__item" type="button" role="radio" aria-checked="false">多日</button>
          <button class="seg__item" type="button" role="radio" aria-checked="false">日</button>
          <button class="seg__item" type="button" role="radio" aria-checked="true">年</button>
        </div>
        <button class="btn btn--ghost" type="button">今天</button>
        <button class="btn btn--primary" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          新建
        </button>
      </div>
    </header>

    <div class="content">

      <section class="panel heat-panel" aria-labelledby="heat-title">
        <header class="phead">
          <div>
            <h2 class="phead__title" id="heat-title">
              <svg class="phead__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
              全年热度
            </h2>
            <p class="phead__q">问的是<b>「哪天忙过」</b>：完成的、过去的，都算。
              <span class="demo-note" title="除 data.js 里真实记录的那些天以外，其余格子由 mulberry32 合成">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
                示意数据：真实记录的只有 data.js 里的那些天，其余为合成
              </span>
            </p>
          </div>
          <span class="stamp">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
            已完成也计数
          </span>
          <div class="stats">
            <div class="stat"><div class="stat__k">有记录的天</div><div class="stat__v" id="st-days">—</div></div>
            <div class="stat"><div class="stat__k">全年记录</div><div class="stat__v" id="st-total">—</div></div>
            <div class="stat"><div class="stat__k">最忙的一天</div><div class="stat__v" id="st-busy">—</div></div>
          </div>
        </header>
        <div class="heat-wrap">
          <div class="heat-dow" aria-hidden="true">
            <span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span>
          </div>
          <div class="heat-main">
            <div class="heat-months" id="heat-months" aria-hidden="true"></div>
            <div class="heat" id="heat" role="img" aria-label="2026 年每日热度，按周排列，每格一天"></div>
          </div>
        </div>

        <footer class="heat-foot">
          <div class="readout" id="readout">—</div>
          <div class="legend" aria-label="热度图例">
            <span class="legend__edge">少</span>
            <span class="legend__lab" id="lg0">无</span><span class="legend__sw heat--0"></span>
            <span class="legend__lab" id="lg1">1</span><span class="legend__sw heat--1"></span>
            <span class="legend__lab" id="lg2">2</span><span class="legend__sw heat--2"></span>
            <span class="legend__lab" id="lg3">3</span><span class="legend__sw heat--3"></span>
            <span class="legend__lab" id="lg4">4+</span><span class="legend__sw heat--4"></span>
            <span class="legend__edge">多</span>
            <span class="legend__unit">件 / 天</span>
          </div>
        </footer>
      </section>

      <section class="panel months" aria-labelledby="months-title">
        <header class="months__head">
          <div>
            <h2 class="phead__title" id="months-title">
              <svg class="phead__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
              按月看
            </h2>
            <p class="phead__q">问的是<b>「这个月还剩什么」</b>：已完成的事不在月历上，只留在热度里。</p>
          </div>
          <span class="stamp stamp--off">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            不含已完成
          </span>
        </header>

        <div class="mgrid" id="months"></div>
      </section>

    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var K = window.Kairos;
  if (!K) return;

  var DAY = 86400000;
  var COLS = 53;
  var START = Date.UTC(2025, 11, 29);   /* 含 1 月 1 日的那一周的周一 */
  var CELL = 14 + 3;                    /* 单元格 + 间隙，用于月份标签列号 */

  /* ---------- 数据：一条来源 ---------- */
  /* 每种形状都有一个「它属于哪一天」：range（出差）用 K.startOf() 给起点。
     直接读 it.date 会让 range 条目落进 undefined 键，月卡里再读 .slice() 就崩。 */
  var byDate = {};
  K.ITEMS.forEach(function (it) {
    var d = K.startOf(it);
    if (!d || d === '9999-99-99') return;              // 无日期的事不上年视图
    (byDate[d] = byDate[d] || []).push(it);
  });

  /* 一段时间的起止：唯一来自 K.spanEnd()。
     ADR 0006：年视图不画条 —— 区间在这里只是一行「还剩什么」的文字，
     所以占用与意图在年卡片上的呈现相同（ADR 0006 表格的最后一列：不动）。 */
  function spanArg(it) {
    return it.rung === 'range' ? { start: it.start, end: it.end } : it.date;
  }
  function spanOf(it) {
    if (it.rung !== 'week' && it.rung !== 'month' && it.rung !== 'range') return null;
    var r = K.spanEnd(it.rung, spanArg(it), false);
    return r ? { s: r.start, e: r.end } : null;
  }
  function spanText(it) { return K.formatSpan(it.rung, spanArg(it)); }
  function listColor(id) {
    var l = K.LISTS.filter(function (x) { return x.id === id; })[0];
    return l ? l.color : 'var(--ink-quiet)';
  }

  function iso(t) { return new Date(t).toISOString().slice(0, 10); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function md(ds) {
    return (+ds.slice(5, 7)) + ' 月 ' + (+ds.slice(8, 10)) + ' 日';
  }

  /* 合成「过去一年」的背景活动。今天之后不再合成：未来只有真排上的事。 */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(20261126);
  function synth(r, dow) {
    var weekend = dow === 0 || dow === 6;
    if (weekend) return r < .68 ? 0 : r < .90 ? 1 : r < .975 ? 2 : 3;
    return r < .46 ? 0 : r < .72 ? 1 : r < .88 ? 2 : r < .96 ? 3 : 4;
  }

  var counts = {}, doneOn = {}, known = {};
  Object.keys(byDate).forEach(function (d) { known[d] = byDate[d].length; });

  var cells = [];
  for (var i = 0; i < COLS * 7; i++) {
    var t = START + i * DAY;
    var ds = iso(t);
    var dow = new Date(t).getUTCDay();
    var r = rnd();
    var c = known[ds] != null ? known[ds] : (ds > K.now().today ? 0 : synth(r, dow));
    counts[ds] = c;
    doneOn[ds] = (byDate[ds] || []).filter(function (x) { return x.done; }).length;
    cells.push({ ds: ds, c: c, col: Math.floor(i / 7), row: i % 7 });
  }

  /* ---------- 热力图 ---------- */
  var heat = document.getElementById('heat');
  var frag = document.createDocumentFragment();
  cells.forEach(function (c) {
    var d = document.createElement('div');
    d.className = 'heat-cell heat--' + Math.min(c.c, 4);
    d.dataset.date = c.ds;
    if (c.ds < '2026-01-01' || c.ds > '2026-12-31') d.classList.add('is-out');
    if (c.ds === K.now().today) d.classList.add('is-today');
    d.title = md(c.ds) + ' · ' + (c.c ? c.c + ' 件' : '没有记录') +
      (doneOn[c.ds] ? '（含已完成 ' + doneOn[c.ds] + ' 件）' : '');
    frag.appendChild(d);
  });
  heat.appendChild(frag);

  /* 月份标签 */
  var mons = document.getElementById('heat-months');
  var labels = '';
  for (var m = 0; m < 12; m++) {
    var first = Date.UTC(2026, m, 1);
    var col = Math.floor((first - START) / DAY / 7) + 1;
    labels += '<span style="grid-column:' + col + '">' + (m + 1) + ' 月</span>';
  }
  mons.innerHTML = labels;

  /* ---------- 读数 ---------- */
  var readoutEl = document.getElementById('readout');
  function showReadout(ds) {
    var arr = byDate[ds] || [];
    var done = arr.filter(function (x) { return x.done; });
    var c = counts[ds];
    var html = '<b>' + md(ds) + '</b> · ' + (c ? c + ' 件' : '没有记录');
    if (done.length) {
      html += ' <span class="done">其中已完成：' +
        done.map(function (x) { return x.title; }).join('、') +
        ' —— 不在月历上，热度照计</span>';
    }
    readoutEl.innerHTML = html;
  }
  showReadout(K.now().today);

  heat.addEventListener('click', function (e) {
    var cell = e.target.closest('.heat-cell');
    if (!cell) return;
    heat.querySelectorAll('.heat-cell.is-sel').forEach(function (x) { x.classList.remove('is-sel'); });
    cell.classList.add('is-sel');
    showReadout(cell.dataset.date);
  });

  /* ---------- 统计 ---------- */
  var total = 0, active = 0, busyDs = null, busyN = 0;
  for (var ds2 in counts) {
    if (ds2 < '2026-01-01' || ds2 > '2026-12-31') continue;
    total += counts[ds2];
    if (counts[ds2] > 0) active++;
    if (counts[ds2] > busyN) { busyN = counts[ds2]; busyDs = ds2; }
  }
  document.getElementById('st-days').innerHTML = active + ' <small>天</small>';
  document.getElementById('st-total').innerHTML = total + ' <small>件</small>';
  document.getElementById('st-busy').innerHTML = (+busyDs.slice(5, 7)) + '-' + busyDs.slice(8) + ' <small>' + busyN + ' 件</small>';

  /* ---------- 五档图例：档位范围由实际数据决定 ---------- */
  document.getElementById('lg0').textContent = '无';
  document.getElementById('lg1').textContent = '1';
  document.getElementById('lg2').textContent = '2';
  document.getElementById('lg3').textContent = '3';
  document.getElementById('lg4').textContent = busyN > 4 ? '4+' : '4';

  /* ---------- 月卡 ---------- */
  var CHEV = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  var DOW = ['一', '二', '三', '四', '五', '六', '日'];
  var host = document.getElementById('months');
  var html = '';

  for (var mo = 0; mo < 12; mo++) {
    var y = 2026, mn = mo + 1;
    var daysInMonth = new Date(Date.UTC(y, mn, 0)).getUTCDate();
    var lead = (new Date(Date.UTC(y, mo, 1)).getUTCDay() + 6) % 7;
    var mStart = y + '-' + pad2(mn) + '-01';
    var mEnd = y + '-' + pad2(mn) + '-' + pad2(daysInMonth);
    var sum = 0, act = 0, strip = '', mini = '';

    for (var dd = 1; dd <= daysInMonth; dd++) {
      var dsx = y + '-' + pad2(mn) + '-' + pad2(dd);
      var cx = counts[dsx] || 0;
      sum += cx;
      if (cx) act++;
      strip += '<i class="heat--' + Math.min(cx, 4) + '"></i>';
    }

    /* 本月还没做完的事：
       · 非区间的事（某天/半天/几点）落在本月 → 计入，也进迷你月历的圆点
       · 区间的事（这周 / 下个月 / 出差）→ 只在本月卡片上占一行，**不进任何一天的格子**
         区间是「一段时间」，不是「七件一样的事」（ADR 0006：年视图这一列不动）。 */
    var dayItems = [], spanItems = [], seen = {};
    K.ITEMS.forEach(function (it) {
      if (it.done) return;
      var sp = spanOf(it);
      if (sp) {
        /* 区间与本月有交集就算在本月名下（跨月只计一次） */
        if (sp.s <= mEnd && sp.e > mStart && !seen['s' + it.id]) {
          seen['s' + it.id] = 1;
          spanItems.push(it);
        }
        return;
      }
      var d0 = K.startOf(it);
      if (d0.slice(0, 7) === y + '-' + pad2(mn)) dayItems.push(it);
    });
    var rest = dayItems.length + spanItems.length;

    for (var b = 0; b < lead; b++) mini += '<div class="mini__day mini__day--blank" aria-hidden="true"></div>';
    for (var dd2 = 1; dd2 <= daysInMonth; dd2++) {
      var dsy = y + '-' + pad2(mn) + '-' + pad2(dd2);
      /* 只取非区间的事：区间在本月卡片上是单独一行，不出现在日格里 */
      var arr = (byDate[dsy] || []).filter(function (x) { return !x.done && !spanOf(x); });
      var cls = 'mini__day';
      if (arr.length) cls += ' has';
      if (dsy === K.now().today) cls += ' is-today';
      var dots = '';
      if (arr.length) {
        dots = '<span class="mini__dots">';
        arr.slice(0, 3).forEach(function (it) {
          dots += '<i style="background:' + listColor(it.list) + '"></i>';
        });
        if (arr.length > 3) dots += '<span class="mini__more">+' + (arr.length - 3) + '</span>';
        dots += '</span>';
      }
      mini += '<div class="' + cls + '" title="' + md(dsy) + ' · ' + (arr.length || '没有未完成的事') + '">' + dd2 + dots + '</div>';
    }

    /* 区间行：在本月卡片上各占一行，不散到日格里。
       区间文字只有 K.formatSpan() 一种写法（闭区间）。 */
    var spanRows = spanItems.map(function (it) {
      var label = it.rung === 'month'
        ? (K.monthStartOf(it.date) === K.monthStartOf(K.now().today) ? '这个月' : K.rungLabel(it))
        : (it.rung === 'range' ? '占用' : K.rungLabel(it));
      return '<div class="mspan" title="' + it.title + ' · ' + spanText(it) + '">' +
        '<span class="mspan__bar" style="--chip-color:' + listColor(it.list) + '"></span>' +
        '<span class="mspan__t">' + it.title + '</span>' +
        '<span class="mspan__k">' + label + ' · ' + spanText(it) + '</span>' +
      '</div>';
    }).join('');

    var note = '';
    if (mn === 11) {
      note = '11 月 24 日：家长会<b>已完成</b>。格子里空着，热度却是 1 —— 同一件事，两个问题。';
    } else if (mn === 12) {
      note = '12 月只有月初 2 件已经排上的事；今天之后不生成任何活动。';
    } else if (mn <= 10) {
      note = '过去的月份只剩热度：没有还没做完的事，所以这一天不点亮。';
    }

    var legend =
      '<div class="minilegend">' +
        (spanRows
          ? '<div class="minilegend__row"><span class="minilegend__key"><span class="minilegend__span"></span></span>' +
            '<span class="minilegend__t">「这周 / 下个月」是一段时间：它属于整月，不写进任何一天的格子。</span></div>'
          : '') +
        '<div class="minilegend__row"><span class="minilegend__key"><span class="minilegend__sw minilegend__sw--has"></span></span>' +
          '<span class="minilegend__t">有未完成的事</span></div>' +
        '<div class="minilegend__row"><span class="minilegend__key"></span>' +
          '<span class="minilegend__t">留白：没有未完成的事 —— 也可能是<b>已经做完</b>了。热度在上一张图里。</span></div>' +
      '</div>';

    html +=
      '<article class="mcard" data-month="' + mo + '">' +
        '<button class="mcard__btn" type="button" aria-expanded="false" aria-controls="mb-' + mo + '">' +
          '<span class="mcard__top">' +
            '<span class="mcard__name">' + mn + ' 月</span>' +
            '<span class="mcard__count"><span class="mcard__k">热度</span>' + sum + '<small>件</small></span>' +
            '<span class="mcard__chev" aria-hidden="true">' + CHEV + '</span>' +
          '</span>' +
          '<span class="mstrip" aria-hidden="true">' + strip + '</span>' +
          (spanRows ? '<span class="mspans">' + spanRows + '</span>' : '') +
          '<span class="mcard__pair">' +
            '<span class="mcard__cell">' +
              '<span class="mcard__v">' + act + ' <small>天有记录</small></span>' +
            '</span>' +
            '<span class="mcard__cell mcard__cell--end">' +
              '<span class="mcard__v">' + (rest ? '还剩 <b>' + rest + '</b> 件' : '<span class="mcard__none">没有未完成的事</span>') + '</span>' +
            '</span>' +
          '</span>' +
        '</button>' +
        '<div class="mcard__body" id="mb-' + mo + '" hidden>' +
          '<div class="mini">' +
            DOW.map(function (d) { return '<div class="mini__dow">' + d + '</div>'; }).join('') +
            mini +
          '</div>' +
          '<div>' + legend +
            (note ? '<p class="mini__note" style="margin-block-start:var(--sp-2)">' + note + '</p>' : '') +
          '</div>' +
        '</div>' +
      '</article>';
  }
  host.innerHTML = html;

  host.addEventListener('click', function (e) {
    var btn = e.target.closest('.mcard__btn');
    if (!btn) return;
    var card = btn.closest('.mcard');
    var open = card.classList.contains('is-open');

    host.querySelectorAll('.mcard.is-open').forEach(function (c) {
      c.classList.remove('is-open');
      c.querySelector('.mcard__btn').setAttribute('aria-expanded', 'false');
      c.querySelector('.mcard__body').hidden = true;
    });

    if (!open) {
      card.classList.add('is-open');
      btn.setAttribute('aria-expanded', 'true');
      card.querySelector('.mcard__body').hidden = false;
    }
  });
});
</script>
</body>
</html>
