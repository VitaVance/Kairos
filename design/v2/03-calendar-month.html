<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairos v2 · 月视图</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="demo.css">
<script src="data.js" defer></script>
<script src="sidebar-counts.js" defer></script>
<script src="base.js" defer></script>
<style>
  /* ---------- 外壳补充 ---------- */
  .topbar__title { display: flex; align-items: baseline; gap: var(--sp-3); }
  .topbar__title .sub {
    font-size: var(--text-sm); font-weight: 400; color: var(--ink-quiet);
    font-variant-numeric: tabular-nums;
  }
  .topbar__actions { padding-inline-end: 10rem; }
  .nav { display: flex; align-items: center; gap: var(--sp-1); }
  .nav .btn { padding: 0 var(--sp-2); }

  /* ---------- 底部视图胶囊 ----------
     用 .floating-center（在 .main 里）居中，不再用 100vw 减去写死的侧栏宽度。
     组件不该知道 rail 和 sidebar 加起来是 276px。 */
  .vpill {
    display: flex; align-items: center; gap: 2px;
    padding: 4px;
    background: var(--bg-surface);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-full);
    box-shadow: var(--shadow-lg);
    max-inline-size: 100%;
    overflow-x: auto;
  }
  .vpill__item {
    appearance: none; border: 0; cursor: pointer;
    block-size: 30px; padding: 0 var(--sp-3);
    border-radius: var(--radius-full);
    background: transparent; color: var(--ink-2);
    font: inherit; font-size: var(--text-body); white-space: nowrap;
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .vpill__item:hover { background: var(--bg-hover); color: var(--ink-1); }
  .vpill__item[aria-pressed="true"] {
    background: var(--accent-tint); color: var(--accent-ink); font-weight: 600;
  }
  .vpill__item:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .vpill__sep { inline-size: 1px; block-size: 18px; background: var(--hairline); margin: 0 var(--sp-1); flex: none; }
  .vpill__cta {
    appearance: none; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    block-size: 30px; padding: 0 var(--sp-3);
    border-radius: var(--radius-full);
    background: var(--cta-bg); color: var(--cta-text);
    font: inherit; font-size: var(--text-body); font-weight: 600; white-space: nowrap;
  }
  .vpill__cta:hover { background: var(--cta-bg-hover); }
  .vpill__cta:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- 月历 ---------- */
  .content--cal { display: flex; flex-direction: column; padding: var(--sp-3) var(--sp-4) 74px; }

  .mcal {
    flex: 1; min-block-size: 500px;
    display: flex; flex-direction: column;
    background: var(--bg-surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-xl);
    overflow: hidden;
  }
  .mcal__dow {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    flex: none;
    border-block-end: 1px solid var(--hairline);
    background: var(--bg-subtle);
  }
  .mcal__dow span {
    padding: var(--sp-2) var(--sp-3);
    font-size: var(--text-xs); font-weight: 600; color: var(--ink-2);
  }
  .mcal__dow span:not(:first-child) { border-inline-start: 1px solid var(--hairline-soft); }
  .mcal__dow span[data-today] { color: var(--accent-ink); }

  /* ---------- 跨日的一段：一条横跨的条 ----------
     ADR 0006：日格只画「占用」（出差、假期）——这段时间真的没了，条的长度就是它的长度。
     「这周 / 下个月」这类意图不在这里画条，它变成周界上的一个计数（见 .wkcount）。
     半开区间切成按周的分片；每片画成一条横跨它覆盖那几列的条。
     续片不带开头的竖条 —— 眼睛看到的是「这一段更早就开始了」，不是又出现一个新块。 */
  .wk__spans {
    position: absolute; inset-inline: 0; inset-block-start: 26px;
    block-size: calc(var(--band-h, 0px) + 3px);
    z-index: 3; pointer-events: none;
  }
  .span {
    position: absolute; pointer-events: auto;
    inset-block-start: calc(var(--row, 0) * 20px);
    inset-inline-start: calc(var(--a) * 100% / 7 + 3px);
    inline-size: calc((var(--b) - var(--a)) * 100% / 7 - 6px);
    block-size: 17px;
    display: flex; align-items: center; gap: 6px;
    padding: 0 6px;
    border: 1px solid color-mix(in oklab, var(--chip) 34%, var(--bg-surface));
    border-inline-start: 3px solid var(--chip);
    border-radius: var(--radius-xs);
    background: color-mix(in oklab, var(--chip) 10%, var(--bg-surface));
    color: var(--ink-1);
    font: inherit; font-size: var(--text-xs); line-height: 1.35;
    text-align: start; cursor: pointer; overflow: hidden;
  }
  .span:hover { background: color-mix(in oklab, var(--chip) 17%, var(--bg-surface)); }
  .span:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* 续片：起点在上一行，所以不给竖条、左边收成圆角，读作「接着上一行」 */
  .span--cont-start { border-inline-start: 0; box-shadow: inset 3px 0 0 color-mix(in oklab, var(--chip) 45%, var(--bg-surface)); }
  /* 还要继续到下一行：右端方切，暗示未结束 */
  .span--cont-end { border-start-end-radius: 0; border-end-end-radius: 0; }

  .span__tag {
    flex: none; font-weight: 600; color: var(--ink-2);
    padding-inline-end: 6px;
    border-inline-end: 1px solid color-mix(in oklab, var(--chip) 32%, transparent);
  }
  .span--cont-start .span__tag { color: var(--ink-quiet); }
  .span__title { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .span__meta {
    flex: none; margin-inline-start: auto;
    font-size: var(--text-xs); color: var(--ink-quiet); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  /* 每一天的边界上一道很淡的线：让人看出它覆盖了哪几天，但整体仍是「一条」 */
  .span__ticks { position: absolute; inset-block: 2px; inset-inline: 0; pointer-events: none; }
  .span__ticks i {
    position: absolute; inset-block: 0; inline-size: 1px;
    background: color-mix(in oklab, var(--chip) 22%, transparent);
  }

  .span--late {
    background: color-mix(in oklab, var(--warning-ink) 8%, var(--bg-surface));
    border-color: color-mix(in oklab, var(--warning-ink) 42%, var(--bg-surface));
    border-inline-start-color: var(--warning-ink);
  }
  .span--late:hover { background: color-mix(in oklab, var(--warning-ink) 13%, var(--bg-surface)); }
  .span--late .span__tag { color: var(--warning-ink); border-inline-end-color: color-mix(in oklab, var(--warning-ink) 34%, transparent); }
  .span--late .span__meta { color: var(--warning-ink); font-weight: 600; }
  .span--late .span__ticks i { background: color-mix(in oklab, var(--warning-ink) 22%, transparent); }

  .mcal__grid { flex: 1; min-block-size: 0; display: flex; flex-direction: column; }

  /* ---------- 周界上的计数（ADR 0006）----------
     「这周有 2 件窗口内的事」——它和 26 号格子上的「+3」是同一族语法：
     一个计数，一个字形，不假装自己量了哪几天。
     它坐在周行的角落，不占任何一格，也不遮任何一格。 */
  .wk__count {
    position: absolute; inset-block-start: 2px; inset-inline-end: 4px;
    z-index: 4;
  }
  .wkcount {
    appearance: none; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    block-size: 18px; padding: 0 6px;
    border-radius: var(--radius-xs);
    background: var(--bg-sunken);
    color: var(--ink-2);
    font: inherit; font-size: var(--text-xs); font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .wkcount:hover { background: var(--bg-hover); color: var(--ink-1); }
  .wkcount:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .wkcount__k { font-weight: 500; color: var(--ink-quiet); }
  .wkcount__n::before { content: "·"; margin-inline-end: 4px; color: var(--ink-quiet); }

  .wk {
    position: relative; flex: 1; min-block-size: 0;
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    border-block-start: 1px solid var(--hairline);
  }
  .mcal__grid .wk:first-child { border-block-start: 0; }

  .dc {
    position: relative; min-block-size: 0; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 4px 5px 4px;
    border-inline-start: 1px solid var(--hairline-soft);
    transition: background var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  .dc:first-child { border-inline-start: 0; }
  .dc:hover { background: var(--bg-subtle); }
  .dc.is-sel { background: var(--accent-tint); box-shadow: inset 0 0 0 2px var(--accent); }
  .dc.is-out { background: var(--bg-subtle); }
  .dc.is-out:hover { background: var(--bg-hover); }

  .dc__top {
    display: flex; align-items: center; justify-content: space-between;
    block-size: 22px; flex: none; gap: var(--sp-1);
  }
  .dc__num {
    appearance: none; border: 0; cursor: pointer; padding: 0;
    inline-size: 22px; block-size: 22px; border-radius: 50%;
    display: grid; place-items: center;
    background: transparent; color: var(--ink-1);
    font: inherit; font-size: var(--text-sm); font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .dc__num:hover { background: var(--bg-hover); }
  .dc__num:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  /* Neighbouring-month dates are de-emphasised, not erased: --ink-4 is the
     disabled tier and measured 1.61:1 here. --ink-quiet reads at 5.5+ and still
     sits clearly below the current month's --ink-1. */
  .dc.is-out .dc__num { color: var(--ink-quiet); font-weight: 400; }
  .dc.is-today .dc__num { background: var(--accent); color: var(--accent-contrast); font-weight: 600; }
  .dc.is-today .dc__num:hover { background: var(--accent-strong); }

  .dc__more {
    appearance: none; border: 0; cursor: pointer; padding: 0 3px;
    block-size: 18px; border-radius: var(--radius-xs);
    background: transparent; color: var(--ink-2);
    font: inherit; font-size: var(--text-xs); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .dc__more:hover { background: var(--bg-hover); color: var(--ink-1); }
  .dc__more:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .dc__chips {
    display: grid; gap: 3px; align-content: start;
    margin-block-start: calc(var(--band-h, 0px) + 4px);
    min-block-size: 0;
  }
  .chip[hidden] { display: none; }

  /* ---------- 具体某天的小条目 ---------- */
  .chip {
    appearance: none; cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    inline-size: 100%; min-block-size: 19px;
    padding: 0 4px;
    border: 0; border-inline-start: 3px solid var(--chip, var(--accent));
    border-radius: var(--radius-xs);
    background: color-mix(in oklab, var(--chip, var(--accent)) 11%, var(--bg-surface));
    color: var(--ink-1);
    font: inherit; font-size: var(--text-xs); line-height: 1.35;
    text-align: start;
    transition: background var(--dur-fast) var(--ease);
  }
  .chip:hover { background: color-mix(in oklab, var(--chip, var(--accent)) 18%, var(--bg-surface)); }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .chip__t { flex: none; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .chip__x { flex: 1; min-inline-size: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .chip__flag { flex: none; font-size: var(--text-xs); font-weight: 600; color: var(--danger-ink); }
  .chip--late { background: var(--danger-tint); }
  .chip--late:hover { background: var(--danger-tint); }
  .chip--late .chip__t { color: var(--danger-ink); }
  .chip__ico { flex: none; display: inline-grid; place-items: center; color: var(--ink-quiet); }

  /* ---------- 图例 ---------- */
  .legend {
    display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap;
    flex: none; padding: var(--sp-2) var(--sp-1) 0;
    font-size: var(--text-xs); color: var(--ink-quiet);
  }
  .legend__item { display: inline-flex; align-items: center; gap: var(--sp-2); }
  .legend__chip {
    inline-size: 22px; block-size: 11px; border-radius: var(--radius-xs);
    background: color-mix(in oklab, var(--ink-3) 11%, var(--bg-surface));
    border-inline-start: 3px solid var(--ink-3);
  }
  .legend__win {
    inline-size: 30px; block-size: 11px; border-radius: var(--radius-xs);
    background: var(--bg-surface); border: 1px solid var(--hairline-strong);
    box-shadow: inset 2px 0 0 var(--ink-4);
  }
  .legend__win--month { border-style: dashed; }
  .legend__win--late { border-color: var(--warning-ink); box-shadow: inset 2px 0 0 var(--warning-ink); }

  /* ---------- 条目弹层 ---------- */
  .pop {
    position: fixed; z-index: var(--z-popover);
    inline-size: 264px;
    padding: var(--sp-3);
    background: var(--bg-surface);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
  }
  .pop[hidden] { display: none; }
  .pop__title { font-size: var(--text-md); font-weight: 600; color: var(--ink-1); line-height: 1.4; }
  .pop__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-block-start: var(--sp-2); }
  .pop__when {
    display: inline-flex; align-items: center;
    block-size: 20px; padding: 0 var(--sp-2);
    border-radius: var(--radius-xs);
    background: var(--bg-sunken); color: var(--ink-2);
    font-size: var(--text-xs); font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .pop__when.is-late { background: var(--danger-tint); color: var(--danger-ink); }
  .pop__when.is-late-soft { background: transparent; color: var(--warning-ink); font-weight: 600; }
  .pop__q { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); color: var(--ink-2); }
  .pop__list { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); color: var(--ink-2); }
  .pop__list i { inline-size: 6px; block-size: 6px; border-radius: 50%; flex: none; }
  .pop__note { margin: var(--sp-2) 0 0; font-size: var(--text-xs); color: var(--ink-quiet); line-height: 1.5; }
  .pop__actions {
    display: flex; align-items: center; gap: var(--sp-1);
    margin-block-start: var(--sp-3);
    padding-block-start: var(--sp-3);
    border-block-start: 1px solid var(--hairline);
  }
  .pop__actions .btn { block-size: var(--control-h-sm); font-size: var(--text-body); }
  .pop__actions .btn:last-child { margin-inline-start: auto; }

  /* ---------- 当天展开面板 ---------- */
  .peek {
    position: fixed; z-index: var(--z-popover);
    inline-size: 252px;
    background: var(--bg-surface);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: var(--sp-2);
  }
  .peek[hidden] { display: none; }
  .peek__head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 2px var(--sp-2) var(--sp-2);
    font-size: var(--text-xs); font-weight: 600; color: var(--ink-2);
  }
  .peek__head b { font-size: var(--text-xs); color: var(--ink-quiet); font-weight: 400; }
  .peek__row {
    appearance: none; border: 0; cursor: pointer;
    inline-size: 100%; display: flex; align-items: center; gap: var(--sp-2);
    block-size: 30px; padding: 0 var(--sp-2);
    border-radius: var(--radius-sm);
    background: transparent; color: var(--ink-1);
    font: inherit; font-size: var(--text-body); text-align: start;
  }
  .peek__row:hover { background: var(--bg-hover); }
  .peek__row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .peek__dot { inline-size: 6px; block-size: 6px; border-radius: 50%; flex: none; }
  .peek__when { flex: none; color: var(--ink-2); font-size: var(--text-xs); font-variant-numeric: tabular-nums; min-inline-size: 3.2em; }
  .peek__title { flex: 1; min-inline-size: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-body); }
  .peek__note {
    margin: var(--sp-1) var(--sp-2) 0; padding-block-start: var(--sp-2);
    border-block-start: 1px solid var(--hairline);
    font-size: var(--text-xs); color: var(--ink-quiet); line-height: 1.5;
  }

  /* ---------- toast ---------- */
  .toast {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    background: var(--bg-surface);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    font-size: var(--text-body); color: var(--ink-1);
    max-inline-size: 440px;
  }
  .toast[hidden] { display: none; }
  .toast svg { color: var(--success-ink); flex: none; }

  /* ---------- 窄屏 ----------
     220px 侧栏在 900px 下把日历压到 99px 一格，横带标题变成 0 宽。
     断点下收起侧栏，日历拿到整条宽度；再窄一些把图例折成两行。 */
  @media (max-width: 900px) {
    .app { grid-template-columns: 56px minmax(0, 1fr); }
    .sidebar { display: none; }
    .topbar { padding-inline: var(--sp-3); }
    .topbar__actions { padding-inline-end: 0; }
    .content--cal { padding-inline: var(--sp-2); }
    .mcal { min-block-size: 420px; }
    .dc { padding-inline: 3px; }
    .legend { gap: var(--sp-2) var(--sp-3); }
  }
  /* 560 以下：7 列 × ~45px，格子里的「+N」和跨天条已经无处可站。
     只保留日期数字与圆点，把区间改成计数（ADR 0006 已经定的方向）。 */
  @media (max-width: 560px) {
    .content--cal { padding-inline: 4px; }
    .mcal__dow span { padding-inline: 4px; font-size: 10px; }
    .dc { padding-inline: 2px; font-size: 10px; }
    .chip__x, .chip__k { display: none; }
    .legend { font-size: var(--text-xs); }
  }
</style>
</head>
<body data-skin="refined" data-theme="light">
<div class="app">
  <!-- ======================= 导航轨 ======================= -->
  <nav class="rail" aria-label="主导航">
    <div class="rail__avatar" aria-hidden="true">G</div>
    <div class="rail__group">
      <button class="rail__item" type="button" aria-label="事情（清单）" title="事情">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      </button>
      <button class="rail__item" type="button" aria-label="四象限" title="四象限">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
      </button>
      <button class="rail__item" type="button" aria-label="日历" aria-current="page" title="日历">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
      </button>
      <button class="rail__item" type="button" aria-label="搜索" title="搜索">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="rail__item" type="button" aria-label="归档" title="归档">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
      </button>
    </div>
    <div class="rail__group rail__group--bottom">
      <button class="rail__item" type="button" aria-label="同步" title="同步">

<!-- 当天展开面板 -->
<div class="peek" id="peek" role="dialog" aria-label="当天全部事情" hidden>
  <div class="peek__head"><span id="peekDate">—</span><b id="peekCount">—</b></div>
  <div id="peekRows"></div>
  <p class="peek__note">日格只放具体到某天的事。「这周」这类窗口不占任何一天，只在周界上计数。</p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var K = window.Kairos;
  var BY_ID = {};
  K.ITEMS.forEach(function (it) { BY_ID[it.id] = it; });
  var LIST = {};
  K.LISTS.forEach(function (l) { LIST[l.id] = l; });

  var grid = document.getElementById('grid');
  var pop = document.getElementById('pop');
  var peek = document.getElementById('peek');
  var toast = document.getElementById('toast');

  /* 初始视图跟着「今天」走，不写死 11 月：改 setNow(today) 后月历翻到那一天所在的月。 */
  var today0 = K.now().today;
  var viewYM = { y: +today0.slice(0, 4), m: +today0.slice(5, 7) };
  var current = null;                 // 弹层对应的条目按钮
  var currentItem = null;
  var peekCell = null;
  var selectedDate = today0;
  var toastTimer = 0;

  /* ---------------- 通用 ---------------- */
  function toastMsg(text) {
    document.getElementById('toastText').textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 2800);
  }
  function ymPrefix(y, m) { return y + '-' + String(m).padStart(2, '0'); }
  /* 「11月26日 周四」——日期与星期都从 K.now() 派生，不抄字面量。 */
  function selLabel(date) {
    var p = date.split('-');
    var dw = new Date(+p[0], +p[1] - 1, +p[2]).getDay();
    var dow = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][dw];
    return (+p[1]) + '月' + (+p[2]) + '日 ' + dow;
  }
  function clampPlace(box, x, y) {
    box.hidden = false;
    var w = box.offsetWidth, h = box.offsetHeight;
    box.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + 'px';
    box.style.top = Math.max(8, Math.min(y, window.innerHeight - h - 8)) + 'px';
  }

  /* 一天里「具体到某天」的条目：day / period / time（区间由 K.isOccupancy 决定
     是画条还是计数；none 不上日历；done 不出现）。 */
  var RANK = { day: 0, period: 1, time: 2 };
  function minuteOf(it) {
    if (it.rung === 'time') return +it.time.slice(0, 2) * 60 + +it.time.slice(3, 5);
    if (it.rung === 'period') return it.period === 'morning' ? 9 * 60 : it.period === 'afternoon' ? 14 * 60 : 19 * 60;
    return -1;
  }
  function chipsOn(date) {
    return K.ITEMS.filter(function (it) {
      return !it.done && K.startOf(it) === date && RANK[it.rung] != null;
    }).sort(function (a, b) {
      return RANK[a.rung] - RANK[b.rung] || minuteOf(a) - minuteOf(b);
    });
  }
  function leadLabel(it) {
    if (it.rung === 'time') return it.time;
    if (it.rung === 'period') return K.PERIOD_LABEL[it.period];
    return '';
  }
  /* K.formatSpan / K.spanEnd 对 week、month 收「起点日期字符串」，
     对 range 收用户亲手填的 {start, end}。片段只做这一层适配，
     终点算法仍然只有 data.js 一份。 */
  function spanArg(it) {
    return it.rung === 'range' ? { start: it.start, end: it.end } : it.date;
  }

  function whenLabel(it) {
    // 区间的文字只有 K.formatSpan() 一种写法（闭区间，给人看）。
    // 原来这里有三种：「11/16 – 11/22」「11/16 → 11/23」「11/23 – 11/30」。
    if (it.rung === 'week' || it.rung === 'month' || it.rung === 'range') {
      var span = K.formatSpan(it.rung, spanArg(it));
      return span + (K.isWindowPassed(it) ? ' · 未完成' : '');
    }
    var base = K.rungLabel(it);
    var late = K.isLate(it);
    if (late) return base + (it.rung === 'time' ? ' · 已过' : ' · 逾期');
    return base;
  }

  /* ISO 周序号（周一为一周之始）。从日期算，不从字面量抄。 */
  function weekNo(date) {
    var p = date.split('-');
    var t = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    var dow = (t.getUTCDay() + 6) % 7;          // 周一 = 0
    t.setUTCDate(t.getUTCDate() - dow + 3);     // 那一周的周四
    var jan4 = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
    var jdow = (jan4.getUTCDay() + 6) % 7;
    jan4.setUTCDate(jan4.getUTCDate() - jdow + 3);
    return 1 + Math.round((t - jan4) / (7 * 86400000));
  }

  /* 窗口（意图）不画条，改成计数：这一周有 N 件窗口内的事（ADR 0006）。 */
  function weekSpansOn(dates) {
    var monday = dates[0];
    return K.ITEMS.filter(function (it) {
      if (it.done || K.isOccupancy(it)) return false;
      if (it.rung !== 'week' && it.rung !== 'month') return false;
      // 窗口覆盖了本周的任意一天就算数 —— 用同一份起点/终点算法问，不自己算。
      return K.startOf(it) <= dates[6] && K.spanEnd(it.rung, spanArg(it), false).end > monday;
    });
  }

  /* ---------------- 画月历 ---------------- */
  function render() {
    closeItem(); closePeek();
    var scroller = document.querySelector('.content--cal');
    var scrollKeep = scroller ? scroller.scrollTop : 0;
    var y = viewYM.y, m = viewYM.m;
    var ym = ymPrefix(y, m);
    var first = y + '-' + String(m).padStart(2, '0') + '-01';
    var start = K.weekStartOf(first);

    document.getElementById('monthTitle').textContent = y + '年' + m + '月';
    var nowD = K.now();
    document.getElementById('selDate').textContent =
      (ym === nowD.today.slice(0, 7)) ? selLabel(nowD.today) + ' · 今天' : '';

    // 6 行覆盖整月（有 7 天以下的尾行就裁掉）
    var rows = [];
    for (var w = 0; w < 6; w++) {
      var row = [];
      for (var d = 0; d < 7; d++) row.push(K.addDays(start, w * 7 + d));
      rows.push(row);
    }
    while (rows.length > 1) {
      var last = rows[rows.length - 1];
      if (last.every(function (dt) { return dt.slice(0, 7) !== ym; })) rows.pop();
      else break;
    }

    grid.innerHTML = '';
    rows.forEach(function (dates) {
      var wk = document.createElement('div');
      wk.className = 'wk';

      // 这一行覆盖的窗口（跨日的一段）：只画「占用」，横跨它覆盖的那几列
      var bands = spansForRow(dates);
      var bandH = bands.length ? bands.length * 20 - 3 : 0;
      wk.style.setProperty('--band-h', bandH + 'px');
      if (bandH) {
        var lanes = document.createElement('div');
        lanes.className = 'wk__spans';
        bands.forEach(function (sp, idx) { lanes.appendChild(spanEl(sp, idx)); });
        wk.appendChild(lanes);
      }

      // 意图（这周 / 下个月）不画条，改成周界上的一个计数（ADR 0006）
      var wins = weekSpansOn(dates);
      if (wins.length) wk.appendChild(countEl(dates[0], wins));

      dates.forEach(function (date) {
        var cell = document.createElement('div');
        cell.className = 'dc';
        cell.dataset.date = date;
        cell.style.setProperty('--band-h', bandH + 'px');
        if (date.slice(0, 7) !== ym) cell.classList.add('is-out');
        if (date === K.now().today) cell.classList.add('is-today');
        if (date === selectedDate) cell.classList.add('is-sel');

        var top = document.createElement('div');
        top.className = 'dc__top';
        var num = document.createElement('button');
        num.type = 'button';
        num.className = 'dc__num';
        num.textContent = String(+date.slice(8));
        num.setAttribute('aria-label', date.slice(5, 7) + '月' + (+date.slice(8)) + '日');
        top.appendChild(num);

        var chipsBox = document.createElement('div');
        chipsBox.className = 'dc__chips';

        var items = chipsOn(date);
        items.forEach(function (it) { chipsBox.appendChild(chipEl(it)); });

        cell.appendChild(top);
        cell.appendChild(chipsBox);
        cell.dataset.total = items.length;
        cell.dataset.top = 1;
        wk.appendChild(cell);
      });

      grid.appendChild(wk);
    });

    measureCells();

    // 表头里今天所在的那一列高亮：列号由 K.now().today 算出，不写死「周四」
    var nowT = K.now().today;
    var todayDow = (new Date(+nowT.slice(0, 4), +nowT.slice(5, 7) - 1, +nowT.slice(8)).getDay() + 6) % 7;
    var dows = document.querySelectorAll('.mcal__dow span');
    dows.forEach(function (s, i) {
      if (ym === nowT.slice(0, 7) && i === todayDow) s.setAttribute('data-today', '');
      else s.removeAttribute('data-today');
    });

    /* 时钟重渲染后把滚动位置放回原处（日历格子高度不变，位置可复用）。 */
    if (scroller) scroller.scrollTop = scrollKeep;
  }

  /* 一格里放得下几个 chip 由实际高度决定，不写死。
     放不下的收进「+N」，点开是当天全部。
     可用高度 = 格子底部 - chips 容器的实际顶边（它受跨日条的高度与内边距影响）。 */
  function measureCells() {
    var CHIP = 19, GAP = 3;
    grid.querySelectorAll('.dc').forEach(function (cell) {
      var box = cell.querySelector('.dc__chips');
      var top = cell.querySelector('.dc__top');
      if (!box) return;
      var oldMore = top.querySelector('[data-more]');
      if (oldMore) oldMore.remove();
      var chips = Array.prototype.slice.call(box.querySelectorAll('.chip'));
      chips.forEach(function (c) { c.hidden = false; });
      var total = chips.length;
      if (!total) return;

      var cellR = cell.getBoundingClientRect();
      var boxR = box.getBoundingClientRect();
      var avail = cellR.bottom - boxR.top - 4;
      var fits = Math.max(0, Math.floor((avail + GAP) / (CHIP + GAP)));
      if (fits >= total) return;

      fits = Math.max(0, Math.min(fits, total - 1));
      chips.forEach(function (c, i) { if (i >= fits) c.hidden = true; });

      var more = document.createElement('button');
      more.type = 'button';
      more.className = 'dc__more';
      more.dataset.more = '1';
      more.textContent = '+' + (total - fits);
      more.setAttribute('aria-label', '展开 ' + cell.dataset.date.slice(5, 7) + '月' + (+cell.dataset.date.slice(8)) + '日 全部 ' + total + ' 件事');
      more.setAttribute('aria-expanded', 'false');
      top.appendChild(more);
    });
  }

  /* ---------------- 跨日的一段（span） ----------------
     ADR 0006：**只有占用**（blocksTime）有资格在日格上占地方。
     「这周 / 下个月」是意图，它不画条，改成周界上的计数（weekSpansOn）。

     终点一律来自 K.spanEnd() —— 半开区间（下周一）在切片时要保留，
     给人看的时候才减一天。片段里不再有第二份终点算法。 */

  function spansForRow(dates) {
    var rowStart = dates[0], rowEnd = K.addDays(dates[6], 1);
    var out = [];
    K.ITEMS.forEach(function (it) {
      if (it.done || !K.isOccupancy(it)) return;
      var r = K.spanEnd(it.rung, spanArg(it), false);          // 切片用半开区间
      if (!r) return;
      if (r.end <= rowStart || r.start >= rowEnd) return;     // 与这一行不相交
      var iStart = 0, iEnd = 7;
      for (var i = 0; i < 7; i++) {
        if (dates[i] < r.start) iStart = i + 1; else break;
      }
      for (var j = 6; j >= 0; j--) {
        if (K.addDays(dates[j], 1) > r.end) iEnd = j; else break;
      }
      if (iStart >= iEnd) return;
      out.push({
        item: it,
        a: iStart, b: iEnd,
        contStart: r.start < rowStart,     // 续片：不从这一行的左边开始
        contEnd: r.end > rowEnd            // 还要继续到下一行
      });
    });
    return out;
  }

  function spanEl(sp, rowIdx) {
    var it = sp.item, list = LIST[it.list];
    var passed = K.isWindowPassed(it);
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'span' + (passed ? ' span--late' : '') +
      (sp.contStart ? ' span--cont-start' : '') + (sp.contEnd ? ' span--cont-end' : '');
    b.style.setProperty('--chip', passed ? 'var(--warning-ink)' : list.color);
    b.style.setProperty('--a', sp.a);
    b.style.setProperty('--b', sp.b);
    b.style.setProperty('--row', rowIdx);
    b.dataset.id = it.id;
    b.dataset.title = it.title;
    b.dataset.q = K.quadrantOf(it);
    b.dataset.list = list.name;
    b.dataset.lcolor = list.color;
    b.dataset.when = whenLabel(it);
    b.dataset.span = it.rung;
    if (passed) b.dataset.late = 'soft';

    b.innerHTML =
      '<span class="span__tag"></span>' +
      '<span class="span__title"></span>' +
      '<span class="span__meta"></span>' +
      '<span class="span__ticks" aria-hidden="true"></span>';
    b.querySelector('.span__tag').textContent = K.isOccupancy(it) ? '占用' : K.rungLabel(it);
    b.querySelector('.span__title').textContent = it.title;
    b.querySelector('.span__meta').textContent = passed ? '未完成' : K.formatSpan(it.rung, spanArg(it));
    var ticks = b.querySelector('.span__ticks');
    for (var k = sp.a + 1; k < sp.b; k++) {
      var t = document.createElement('i');
      t.style.left = ((k - sp.a) * 100 / (sp.b - sp.a)) + '%';
      ticks.appendChild(t);
    }
    readd(b);
    return b;
  }

  /* 周界计数：和 26 号格子上的「+3」同一族语法 —— 一个数字，一个字形。 */
  function countEl(monday, wins) {
    var wrap = document.createElement('div');
    wrap.className = 'wk__count';
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'wkcount';
    b.dataset.count = '1';
    var label = K.weekStartOf(K.now().today) === monday ? '这周' : '第 ' + weekNo(monday) + ' 周';
    b.innerHTML = '<span class="wkcount__k"></span><span class="wkcount__n"></span>';
    b.querySelector('.wkcount__k').textContent = label;
    b.querySelector('.wkcount__n').textContent = wins.length;
    b.setAttribute('aria-label', label + '还有 ' + wins.length + ' 件窗口内的事');
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      openCount(b, wins);
    });
    wrap.appendChild(b);
    return wrap;
  }

  /* 点计数 → 列出这一周窗口内的事（不占格，所以只能在这里点开）。 */
  function openCount(anchor, wins) {
    closeItem(); closePeek();
    var rows = document.getElementById('peekRows');
    rows.innerHTML = '';
    document.getElementById('peekDate').textContent = anchor.querySelector('.wkcount__k').textContent + ' · 窗口内';
    document.getElementById('peekCount').textContent = wins.length + ' 件';
    wins.forEach(function (it) {
      var list = LIST[it.list];
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'peek__row';
      row.dataset.id = it.id;
      row.innerHTML =
        '<span class="peek__dot" style="background:' + list.color + '"></span>' +
        '<span class="peek__when">' + K.formatSpan(it.rung, spanArg(it)) + '</span>' +
        '<span class="peek__title"></span>';
      row.querySelector('.peek__title').textContent = it.title;
      row.addEventListener('click', function () { openItem(fakeEl(it)); });
      rows.appendChild(row);
    });
    var r = anchor.getBoundingClientRect();
    var h = 46 + wins.length * 30;
    peek.hidden = false;
    peek.style.left = Math.max(8, Math.min(r.right - 252, window.innerWidth - 260)) + 'px';
    peek.style.top = Math.max(8, Math.min(r.bottom + 6, window.innerHeight - h - 16)) + 'px';
  }

  function chipEl(it) {
    var list = LIST[it.list];
    var late = K.isLate(it);
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (late ? ' chip--late' : '');
    b.style.setProperty('--chip', list.color);
    b.dataset.title = it.title;
    b.dataset.when = whenLabel(it);
    b.dataset.q = K.quadrantOf(it);
    b.dataset.list = list.name;
    b.dataset.lcolor = list.color;
    b.dataset.id = it.id;
    if (late) b.dataset.late = 'danger';

    var lead = leadLabel(it);
    if (lead) {
      var t = document.createElement('span');
      t.className = 'chip__t';
      t.textContent = lead;
      b.appendChild(t);
    }
    if (it.repeat === 'weekly') {
      var ico = document.createElement('span');
      ico.className = 'chip__ico';
      ico.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>';
      b.appendChild(ico);
    }
    var x = document.createElement('span');
    x.className = 'chip__x';
    x.textContent = it.title;
    b.appendChild(x);
    if (late) {
      var flag = document.createElement('span');
      flag.className = 'chip__flag';
      flag.textContent = '已过';
      b.appendChild(flag);
    }
    readd(b);
    return b;
  }

  /* ============ 交互 ============ */
  function readd(el) {
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      openItem(el);
    });
  }

  function openItem(el) {
    current = el;
    currentItem = BY_ID[el.dataset.id];
    document.getElementById('popTitle').textContent = el.dataset.title;
    var when = document.getElementById('popWhen');
    when.textContent = el.dataset.when;
    when.className = 'pop__when' + (el.dataset.late === 'soft' ? ' is-late-soft' : el.dataset.late === 'danger' ? ' is-late' : '');
    document.getElementById('popQ').innerHTML = '<i class="qdot qdot--' + el.dataset.q + '"></i><span>' + K.QUADRANTS[el.dataset.q].name + '</span>';
    document.getElementById('popList').innerHTML = '<i style="background:' + el.dataset.lcolor + '"></i><span>' + el.dataset.list + '</span>';

    var note = document.getElementById('popNote');
    if (el.dataset.span) {
      note.hidden = false;
      note.textContent = K.isOccupancy(currentItem)
        ? '这几天是真的被占掉了（出差 / 假期），所以它在日历上占地方。出去的那几天，别的都放不下。'
        : '「这周」「下个月」是「想在这段时间里做完」，不是承诺占用。它不在日格上画条，只在周界上计数。';
      document.getElementById('popDone').innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>勾完成';
    } else {
      note.hidden = true;
      document.getElementById('popDone').innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>勾完成';
    }

    var r = el.getBoundingClientRect();
    clampPlace(pop, r.left, r.bottom + 6);
    closePeek();
  }
  function closeItem() { pop.hidden = true; current = null; currentItem = null; }
  function closePeek() {
    peek.hidden = true;
    peekCell = null;
    document.querySelectorAll('[data-more][aria-expanded="true"]').forEach(function (b) {
      b.setAttribute('aria-expanded', 'false');
    });
  }

  function openPeek(cell, anchor) {
    peekCell = cell;
    var items = chipsOn(cell.dataset.date);
    var rows = document.getElementById('peekRows');
    rows.innerHTML = '';
    var p = cell.dataset.date.split('-');
    document.getElementById('peekDate').textContent = (+p[1]) + '月' + (+p[2]) + '日 · 全部';
    document.getElementById('peekCount').textContent = items.length + ' 件';
    items.forEach(function (it) {
      var list = LIST[it.list];
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'peek__row';
      row.dataset.id = it.id;
      row.innerHTML =
        '<span class="peek__dot" style="background:' + list.color + '"></span>' +
        '<span class="peek__when">' + (leadLabel(it) || '全天') + '</span>' +
        '<span class="peek__title"></span>';
      row.querySelector('.peek__title').textContent = it.title;
      row.addEventListener('click', function () {
        var chip = cell.querySelector('.chip[data-id="' + it.id + '"]');
        if (!chip) {
          // 被 +N 收起的条目，用它的数据直接开弹层
          openItem(fakeEl(it));
        } else openItem(chip);
      });
      rows.appendChild(row);
    });
    var r = anchor.getBoundingClientRect();
    var h = 46 + items.length * 30;
    peek.hidden = false;
    peek.style.left = Math.max(8, Math.min(r.right - 252, window.innerWidth - 260)) + 'px';
    peek.style.top = Math.max(8, Math.min(r.bottom + 6, window.innerHeight - h - 16)) + 'px';
  }

  function fakeEl(it) {
    var list = LIST[it.list];
    var el = document.createElement('button');
    el.dataset.id = it.id;
    el.dataset.title = it.title;
    el.dataset.when = whenLabel(it);
    el.dataset.q = K.quadrantOf(it);
    el.dataset.list = list.name;
    el.dataset.lcolor = list.color;
    if (K.isLate(it)) el.dataset.late = 'danger';
    return el;
  }

  function selectCell(cell) {
    document.querySelectorAll('.dc.is-sel').forEach(function (c) { c.classList.remove('is-sel'); });
    cell.classList.add('is-sel');
    selectedDate = cell.dataset.date;
    var label = selLabel(selectedDate);
    if (selectedDate === K.now().today) label += ' · 今天';
    document.getElementById('selDate').textContent = label;
  }

  /* 网格点击：日期数字 / 空白选日；+N 展开 */
  grid.addEventListener('click', function (e) {
    var more = e.target.closest('[data-more]');
    if (more) {
      e.stopPropagation();
      var cell = more.closest('.dc');
      if (peekCell === cell) { closePeek(); return; }
      closePeek(); closeItem();
      more.setAttribute('aria-expanded', 'true');
      openPeek(cell, more);
      return;
    }
    if (e.target.closest('.chip, .span, .wkcount')) return;
    var c = e.target.closest('.dc');
    if (c) { selectCell(c); closeItem(); closePeek(); }
  });

  document.getElementById('popDone').addEventListener('click', function () {
    if (!current) return;
    var el = current, title = el.dataset.title, isSpan = el.dataset.span;
    closeItem();
    if (isSpan) {
      // 一段可能被切成几片（跨周），全部清掉，然后重排这一行
      var wk = el.closest('.wk');
      render();
      toastMsg('已完成「' + title + '」，它离开了日历');
      return;
    }
    el.style.transition = 'opacity 150ms ease, transform 150ms ease';
    el.style.opacity = '0';
    el.style.transform = 'scale(.97)';
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 170);
    toastMsg('已完成「' + title + '」，它离开了日历');
  });
  document.getElementById('popOpen').addEventListener('click', function () {
    if (!current) return;
    toastMsg('演示：打开唯一的详情面板（日历 / 清单 / 象限共用）');
  });

  /* 月份切换 */
  function shiftMonth(delta) {
    var m = viewYM.m + delta, y = viewYM.y;
    if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
    if (y < 2026 || (y === 2026 && m < 11)) { toastMsg('演示从 2026 年 11 月开始'); return; }
    if (y > 2026 || (y === 2026 && m > 12)) { toastMsg('演示到 2026 年 12 月为止'); return; }
    viewYM = { y: y, m: m };
    // 翻到「今天」所在的月就选今天，其余月份选 1 号
    var t = K.now().today;
    selectedDate = (t.slice(0, 7) === ymPrefix(y, m)) ? t : ymPrefix(y, m) + '-01';
    render();
  }
  document.getElementById('prevM').addEventListener('click', function () { shiftMonth(-1); });
  document.getElementById('nextM').addEventListener('click', function () { shiftMonth(1); });
  document.getElementById('todayBtn').addEventListener('click', function () {
    var t = K.now().today.split('-');
    viewYM = { y: +t[0], m: +t[1] };
    selectedDate = K.now().today;
    render();
  });
  document.getElementById('newBtn').addEventListener('click', function () { toastMsg('演示：打开唯一的新建事情面板'); });
  document.getElementById('newBtn2').addEventListener('click', function () { toastMsg('演示：打开唯一的新建事情面板'); });

  /* 视图胶囊 */
  document.querySelectorAll('.vpill__item').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.vpill__item').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      closeItem(); closePeek();
    });
  });

  /* 关闭 */
  document.addEventListener('pointerdown', function (e) {
    if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('.chip, .span, .peek__row')) closeItem();
    if (!peek.hidden && !peek.contains(e.target) && !e.target.closest('[data-more], .wkcount')) closePeek();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeItem(); closePeek(); }
  });

  render();
  // 图例里的计数也走同一份数据，不写字面量
  function renderLegend() {
    var mk = K.weekStartOf(K.now().today);
    var wkDates = [];
    for (var d = 0; d < 7; d++) wkDates.push(K.addDays(mk, d));
    var wins = weekSpansOn(wkDates);
    document.getElementById('lgWeekK').textContent = '第 ' + weekNo(mk) + ' 周';
    document.getElementById('lgWeekN').textContent = wins.length;
  }
  renderLegend();

  /* 时钟：每分钟把「现在」推一分钟并重渲染，今天高亮 / 星期高亮都随之移动。 */
  setInterval(function () {
    var n = K.now();
    K.setNow(n.nowMin + 1, n.today);
    render();
    renderLegend();
  }, 60000);
  // 视口变化会改变每行的高度，进而改变「一格里放得下几个」，重新量一次
  var resizeT = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(measureCells, 120);
  });
});
</script>
